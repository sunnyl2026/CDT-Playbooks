---
- name: Run approved CDT prerequisite generation
  hosts: all
  gather_facts: false
  become: false

  vars:
    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    deployment_plan: "/var/log/CDT_Project/Deployment_Plans/pre-requisite.xml"

  tasks:
    # ============================================================
    # Validate survey input
    # ============================================================

    - name: Validate job_id from AWX Survey
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_-]+$')
        fail_msg: |
          A valid job_id is required.

          Example:
          CHG0012345

    - name: Normalize job_id and define paths
      ansible.builtin.set_fact:
        normalized_job_id: "{{ job_id | string | trim }}"
        job_folder: "{{ filters_base_dir }}/{{ job_id | string | trim }}"
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ job_id | string | trim }}/selected_targets.yml

    - name: Define per-run result directories
      ansible.builtin.set_fact:
        approved_results_dir: "{{ job_folder }}/approved_cdt_results"
        execution_results_dir: "{{ job_folder }}/approved_cdt_execution_results"

    # ============================================================
    # Read selected_targets.yml
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop if selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          selected_targets.yml was not found:

          {{ selected_targets_file }}
      when: not selected_targets_stat.stat.exists

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected_targets.yml
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.job_id is defined
          - selected_targets_data.job_id | string | trim == normalized_job_id
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas is sequence
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          selected_targets.yml is invalid or the job_id does not match.

          Survey job_id:
          {{ normalized_job_id }}

          File job_id:
          {{ selected_targets_data.job_id | default('NOT DEFINED') }}

    - name: Validate each selected CMA
      ansible.builtin.assert:
        that:
          - item.cma_name is defined
          - item.cma_name | string | trim | length > 0
          - item.cma_name | string | trim is match('^[A-Za-z0-9_.-]+$')
          - item.cma_ip is defined
          - item.cma_ip | string | trim | length > 0
          - item.targets is defined
          - item.targets is sequence
          - item.targets | length > 0
        fail_msg: |
          Invalid CMA entry:

          {{ item | to_nice_yaml }}
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name | default('UNKNOWN CMA') }}"

    - name: Validate every selected target
      ansible.builtin.assert:
        that:
          - item.1 is mapping
          - item.1.name is defined
          - item.1.name | string | trim | length > 0
          - item.1.type is defined
          - item.1.type | string | trim | length > 0
        fail_msg: |
          Invalid target entry for CMA {{ item.0.cma_name }}:

          {{ item.1 | to_nice_yaml }}
      loop: "{{ selected_targets_data.selected_cmas | subelements('targets') }}"
      loop_control:
        label: >-
          {{ item.0.cma_name }} / {{ item.1.name | default('UNKNOWN TARGET') }}

    # ============================================================
    # Check required paths
    # ============================================================

    - name: Check CDT deployment plan
      ansible.builtin.stat:
        path: "{{ deployment_plan }}"
      register: deployment_plan_stat

    - name: Stop if deployment plan does not exist
      ansible.builtin.fail:
        msg: |
          CDT deployment plan was not found:

          {{ deployment_plan }}
      when: not deployment_plan_stat.stat.exists

    - name: Ensure candidates directory exists
      ansible.builtin.file:
        path: "{{ candidates_dir }}"
        state: directory
        mode: "0755"

    - name: Remove stale approved CDT result directory
      ansible.builtin.file:
        path: "{{ approved_results_dir }}"
        state: absent

    - name: Create clean approved CDT result directory
      ansible.builtin.file:
        path: "{{ approved_results_dir }}"
        state: directory
        mode: "0700"

    # ============================================================
    # Show approved candidate generation scope
    # ============================================================

    - name: Show approved CDT generation scope
      ansible.builtin.debug:
        msg: |
          ============================================================
          APPROVED PREREQUISITE CHECK GENERATION

          Job ID:
          {{ normalized_job_id }}

          CMA:
          {{ item.cma_name }}

          CMA IP:
          {{ item.cma_ip }}

          Candidate output:
          {{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv
          ============================================================
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"

    # ============================================================
    # Start CDT candidate generation in parallel
    #
    # Each login shell writes authoritative rc/stdout/stderr files.
    # This avoids depending on async_status to return those fields.
    # ============================================================

    - name: Start approved CDT generation for all CMAs in parallel
      ansible.builtin.shell:
        cmd: |
          /bin/bash --login <<'CDT_LOGIN_SHELL'
          result_base={{ (approved_results_dir ~ '/' ~ item.cma_name) | quote }}
          stdout_file="${result_base}.stdout"
          stderr_file="${result_base}.stderr"
          rc_file="${result_base}.rc"
          rc_tmp="${rc_file}.tmp.$$"

          exec >"${stdout_file}" 2>"${stderr_file}"

          write_result_on_exit() {
              rc=$?
              trap - EXIT
              printf '%s\n' "${rc}" >"${rc_tmp}"
              mv -f "${rc_tmp}" "${rc_file}"
              exit "${rc}"
          }
          trap write_result_on_exit EXIT

          set -o pipefail
          shopt -s expand_aliases

          echo "CMA={{ item.cma_name }}"
          echo "CMA_IP={{ item.cma_ip }}"
          echo "CANDIDATES={{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"

          if ! type mdsenv >/dev/null 2>&1; then
              echo "ERROR: mdsenv is not available in the login shell" >&2
              exit 1
          fi

          if ! mdsenv {{ item.cma_name | quote }}; then
              echo "ERROR: mdsenv failed for {{ item.cma_name }}" >&2
              exit 1
          fi

          if [[ -z "${CDTDIR:-}" ]]; then
              echo "ERROR: CDTDIR is not defined after mdsenv {{ item.cma_name }}" >&2
              exit 1
          fi

          echo "CDTDIR=${CDTDIR}"

          "${CDTDIR}/CentralDeploymentTool" -generate \
            -session={{ (item.cma_name ~ '_session') | quote }} \
            -candidates={{ (candidates_dir ~ '/' ~ item.cma_name ~ '_PR_candidates.csv') | quote }} \
            -deploymentplan={{ deployment_plan | quote }} \
            -server={{ item.cma_ip | quote }}
          CDT_LOGIN_SHELL
      args:
        executable: /bin/bash
      async: 7200
      poll: 0
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: approved_cdt_async_jobs
      changed_when: true

    # ============================================================
    # Wait for every candidate generation job
    # ============================================================

    - name: Wait for approved CDT generation to complete
      ansible.builtin.async_status:
        jid: "{{ async_job.ansible_job_id }}"
        mode: status
      loop: "{{ approved_cdt_async_jobs.results }}"
      loop_control:
        loop_var: async_job
        label: "{{ async_job.item.cma_name }}"
      register: approved_cdt_poll
      until: (approved_cdt_poll.finished | default(false)) | bool
      retries: 240
      delay: 30
      failed_when: false

    - name: Stop if an asynchronous job did not finish
      ansible.builtin.assert:
        that:
          - (item.finished | default(false)) | bool
        fail_msg: |
          Approved CDT generation did not finish within 7200 seconds.

          CMA:
          {{ item.async_job.item.cma_name }}

          CMA IP:
          {{ item.async_job.item.cma_ip }}
      loop: "{{ approved_cdt_poll.results }}"
      loop_control:
        label: "{{ item.async_job.item.cma_name }}"

    # ============================================================
    # Read authoritative candidate generation results
    # ============================================================

    - name: Check approved CDT return-code files
      ansible.builtin.stat:
        path: "{{ approved_results_dir }}/{{ item.cma_name }}.rc"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: approved_cdt_rc_stats

    - name: Check approved CDT stdout files
      ansible.builtin.stat:
        path: "{{ approved_results_dir }}/{{ item.cma_name }}.stdout"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: approved_cdt_stdout_stats

    - name: Check approved CDT stderr files
      ansible.builtin.stat:
        path: "{{ approved_results_dir }}/{{ item.cma_name }}.stderr"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: approved_cdt_stderr_stats

    - name: Stop if an approved CDT result file is missing
      ansible.builtin.assert:
        that:
          - (approved_cdt_rc_stats.results[item].stat.exists | default(false)) | bool
          - (approved_cdt_stdout_stats.results[item].stat.exists | default(false)) | bool
          - (approved_cdt_stderr_stats.results[item].stat.exists | default(false)) | bool
        fail_msg: |
          One or more approved CDT result files are missing.

          CMA:
          {{ selected_targets_data.selected_cmas[item].cma_name }}

          Expected files:
          {{ approved_results_dir }}/{{ selected_targets_data.selected_cmas[item].cma_name }}.rc
          {{ approved_results_dir }}/{{ selected_targets_data.selected_cmas[item].cma_name }}.stdout
          {{ approved_results_dir }}/{{ selected_targets_data.selected_cmas[item].cma_name }}.stderr
      loop: "{{ range(0, selected_targets_data.selected_cmas | length) | list }}"
      loop_control:
        label: "{{ selected_targets_data.selected_cmas[item].cma_name }}"

    - name: Read approved CDT return codes
      ansible.builtin.slurp:
        src: "{{ approved_results_dir }}/{{ item.cma_name }}.rc"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: approved_cdt_rc_files

    - name: Read approved CDT standard output
      ansible.builtin.slurp:
        src: "{{ approved_results_dir }}/{{ item.cma_name }}.stdout"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: approved_cdt_stdout_files

    - name: Read approved CDT standard error
      ansible.builtin.slurp:
        src: "{{ approved_results_dir }}/{{ item.cma_name }}.stderr"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: approved_cdt_stderr_files

    - name: Show approved CDT command results
      ansible.builtin.debug:
        msg: |
          ============================================================
          CMA: {{ selected_targets_data.selected_cmas[item].cma_name }}
          CMA IP: {{ selected_targets_data.selected_cmas[item].cma_ip }}
          Return code: {{ approved_cdt_rc_files.results[item].content | b64decode | trim }}

          Standard output:
          {{ approved_cdt_stdout_files.results[item].content | b64decode | trim }}

          Standard error:
          {{ approved_cdt_stderr_files.results[item].content | b64decode | trim }}
          ============================================================
      loop: "{{ range(0, selected_targets_data.selected_cmas | length) | list }}"
      loop_control:
        label: "{{ selected_targets_data.selected_cmas[item].cma_name }}"

    - name: Stop if any approved CDT command failed
      ansible.builtin.assert:
        that:
          - approved_cdt_rc_files.results[item].content
            | b64decode
            | trim
            is match('^[0-9]+$')
          - (
              approved_cdt_rc_files.results[item].content
              | b64decode
              | trim
              | int
            ) == 0
        fail_msg: |
          Approved CDT generation failed.

          CMA:
          {{ selected_targets_data.selected_cmas[item].cma_name }}

          CMA IP:
          {{ selected_targets_data.selected_cmas[item].cma_ip }}

          Return code:
          {{ approved_cdt_rc_files.results[item].content | b64decode | trim }}

          Standard output:
          {{ approved_cdt_stdout_files.results[item].content | b64decode | trim }}

          Standard error:
          {{ approved_cdt_stderr_files.results[item].content | b64decode | trim }}
      loop: "{{ range(0, selected_targets_data.selected_cmas | length) | list }}"
      loop_control:
        label: "{{ selected_targets_data.selected_cmas[item].cma_name }}"

    # ============================================================
    # Validate and read updated candidate files
    # ============================================================

    - name: Check updated candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: updated_candidate_stats

    - name: Stop if an updated candidate file is missing or empty
      ansible.builtin.assert:
        that:
          - (item.stat.exists | default(false)) | bool
          - (item.stat.isreg | default(false)) | bool
          - (item.stat.size | default(0) | int) > 0
        fail_msg: |
          Updated candidate file is missing or empty.

          CMA:
          {{ item.item.cma_name }}

          Expected file:
          {{ candidates_dir }}/{{ item.item.cma_name }}_PR_candidates.csv
      loop: "{{ updated_candidate_stats.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    - name: Read updated candidate CSV files
      ansible.builtin.slurp:
        src: "{{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: updated_candidate_files

    # ============================================================
    # Classify candidate files
    #
    # A valid CDT file with its normal preamble and recognizable
    # candidate header, but no candidate rows, is a warning condition.
    # Missing files, empty files, unrecognized headers, and malformed
    # candidate rows remain genuine failures.
    # ============================================================

    - name: Classify each generated candidate CSV
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
              import csv
              import re
              import sys

              candidate_file = sys.argv[1]

              required_keys = (
                  "gatewayname",
                  "clustername",
                  "ipaddress",
                  "versionjhftake",
                  "state",
                  "upgradeorder",
              )

              header_aliases = {
                  "gatewayname": {
                      "gatewayname",
                      "gateway",
                  },
                  "clustername": {
                      "clustername",
                      "cluster",
                  },
                  "ipaddress": {
                      "ipaddress",
                      "ipaddr",
                      "ip",
                  },
                  "versionjhftake": {
                      "versionjhftake",
                      "versionjhftakelevel",
                      "versionjhf",
                      "versiontake",
                  },
                  "state": {
                      "state",
                      "status",
                  },
                  "upgradeorder": {
                      "upgradeorder",
                      "upgradeord",
                      "order",
                  },
              }

              def clean_text(value):
                  return (
                      value.replace("\ufeff", "")
                      .replace("\x00", "")
                      .strip()
                      .strip('"')
                      .strip("'")
                      .strip()
                  )

              def normalized_header(value):
                  return re.sub(
                      r"[^a-z0-9]+",
                      "",
                      clean_text(value).casefold(),
                  )

              def map_header(cells):
                  normalized_cells = [
                      normalized_header(cell)
                      for cell in cells
                  ]
                  mapping = {}

                  for required_key in required_keys:
                      for index, value in enumerate(normalized_cells):
                          if value in header_aliases[required_key]:
                              mapping[required_key] = index
                              break

                  if all(key in mapping for key in required_keys):
                      return mapping

                  return None

              def parse_delimited_line(line, delimiter):
                  try:
                      return next(
                          csv.reader(
                              [line],
                              delimiter=delimiter,
                              skipinitialspace=True,
                          )
                      )
                  except (csv.Error, StopIteration):
                      return []

              def parse_whitespace_line(line):
                  return re.split(r"\s{2,}", line.strip())

              with open(candidate_file, "rb") as stream:
                  raw_content = stream.read()

              text = raw_content.decode("utf-8-sig", errors="replace")
              text = (
                  text.replace("\ufeff", "")
                  .replace("\x00", "")
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
              )

              # Defensive handling if CDT writes literal escaped
              # newline sequences instead of physical newlines.
              if text.count("\n") <= 1 and "\\n" in text:
                  text = text.replace("\\r\\n", "\n")
                  text = text.replace("\\n", "\n")
                  text = text.replace("\\r", "\n")

              lines = text.splitlines()
              parser_kind = None
              parser_value = None
              header_index = None
              header_mapping = None
              delimiter_candidates = (",", ";", "|", "\t")

              # Search the whole file because CDT writes a preamble
              # before its candidate header.
              for line_index, line in enumerate(lines):
                  cleaned_line = clean_text(line)

                  if not cleaned_line:
                      continue

                  for delimiter in delimiter_candidates:
                      if delimiter not in line:
                          continue

                      cells = parse_delimited_line(line, delimiter)
                      mapping = map_header(cells)

                      if mapping is not None:
                          parser_kind = "delimiter"
                          parser_value = delimiter
                          header_index = line_index
                          header_mapping = mapping
                          break

                  if header_mapping is not None:
                      break

                  cells = parse_whitespace_line(cleaned_line)
                  mapping = map_header(cells)

                  if mapping is not None:
                      parser_kind = "whitespace"
                      header_index = line_index
                      header_mapping = mapping
                      break

              if header_mapping is None:
                  diagnostic_lines = [
                      clean_text(line)
                      for line in lines
                      if clean_text(line)
                  ]
                  diagnostic = " | ".join(diagnostic_lines[-12:])
                  raise SystemExit(
                      "Could not identify the CDT candidate header in "
                      + candidate_file
                      + ". File tail: "
                      + diagnostic[:2000]
                  )

              max_required_index = max(header_mapping.values())
              candidate_rows = []
              invalid_candidate_rows = []

              for line in lines[header_index + 1:]:
                  cleaned_line = clean_text(line)

                  if not cleaned_line:
                      continue

                  if re.fullmatch(r"[-=*#_+\s]+", cleaned_line):
                      continue

                  if parser_kind == "delimiter":
                      cells = parse_delimited_line(line, parser_value)
                  else:
                      cells = parse_whitespace_line(cleaned_line)

                  cells = [clean_text(cell) for cell in cells]

                  if len(cells) <= max_required_index:
                      if (
                          parser_kind == "delimiter"
                          and parser_value in line
                      ) or (
                          parser_kind == "whitespace"
                          and len(cells) > 1
                      ):
                          invalid_candidate_rows.append(cleaned_line)
                      continue

                  if map_header(cells) is not None:
                      continue

                  values = tuple(
                      cells[header_mapping[key]]
                      for key in required_keys
                  )

                  # A real candidate must identify a gateway or cluster
                  # and must contain its IP address.
                  if not (values[0] or values[1]) or not values[2]:
                      invalid_candidate_rows.append(cleaned_line)
                      continue

                  candidate_rows.append(values)

              if candidate_rows:
                  print("READY")
                  raise SystemExit(0)

              if invalid_candidate_rows:
                  diagnostic = " | ".join(invalid_candidate_rows[-12:])
                  raise SystemExit(
                      "The CDT candidate header was found in "
                      + candidate_file
                      + ", but content after the header could not be "
                      + "parsed as valid candidate rows. Invalid row(s): "
                      + diagnostic[:2000]
                  )

              # The file has a valid CDT header but no candidate rows.
              print("NO_CANDIDATES")
          - "{{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: candidate_file_classifications
      changed_when: false

    - name: Initialize candidate execution groups
      ansible.builtin.set_fact:
        executable_cmas: []
        no_candidate_cmas: []
        no_candidate_cma_names: []

    - name: Build candidate execution groups
      ansible.builtin.set_fact:
        executable_cmas: >-
          {{
            executable_cmas
            + (
                [item.item]
                if (item.stdout | trim) == 'READY'
                else []
              )
          }}
        no_candidate_cmas: >-
          {{
            no_candidate_cmas
            + (
                [item.item]
                if (item.stdout | trim) == 'NO_CANDIDATES'
                else []
              )
          }}
        no_candidate_cma_names: >-
          {{
            no_candidate_cma_names
            + (
                [item.item.cma_name]
                if (item.stdout | trim) == 'NO_CANDIDATES'
                else []
              )
          }}
      loop: "{{ candidate_file_classifications.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    - name: Show warning for a CMA with no online candidates
      ansible.builtin.debug:
        msg: |
          WARNING: No online gateway or cluster candidates were found for CMA {{ item.cma_name }}.
          The CDT candidate file contains a valid header but no candidate rows.
          CentralDeploymentTool -execute will be skipped for this CMA.
      loop: "{{ no_candidate_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"

    # ============================================================
    # Show readable per-CMA candidate summaries
    # ============================================================

    - name: Show updated candidate summary
      ansible.builtin.debug:
        msg: |
          ################################################################
          CMA: {{ item.item.cma_name }}
          CMA IP: {{ item.item.cma_ip }}

          Updated candidate file:
          {{ candidates_dir }}/{{ item.item.cma_name }}_PR_candidates.csv

          Updated candidate content:
          ----------------------------------------------------------------
          {{ item.content | b64decode | trim }}
          ----------------------------------------------------------------
          ################################################################
      loop: "{{ updated_candidate_files.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    - name: Show approved generation completion summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          APPROVED CDT CANDIDATE GENERATION COMPLETED
          ============================================================

          Job ID:
          {{ normalized_job_id }}

          Selected CMA count:
          {{ selected_targets_data.selected_cmas | length }}

          CMA count with candidates to execute:
          {{ executable_cmas | length }}

          CMA count skipped with warnings:
          {{ no_candidate_cmas | length }}

          Generated candidates:
          {% for cma in selected_targets_data.selected_cmas %}
          - {{ cma.cma_name }}
            Server: {{ cma.cma_ip }}
            Candidates: {{ candidates_dir }}/{{ cma.cma_name }}_PR_candidates.csv
          {% if cma.cma_name in no_candidate_cma_names %}
            Status: WARNING - valid candidate header, but no online gateway or cluster candidate rows; execution will be skipped
          {% else %}
            Status: READY FOR EXECUTION
          {% endif %}
          {% endfor %}

          Candidate files have been validated. Only CMAs with valid
          candidate rows will now be executed.
          ============================================================

    # ============================================================
    # Prepare deployment plan execution
    # ============================================================

    - name: Remove stale deployment execution result directory
      ansible.builtin.file:
        path: "{{ execution_results_dir }}"
        state: absent

    - name: Create clean deployment execution result directory
      ansible.builtin.file:
        path: "{{ execution_results_dir }}"
        state: directory
        mode: "0700"

    - name: Show approved deployment execution scope
      ansible.builtin.debug:
        msg: |
          ============================================================
          APPROVED PREREQUISITE DEPLOYMENT PLAN EXECUTION

          Job ID:
          {{ normalized_job_id }}

          CMA:
          {{ item.cma_name }}

          CMA IP:
          {{ item.cma_ip }}

          Session:
          {{ item.cma_name }}_session

          Candidate input:
          {{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv

          Deployment plan:
          {{ deployment_plan }}

          Selected targets included in the candidate file:
          {% for target in item.targets %}
          - {{ target.name }} ({{ target.type }})
          {% endfor %}
          ============================================================
      loop: "{{ executable_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"

    # ============================================================
    # Execute deployment plan in parallel
    #
    # Each login shell writes authoritative rc/stdout/stderr files.
    # Candidate files are revalidated inside the execution shell.
    # ============================================================

    - name: Start approved deployment plan execution for CMAs with candidates in parallel
      ansible.builtin.shell:
        cmd: |
          /bin/bash --login <<'CDT_EXECUTE_LOGIN_SHELL'
          result_base={{ (execution_results_dir ~ '/' ~ item.cma_name) | quote }}
          stdout_file="${result_base}.stdout"
          stderr_file="${result_base}.stderr"
          rc_file="${result_base}.rc"
          rc_tmp="${rc_file}.tmp.$$"

          exec >"${stdout_file}" 2>"${stderr_file}"

          write_result_on_exit() {
              rc=$?
              trap - EXIT
              printf '%s\n' "${rc}" >"${rc_tmp}"
              mv -f "${rc_tmp}" "${rc_file}"
              exit "${rc}"
          }
          trap write_result_on_exit EXIT

          set -o pipefail
          shopt -s expand_aliases

          candidate_file={{ (candidates_dir ~ '/' ~ item.cma_name ~ '_PR_candidates.csv') | quote }}

          echo "CMA={{ item.cma_name }}"
          echo "CMA_IP={{ item.cma_ip }}"
          echo "SESSION={{ item.cma_name }}_session"
          echo "CANDIDATES=${candidate_file}"
          echo "DEPLOYMENT_PLAN={{ deployment_plan }}"

          if [[ ! -s "${candidate_file}" ]]; then
              echo "ERROR: candidate file is missing or empty: ${candidate_file}" >&2
              exit 1
          fi

          if ! type mdsenv >/dev/null 2>&1; then
              echo "ERROR: mdsenv is not available in the login shell" >&2
              exit 1
          fi

          if ! mdsenv {{ item.cma_name | quote }}; then
              echo "ERROR: mdsenv failed for {{ item.cma_name }}" >&2
              exit 1
          fi

          if [[ -z "${CDTDIR:-}" ]]; then
              echo "ERROR: CDTDIR is not defined after mdsenv {{ item.cma_name }}" >&2
              exit 1
          fi

          echo "CDTDIR=${CDTDIR}"

          "${CDTDIR}/CentralDeploymentTool" -execute \
            -session={{ (item.cma_name ~ '_session') | quote }} \
            -candidates={{ (candidates_dir ~ '/' ~ item.cma_name ~ '_PR_candidates.csv') | quote }} \
            -deploymentplan={{ deployment_plan | quote }} \
            -server={{ item.cma_ip | quote }}
          CDT_EXECUTE_LOGIN_SHELL
      args:
        executable: /bin/bash
      async: 7200
      poll: 0
      loop: "{{ executable_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: deployment_execution_async_jobs
      changed_when: true

    # ============================================================
    # Wait for every parallel deployment execution
    # ============================================================

    - name: Wait for approved deployment plan execution to complete
      ansible.builtin.async_status:
        jid: "{{ execution_job.ansible_job_id }}"
        mode: status
      loop: "{{ deployment_execution_async_jobs.results }}"
      loop_control:
        loop_var: execution_job
        label: "{{ execution_job.item.cma_name }}"
      register: deployment_execution_poll
      until: (deployment_execution_poll.finished | default(false)) | bool
      retries: 240
      delay: 30
      failed_when: false

    - name: Stop if a deployment execution job did not finish
      ansible.builtin.assert:
        that:
          - (item.finished | default(false)) | bool
        fail_msg: |
          Deployment plan execution did not finish within 7200 seconds.

          CMA:
          {{ item.execution_job.item.cma_name }}

          CMA IP:
          {{ item.execution_job.item.cma_ip }}
      loop: "{{ deployment_execution_poll.results }}"
      loop_control:
        label: "{{ item.execution_job.item.cma_name }}"

    # ============================================================
    # Read authoritative deployment execution results
    # ============================================================

    - name: Check deployment execution return-code files
      ansible.builtin.stat:
        path: "{{ execution_results_dir }}/{{ item.cma_name }}.rc"
      loop: "{{ executable_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: deployment_execution_rc_stats

    - name: Check deployment execution stdout files
      ansible.builtin.stat:
        path: "{{ execution_results_dir }}/{{ item.cma_name }}.stdout"
      loop: "{{ executable_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: deployment_execution_stdout_stats

    - name: Check deployment execution stderr files
      ansible.builtin.stat:
        path: "{{ execution_results_dir }}/{{ item.cma_name }}.stderr"
      loop: "{{ executable_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: deployment_execution_stderr_stats

    - name: Stop if a deployment execution result file is missing
      ansible.builtin.assert:
        that:
          - (deployment_execution_rc_stats.results[item].stat.exists | default(false)) | bool
          - (deployment_execution_stdout_stats.results[item].stat.exists | default(false)) | bool
          - (deployment_execution_stderr_stats.results[item].stat.exists | default(false)) | bool
        fail_msg: |
          One or more deployment execution result files are missing.

          CMA:
          {{ executable_cmas[item].cma_name }}

          Expected files:
          {{ execution_results_dir }}/{{ executable_cmas[item].cma_name }}.rc
          {{ execution_results_dir }}/{{ executable_cmas[item].cma_name }}.stdout
          {{ execution_results_dir }}/{{ executable_cmas[item].cma_name }}.stderr
      loop: "{{ range(0, executable_cmas | length) | list }}"
      loop_control:
        label: "{{ executable_cmas[item].cma_name }}"

    - name: Read deployment execution return codes
      ansible.builtin.slurp:
        src: "{{ execution_results_dir }}/{{ item.cma_name }}.rc"
      loop: "{{ executable_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: deployment_execution_rc_files

    - name: Read deployment execution standard output
      ansible.builtin.slurp:
        src: "{{ execution_results_dir }}/{{ item.cma_name }}.stdout"
      loop: "{{ executable_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: deployment_execution_stdout_files

    - name: Read deployment execution standard error
      ansible.builtin.slurp:
        src: "{{ execution_results_dir }}/{{ item.cma_name }}.stderr"
      loop: "{{ executable_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: deployment_execution_stderr_files

    - name: Show approved deployment execution results
      ansible.builtin.debug:
        msg: |
          ============================================================
          CMA: {{ executable_cmas[item].cma_name }}
          CMA IP: {{ executable_cmas[item].cma_ip }}
          Session: {{ executable_cmas[item].cma_name }}_session
          Candidate file: {{ candidates_dir }}/{{ executable_cmas[item].cma_name }}_PR_candidates.csv
          Deployment plan: {{ deployment_plan }}
          Return code: {{ deployment_execution_rc_files.results[item].content | b64decode | trim }}

          Standard output:
          {{ deployment_execution_stdout_files.results[item].content | b64decode | trim }}

          Standard error:
          {{ deployment_execution_stderr_files.results[item].content | b64decode | trim }}
          ============================================================
      loop: "{{ range(0, executable_cmas | length) | list }}"
      loop_control:
        label: "{{ executable_cmas[item].cma_name }}"

    - name: Stop if any approved deployment execution failed
      ansible.builtin.assert:
        that:
          - deployment_execution_rc_files.results[item].content
            | b64decode
            | trim
            is match('^[0-9]+$')
          - (
              deployment_execution_rc_files.results[item].content
              | b64decode
              | trim
              | int
            ) == 0
        fail_msg: |
          Approved deployment plan execution failed.

          CMA:
          {{ executable_cmas[item].cma_name }}

          CMA IP:
          {{ executable_cmas[item].cma_ip }}

          Session:
          {{ executable_cmas[item].cma_name }}_session

          Candidate file:
          {{ candidates_dir }}/{{ executable_cmas[item].cma_name }}_PR_candidates.csv

          Deployment plan:
          {{ deployment_plan }}

          Return code:
          {{ deployment_execution_rc_files.results[item].content | b64decode | trim }}

          Standard output:
          {{ deployment_execution_stdout_files.results[item].content | b64decode | trim }}

          Standard error:
          {{ deployment_execution_stderr_files.results[item].content | b64decode | trim }}
      loop: "{{ range(0, executable_cmas | length) | list }}"
      loop_control:
        label: "{{ executable_cmas[item].cma_name }}"

    # ============================================================
    # Final execution summary
    # ============================================================

    - name: Show final approved execution summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          APPROVED CDT PREREQUISITE EXECUTION COMPLETED
          ============================================================

          Job ID:
          {{ normalized_job_id }}

          Selected CMA count:
          {{ selected_targets_data.selected_cmas | length }}

          Executed CMA count:
          {{ executable_cmas | length }}

          Skipped CMA count:
          {{ no_candidate_cmas | length }}

          Deployment plan:
          {{ deployment_plan }}

          Execution results:
          {% if executable_cmas | length == 0 %}
          - None. No CMA had an online gateway or cluster candidate row.
          {% else %}
          {% for cma in executable_cmas %}
          {% set cma_index = loop.index0 %}
          - CMA: {{ cma.cma_name }}
            Server: {{ cma.cma_ip }}
            Session: {{ cma.cma_name }}_session
            Candidates: {{ candidates_dir }}/{{ cma.cma_name }}_PR_candidates.csv
            Targets:
            {% for target in cma.targets %}
              - {{ target.name }} ({{ target.type }})
            {% endfor %}
            Return code: {{ deployment_execution_rc_files.results[cma_index].content | b64decode | trim }}
            Status: SUCCESS
          {% endfor %}
          {% endif %}

          Skipped CMAs:
          {% if no_candidate_cmas | length == 0 %}
          - None
          {% else %}
          {% for cma in no_candidate_cmas %}
          - CMA: {{ cma.cma_name }}
            Server: {{ cma.cma_ip }}
            Candidates: {{ candidates_dir }}/{{ cma.cma_name }}_PR_candidates.csv
            Status: WARNING - no online gateway or cluster candidates; CentralDeploymentTool -execute was not run
          {% endfor %}
          {% endif %}

          All CMAs with valid candidate rows completed successfully.
          CMAs without candidate rows were skipped with warnings.
          ============================================================

