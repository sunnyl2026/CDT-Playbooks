---
- name: Generate filtered CDT prerequisite candidate lists
  hosts: all
  gather_facts: false
  become: false

  vars:
    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    deployment_plan: "/var/log/CDT_Project/Deployment_Plans/pre-upgrade-check.xml"

  tasks:

    # ============================================================
    # Validate survey input
    # ============================================================

    - name: Validate job_id from AWX Survey
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_-]+$')
        fail_msg: |
          A valid job_id is required.

          Example:
          CHG0012345

          Allowed characters:
          Letters, numbers, underscore and hyphen.
        success_msg: "Using job_id: {{ job_id | trim }}"

    - name: Normalize job_id and define paths
      ansible.builtin.set_fact:
        normalized_job_id: "{{ job_id | string | trim }}"
        job_folder: "{{ filters_base_dir }}/{{ job_id | string | trim }}"
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ job_id | string | trim }}/selected_targets.yml

    # ============================================================
    # Validate the source file
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop if selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          selected_targets.yml was not found.

          Expected path:
          {{ selected_targets_file }}
      when: not selected_targets_stat.stat.exists

    - name: Stop if selected_targets.yml is not a regular file
      ansible.builtin.fail:
        msg: |
          The following path exists but is not a regular file:

          {{ selected_targets_file }}
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.isreg

    # ============================================================
    # Read and parse selected_targets.yml
    # ============================================================

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected_targets.yml structure
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.job_id is defined
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas is sequence
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          Invalid selected_targets.yml structure.

          Required structure:

          job_id: CHG0012345
          selected_cmas:
            - cma_name: CMA2_SMS1
              cma_ip: 172.20.50.41
              targets:
                - name: CXL103
                  type: Cluster

    - name: Verify survey job_id matches file job_id
      ansible.builtin.assert:
        that:
          - selected_targets_data.job_id | string | trim == normalized_job_id
        fail_msg: |
          The job_id does not match.

          AWX Survey job_id:
          {{ normalized_job_id }}

          selected_targets.yml job_id:
          {{ selected_targets_data.job_id | default('NOT DEFINED') }}
        success_msg: "Survey job_id matches selected_targets.yml"

    # ============================================================
    # Validate each CMA entry
    # ============================================================

    - name: Validate each selected CMA
      ansible.builtin.assert:
        that:
          - item.cma_name is defined
          - item.cma_name | string | trim | length > 0
          - item.cma_name | string | trim is match('^[A-Za-z0-9_.-]+$')
          - item.cma_ip is defined
          - item.cma_ip | string | trim | length > 0
          - item.targets is defined
          - item.targets is sequence
          - item.targets | length > 0
        fail_msg: |
          Invalid CMA entry:

          {{ item | to_nice_yaml }}
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name | default('UNKNOWN CMA') }}"

    - name: Validate every selected target
      ansible.builtin.assert:
        that:
          - item.1.name is defined
          - item.1.name | string | trim | length > 0
          - item.1.name | string | trim is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          Invalid target under CMA {{ item.0.cma_name }}:

          {{ item.1 | to_nice_yaml }}
      loop: >-
        {{
          selected_targets_data.selected_cmas
          | subelements('targets')
        }}
      loop_control:
        label: >-
          {{ item.0.cma_name | default('UNKNOWN') }}
          /
          {{ item.1.name | default('UNKNOWN') }}

    # ============================================================
    # Validate required directories and deployment plan
    # ============================================================

    - name: Check CDT deployment plan
      ansible.builtin.stat:
        path: "{{ deployment_plan }}"
      register: deployment_plan_stat

    - name: Stop if deployment plan does not exist
      ansible.builtin.fail:
        msg: |
          CDT deployment plan was not found:

          {{ deployment_plan }}
      when: not deployment_plan_stat.stat.exists

    - name: Ensure candidates directory exists
      ansible.builtin.file:
        path: "{{ candidates_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # Create one filter per CMA
    # ============================================================

    - name: Create CMA prerequisite filter files
      ansible.builtin.copy:
        dest: "{{ job_folder }}/{{ item.cma_name }}_PR_filter"
        content: |-
          {% for target in item.targets %}
          {{ target.name }}
          {% endfor %}

        mode: "0644"
        backup: true
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"

    - name: Read generated CMA filter files
      ansible.builtin.slurp:
        src: "{{ job_folder }}/{{ item.cma_name }}_PR_filter"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: generated_filter_files

    - name: Show generated CMA filters
      ansible.builtin.debug:
        msg: |
          ============================================================
          CMA: {{ item.item.cma_name }}
          CMA IP: {{ item.item.cma_ip }}

          Filter file:
          {{ job_folder }}/{{ item.item.cma_name }}_PR_filter

          Selected targets:
          {{ item.content | b64decode | trim }}
          ============================================================
      loop: "{{ generated_filter_files.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    # ============================================================
    # Start filtered CDT jobs in parallel
    #
    # bash -lc is used so that CentralDeploymentTool runs from a
    # login shell and CDTDIR is available.
    # ============================================================

    - name: Start filtered CDT generation for all CMAs in parallel
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail

          mdsenv {{ item.cma_name | quote }}

          if [[ -z "${CDTDIR:-}" ]]; then
              echo "ERROR: CDTDIR is not defined after mdsenv {{ item.cma_name }}"
              exit 1
          fi

          echo "CMA={{ item.cma_name }}"
          echo "CMA_IP={{ item.cma_ip }}"
          echo "CDTDIR=${CDTDIR}"
          echo "FILTER={{ job_folder }}/{{ item.cma_name }}_PR_filter"
          echo "CANDIDATES={{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"

          "${CDTDIR}/CentralDeploymentTool" -generate \
            -session={{ (item.cma_name ~ '_session') | quote }} \
            -candidates={{ (candidates_dir ~ '/' ~ item.cma_name ~ '_PR_candidates.csv') | quote }} \
            -deploymentplan={{ deployment_plan | quote }} \
            -filter={{ (job_folder ~ '/' ~ item.cma_name ~ '_PR_filter') | quote }} \
            -server={{ item.cma_ip | quote }}
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ ansible_env.HOME | default('/root') }}"
      async: 7200
      poll: 0
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: filtered_cdt_async_jobs
      changed_when: true

    # ============================================================
    # Wait for every parallel CDT job
    # ============================================================

    - name: Wait for filtered CDT jobs to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ filtered_cdt_async_jobs.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"
      register: filtered_cdt_results
      until: filtered_cdt_results.finished
      retries: 240
      delay: 30
      failed_when: false

    - name: Show filtered CDT command results
      ansible.builtin.debug:
        msg: |
          ============================================================
          CMA: {{ item.item.item.cma_name }}
          CMA IP: {{ item.item.item.cma_ip }}
          Return code: {{ item.rc | default('UNKNOWN') }}

          Standard output:
          {{ item.stdout | default('') }}

          Standard error:
          {{ item.stderr | default('') }}
          ============================================================
      loop: "{{ filtered_cdt_results.results }}"
      loop_control:
        label: "{{ item.item.item.cma_name }}"

    - name: Stop if any filtered CDT command failed
      ansible.builtin.assert:
        that:
          - item.finished | default(false)
          - item.rc | default(1) == 0
        fail_msg: |
          Filtered CDT generation failed.

          CMA:
          {{ item.item.item.cma_name }}

          CMA IP:
          {{ item.item.item.cma_ip }}

          Return code:
          {{ item.rc | default('UNKNOWN') }}

          Standard output:
          {{ item.stdout | default('') }}

          Standard error:
          {{ item.stderr | default('') }}
      loop: "{{ filtered_cdt_results.results }}"
      loop_control:
        label: "{{ item.item.item.cma_name }}"

    # ============================================================
    # Read candidate CSV files
    # ============================================================

    - name: Check generated candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: filtered_candidate_stats

    - name: Stop if a candidate CSV was not generated
      ansible.builtin.fail:
        msg: |
          CDT completed but the candidate file was not found.

          CMA:
          {{ item.item.cma_name }}

          Expected candidate file:
          {{ candidates_dir }}/{{ item.item.cma_name }}_PR_candidates.csv
      when: not item.stat.exists
      loop: "{{ filtered_candidate_stats.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    - name: Read generated candidate CSV files
      ansible.builtin.slurp:
        src: "{{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: filtered_candidate_files

    # ============================================================
    # Approval summary
    # ============================================================

    - name: Show prerequisite-check candidate summary
      ansible.builtin.debug:
        msg: |
          ################################################################
          CMA: {{ item.item.cma_name }}
          CMA IP: {{ item.item.cma_ip }}

          Candidate file:
          {{ candidates_dir }}/{{ item.item.cma_name }}_PR_candidates.csv

          Candidate file content:
          ----------------------------------------------------------------
          {{ item.content | b64decode | trim }}
          ----------------------------------------------------------------
          ################################################################
      loop: "{{ filtered_candidate_files.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    - name: Show AWX approval instruction
      ansible.builtin.debug:
        msg: |
          ============================================================
          FILTERED CANDIDATE GENERATION COMPLETED
          ============================================================

          Job ID:
          {{ normalized_job_id }}

          CMA count:
          {{ selected_targets_data.selected_cmas | length }}

          Review the candidate summaries above.

          Pre-Requisite Check will be run on the above targets.

          Approve the next AWX Workflow Approval node to continue.
          ============================================================
