---
- name: Generate filtered CDT Pre-Requisite Check preview
  hosts: all
  gather_facts: false
  become: false

  vars:
    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    deployment_plan: "/var/log/CDT_Project/Deployment_Plans/pre-requisite.xml"

    # Maximum runtime for each CDT generate operation.
    cdt_async_timeout: 7200

    # Poll every 15 seconds, up to approximately 2 hours.
    cdt_poll_delay: 15
    cdt_poll_retries: 480

  tasks:

    # ============================================================
    # 1. Validate job_id from AWX Workflow Survey
    # ============================================================

    - name: Validate job_id from AWX Workflow Survey
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_-]+$')
        fail_msg: |
          A valid job_id was not received from the AWX Workflow Survey.

          Example:
          CHG0012345

          Allowed characters:
          Letters, numbers, underscore and hyphen.
        success_msg: >-
          Received job_id from AWX Workflow Survey:
          {{ job_id | string | trim }}

    - name: Normalize job_id and define paths
      ansible.builtin.set_fact:
        normalized_job_id: "{{ job_id | string | trim }}"
        job_folder: >-
          {{ filters_base_dir }}/{{ job_id | string | trim }}
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ job_id | string | trim }}/selected_targets.yml

    - name: Show job information
      ansible.builtin.debug:
        msg: |
          ============================================================
          CDT PRE-REQUISITE CHECK PREVIEW
          ============================================================

          Job ID:
          {{ normalized_job_id }}

          Job folder:
          {{ job_folder }}

          Selected targets file:
          {{ selected_targets_file }}

          ============================================================

    # ============================================================
    # 2. Validate job folder and selected_targets.yml
    # ============================================================

    - name: Check job folder
      ansible.builtin.stat:
        path: "{{ job_folder }}"
      register: job_folder_stat

    - name: Stop if job folder does not exist
      ansible.builtin.fail:
        msg: |
          The job folder does not exist.

          Expected folder:
          {{ job_folder }}
      when: not job_folder_stat.stat.exists

    - name: Stop if job folder is not a directory
      ansible.builtin.fail:
        msg: |
          The following path exists but is not a directory:

          {{ job_folder }}
      when:
        - job_folder_stat.stat.exists
        - not job_folder_stat.stat.isdir

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop if selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          selected_targets.yml was not found.

          Expected file:
          {{ selected_targets_file }}
      when: not selected_targets_stat.stat.exists

    - name: Stop if selected_targets.yml is not a regular file
      ansible.builtin.fail:
        msg: |
          The following path exists but is not a regular file:

          {{ selected_targets_file }}
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.isreg

    # ============================================================
    # 3. Read and parse selected_targets.yml
    # ============================================================

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected_targets.yml top-level structure
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.job_id is defined
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas is sequence
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          Invalid selected_targets.yml structure.

          Expected structure:

          schema_version: 1
          job_id: CHG0012345
          selected_cmas:
            - cma_name: CMA2_SMS1
              cma_ip: 172.20.50.41
              targets:
                - name: CXL103
                  type: Cluster

    - name: Verify survey job_id matches selected_targets.yml
      ansible.builtin.assert:
        that:
          - selected_targets_data.job_id | string | trim == normalized_job_id
        fail_msg: |
          Job ID mismatch.

          AWX Workflow Survey job_id:
          {{ normalized_job_id }}

          selected_targets.yml job_id:
          {{ selected_targets_data.job_id | default('NOT DEFINED') }}
        success_msg: >-
          AWX Workflow Survey job_id matches selected_targets.yml:
          {{ normalized_job_id }}

    # ============================================================
    # 4. Validate CMA and target entries
    # ============================================================

    - name: Validate each selected CMA entry
      ansible.builtin.assert:
        that:
          - item.cma_name is defined
          - item.cma_name | string | trim | length > 0
          - item.cma_name | string | trim is match('^[A-Za-z0-9_.-]+$')
          - item.cma_ip is defined
          - item.cma_ip | string | trim | length > 0
          - item.cma_ip | string | trim is match('^[0-9a-fA-F:.]+$')
          - item.targets is defined
          - item.targets is sequence
          - item.targets | length > 0
        fail_msg: |
          Invalid CMA entry in selected_targets.yml:

          {{ item | to_nice_yaml }}
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name | default('UNKNOWN CMA') }}"

    - name: Validate every selected target
      ansible.builtin.assert:
        that:
          - item.1.name is defined
          - item.1.name | string | trim | length > 0
          - item.1.name | string | trim is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          Invalid target entry.

          CMA:
          {{ item.0.cma_name | default('UNKNOWN CMA') }}

          Target:
          {{ item.1 | to_nice_yaml }}
      loop: >-
        {{
          selected_targets_data.selected_cmas
          | subelements('targets')
        }}
      loop_control:
        label: >-
          {{ item.0.cma_name | default('UNKNOWN') }}
          /
          {{ item.1.name | default('UNKNOWN') }}

    # ============================================================
    # 5. Check for duplicate CMA names
    # ============================================================

    - name: Build CMA name list
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_targets_data.selected_cmas
            | map(attribute='cma_name')
            | list
          }}

    - name: Verify CMA names are unique
      ansible.builtin.assert:
        that:
          - selected_cma_names | unique | length == selected_cma_names | length
        fail_msg: |
          Duplicate CMA names were found in selected_targets.yml.

          CMA list:
          {{ selected_cma_names | to_nice_yaml }}

    # ============================================================
    # 6. Validate deployment plan and candidate directory
    # ============================================================

    - name: Check CDT deployment plan
      ansible.builtin.stat:
        path: "{{ deployment_plan }}"
      register: deployment_plan_stat

    - name: Stop if deployment plan does not exist
      ansible.builtin.fail:
        msg: |
          CDT deployment plan was not found.

          Expected file:
          {{ deployment_plan }}
      when: not deployment_plan_stat.stat.exists

    - name: Stop if deployment plan is not a regular file
      ansible.builtin.fail:
        msg: |
          The deployment plan path is not a regular file:

          {{ deployment_plan }}
      when:
        - deployment_plan_stat.stat.exists
        - not deployment_plan_stat.stat.isreg

    - name: Ensure candidate directory exists
      ansible.builtin.file:
        path: "{{ candidates_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # 7. Create one PR filter file per CMA
    # ============================================================

    - name: Create CMA Pre-Requisite filter files
      ansible.builtin.copy:
        dest: "{{ job_folder }}/{{ item.cma_name }}_PR_filter"
        content: |-
          {% for target in item.targets %}
          {{ target.name }}
          {% endfor %}

        mode: "0644"
        backup: true
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"

    - name: Check generated CMA filter files
      ansible.builtin.stat:
        path: "{{ job_folder }}/{{ item.cma_name }}_PR_filter"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: generated_filter_stats

    - name: Validate generated CMA filter files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size | int > 0
        fail_msg: |
          A CMA filter file was not generated correctly.

          CMA:
          {{ item.item.cma_name }}

          Expected file:
          {{ job_folder }}/{{ item.item.cma_name }}_PR_filter
      loop: "{{ generated_filter_stats.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    - name: Read generated CMA filter files
      ansible.builtin.slurp:
        src: "{{ job_folder }}/{{ item.cma_name }}_PR_filter"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: generated_filter_files

    - name: Show generated CMA filter content
      ansible.builtin.debug:
        msg: |
          ============================================================
          CMA:
          {{ item.item.cma_name }}

          CMA IP:
          {{ item.item.cma_ip }}

          Filter:
          {{ job_folder }}/{{ item.item.cma_name }}_PR_filter

          Selected targets:
          ------------------------------------------------------------
          {{ item.content | b64decode | trim }}
          ------------------------------------------------------------
      loop: "{{ generated_filter_files.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    # ============================================================
    # 8. Remove old candidate files
    #
    # This prevents an old candidate file from making a failed CDT
    # operation appear successful.
    # ============================================================

    - name: Remove previous candidate files
      ansible.builtin.file:
        path: "{{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"
        state: absent
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"

    # ============================================================
    # 9. Start CDT generation for all CMAs in parallel
    #
    # /bin/bash -lc runs the complete command in a login shell.
    # mdsenv and CentralDeploymentTool execute in the same shell.
    # ============================================================

    - name: Start filtered CDT generation for all CMAs in parallel
      ansible.builtin.shell:
        cmd: |
          /bin/bash -lc '
          set -o pipefail

          echo "============================================================"
          echo "Starting filtered CDT generation"
          echo "CMA={{ item.cma_name }}"
          echo "CMA_IP={{ item.cma_ip }}"
          echo "============================================================"

          mdsenv "{{ item.cma_name }}"

          if [[ -z "${CDTDIR:-}" ]]; then
              echo "ERROR: CDTDIR is not defined after mdsenv {{ item.cma_name }}"
              exit 10
          fi

          cdt_executable="${CDTDIR}/CentralDeploymentTool"
          filter_file="{{ job_folder }}/{{ item.cma_name }}_PR_filter"
          candidate_file="{{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"

          if [[ ! -x "${cdt_executable}" ]]; then
              echo "ERROR: CentralDeploymentTool is not executable"
              echo "Path: ${cdt_executable}"
              exit 11
          fi

          if [[ ! -r "${filter_file}" ]]; then
              echo "ERROR: CMA filter file is not readable"
              echo "Path: ${filter_file}"
              exit 12
          fi

          if [[ ! -r "{{ deployment_plan }}" ]]; then
              echo "ERROR: Deployment plan is not readable"
              echo "Path: {{ deployment_plan }}"
              exit 13
          fi

          echo "CDTDIR=${CDTDIR}"
          echo "CDT=${cdt_executable}"
          echo "Session={{ item.cma_name }}_session"
          echo "Filter=${filter_file}"
          echo "Candidates=${candidate_file}"
          echo "Deployment plan={{ deployment_plan }}"
          echo "Server={{ item.cma_ip }}"
          echo

          "${cdt_executable}" -generate \
            -session="{{ item.cma_name }}_session" \
            -candidates="${candidate_file}" \
            -deploymentplan="{{ deployment_plan }}" \
            -filter="${filter_file}" \
            -server="{{ item.cma_ip }}"

          cdt_rc=$?

          echo
          echo "CDT return code=${cdt_rc}"

          exit "${cdt_rc}"
          '
      async: "{{ cdt_async_timeout }}"
      poll: 0
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: filtered_cdt_async_jobs
      changed_when: true

    # ============================================================
    # 10. Show submitted async jobs
    # ============================================================

    - name: Show submitted CDT async jobs
      ansible.builtin.debug:
        msg: |
          ============================================================
          CMA:
          {{ item.item.cma_name }}

          CMA IP:
          {{ item.item.cma_ip }}

          Ansible Async Job ID:
          {{ item.ansible_job_id }}
          ============================================================
      loop: "{{ filtered_cdt_async_jobs.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    # ============================================================
    # 11. Wait for all parallel CDT jobs
    #
    # "is finished" avoids the integer conditional warning seen
    # with finished: 1 on older ansible-core versions.
    # ============================================================

    - name: Wait for filtered CDT jobs to complete
      ansible.builtin.async_status:
        jid: "{{ cdt_async_job.ansible_job_id }}"
      register: cdt_async_poll
      until: cdt_async_poll is ansible.builtin.finished
      retries: "{{ cdt_poll_retries }}"
      delay: "{{ cdt_poll_delay }}"
      loop: "{{ filtered_cdt_async_jobs.results }}"
      loop_control:
        loop_var: cdt_async_job
        label: "{{ cdt_async_job.item.cma_name }}"
      failed_when: false

    # ============================================================
    # 12. Show real async command results
    # ============================================================

    - name: Show filtered CDT command results
      ansible.builtin.debug:
        msg: |
          ============================================================
          CMA:
          {{ item.cdt_async_job.item.cma_name }}

          CMA IP:
          {{ item.cdt_async_job.item.cma_ip }}

          Async Job ID:
          {{ item.cdt_async_job.ansible_job_id }}

          Finished:
          {{ item.finished | default(false) | bool }}

          Return code:
          {{ item.rc | default('NOT RETURNED') }}

          Standard output:
          ------------------------------------------------------------
          {{ item.stdout | default('') }}
          ------------------------------------------------------------

          Standard error:
          ------------------------------------------------------------
          {{ item.stderr | default('') }}
          ------------------------------------------------------------
          ============================================================
      loop: "{{ cdt_async_poll.results }}"
      loop_control:
        label: "{{ item.cdt_async_job.item.cma_name }}"

    # ============================================================
    # 13. Validate async results
    # ============================================================

    - name: Stop if an async CDT job did not finish
      ansible.builtin.assert:
        that:
          - item.finished | default(false) | bool
        fail_msg: |
          CDT generation did not finish within the configured timeout.

          CMA:
          {{ item.cdt_async_job.item.cma_name }}

          CMA IP:
          {{ item.cdt_async_job.item.cma_ip }}

          Async Job ID:
          {{ item.cdt_async_job.ansible_job_id }}

          Maximum runtime:
          {{ cdt_async_timeout }} seconds
      loop: "{{ cdt_async_poll.results }}"
      loop_control:
        label: "{{ item.cdt_async_job.item.cma_name }}"

    - name: Stop if CDT return code is missing
      ansible.builtin.assert:
        that:
          - item.rc is defined
        fail_msg: |
          Ansible marked the async job as finished but did not return
          the command return code.

          CMA:
          {{ item.cdt_async_job.item.cma_name }}

          CMA IP:
          {{ item.cdt_async_job.item.cma_ip }}

          Async Job ID:
          {{ item.cdt_async_job.ansible_job_id }}

          Async result:
          {{ item | to_nice_yaml }}
      loop: "{{ cdt_async_poll.results }}"
      loop_control:
        label: "{{ item.cdt_async_job.item.cma_name }}"

    - name: Stop if a filtered CDT command failed
      ansible.builtin.assert:
        that:
          - item.rc | int == 0
        fail_msg: |
          ============================================================
          FILTERED CDT GENERATION FAILED
          ============================================================

          CMA:
          {{ item.cdt_async_job.item.cma_name }}

          CMA IP:
          {{ item.cdt_async_job.item.cma_ip }}

          Return code:
          {{ item.rc | default('NOT RETURNED') }}

          Standard output:
          ------------------------------------------------------------
          {{ item.stdout | default('') }}
          ------------------------------------------------------------

          Standard error:
          ------------------------------------------------------------
          {{ item.stderr | default('') }}
          ------------------------------------------------------------
      loop: "{{ cdt_async_poll.results }}"
      loop_control:
        label: "{{ item.cdt_async_job.item.cma_name }}"

    # ============================================================
    # 14. Validate generated candidate CSV files
    # ============================================================

    - name: Check generated candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: candidate_file_stats

    - name: Stop if a candidate CSV was not generated
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size | int > 0
        fail_msg: |
          ============================================================
          INVALID OR MISSING CDT CANDIDATE FILE
          ============================================================

          CMA:
          {{ item.item.cma_name }}

          CMA IP:
          {{ item.item.cma_ip }}

          Expected file:
          {{ candidates_dir }}/{{ item.item.cma_name }}_PR_candidates.csv

          The CDT command returned successfully, but the expected
          candidate CSV file is missing or empty.
          ============================================================
      loop: "{{ candidate_file_stats.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    # ============================================================
    # 15. Format generated candidate CSV files for AWX
    #
    # The CDT CSV contains a preamble before the real six-column table.
    # This parser finds the table, removes the preamble, aligns all columns,
    # and returns stdout_lines so AWX does not display one long escaped
    # string containing literal "\n" sequences.
    # ============================================================

    - name: Build readable candidate table for each CMA
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
              import csv
              import sys

              candidate_file = sys.argv[1]
              cma_name = sys.argv[2]

              expected_header = (
                  "Gateway Name",
                  "Cluster Name",
                  "IP Address",
                  "Version/JHF Take",
                  "State",
                  "Upgrade Order",
              )

              with open(
                  candidate_file,
                  "r",
                  encoding="utf-8-sig",
                  errors="replace",
                  newline="",
              ) as stream:
                  csv_rows = [
                      [column.strip() for column in row]
                      for row in csv.reader(stream)
                  ]

              header_index = None

              for index, row in enumerate(csv_rows):
                  if (
                      len(row) >= 2
                      and row[0].casefold() == "gateway name"
                      and row[1].casefold() == "cluster name"
                  ):
                      header_index = index
                      break

              if header_index is None:
                  raise SystemExit(
                      "Could not find the six-column candidate table in "
                      + candidate_file
                  )

              candidate_rows = []

              for row in csv_rows[header_index + 1:]:
                  if len(row) < 6:
                      continue

                  values = tuple(
                      column.strip()
                      for column in row[:6]
                  )

                  if not any(values):
                      continue

                  if (
                      values[0].startswith("*")
                      or values[0].startswith("=")
                  ):
                      continue

                  candidate_rows.append(values)

              if not candidate_rows:
                  raise SystemExit(
                      "No candidate rows were found in "
                      + candidate_file
                  )

              minimum_widths = (
                  20,
                  20,
                  16,
                  18,
                  21,
                  13,
              )

              all_rows = [expected_header] + candidate_rows

              widths = [
                  max(
                      minimum_widths[column_index],
                      max(
                          len(row[column_index])
                          for row in all_rows
                      ),
                  )
                  for column_index in range(6)
              ]

              def format_row(row):
                  return " , ".join(
                      value.rjust(width)
                      for value, width in zip(row, widths)
                  )

              header_line = format_row(expected_header)
              separator = "=" * len(header_line)
              border = "*" * len(header_line)

              print(cma_name + ":")
              print(border)
              print()
              print(header_line)
              print(separator)
              print()

              for row in candidate_rows:
                  print(format_row(row))

              print()
              print(border)
              print(
                  "The CDT Deployment Plan Pre-Requisite Check Will Run "
                  "on The Above Target(s)"
              )
          - "{{ candidates_dir }}/{{ item.cma_name }}_PR_candidates.csv"
          - "{{ item.cma_name }}"
      loop: "{{ selected_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"
      register: formatted_candidate_tables
      changed_when: false

    # ============================================================
    # 16. Display candidate summary for approval
    # ============================================================

    - name: Show Pre-Requisite Check candidate summary
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ formatted_candidate_tables.results }}"
      loop_control:
        label: "{{ item.item.cma_name }}"

    # ============================================================
    # 17. Final workflow approval message
    # ============================================================

    - name: Show workflow approval message
      ansible.builtin.debug:
        msg: |
          ============================================================
          PRE-REQUISITE CHECK PREVIEW COMPLETED
          ============================================================

          Job ID:
          {{ normalized_job_id }}

          Number of CMAs:
          {{ selected_targets_data.selected_cmas | length }}

          Processed CMAs:
          {% for cma in selected_targets_data.selected_cmas %}
          - {{ cma.cma_name }}
            Server: {{ cma.cma_ip }}
            Filter: {{ job_folder }}/{{ cma.cma_name }}_PR_filter
            Candidates: {{ candidates_dir }}/{{ cma.cma_name }}_PR_candidates.csv
          {% endfor %}

          Pre-Requisite Check will be run on the above targets.

          Review the summaries above and approve the next
          AWX Workflow Approval node to continue.
          ============================================================
