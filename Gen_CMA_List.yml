---
- name: Generate MDS CMA inventory and update AWX CMA survey
  hosts: all
  gather_facts: false

  vars:

    # =========================================================
    # MDS settings
    # =========================================================

    ansible_python_interpreter: /usr/bin/python3

    inventory_directory: /var/log/CDT_Project/Inventory
    inventory_file: /var/log/CDT_Project/Inventory/mds_inventory


    # =========================================================
    # AWX settings
    # =========================================================

    awx_controller_url: "https://172.20.50.28"

    # Target Job Template that needs the CMA dropdown
    target_job_template_id: 11

    # Token injected through AWX custom credential
    awx_oauth_token: >-
      {{
        lookup(
          'ansible.builtin.env',
          'AWX_OAUTH_TOKEN'
        )
      }}

    # Lab/self-signed AWX certificate
    awx_validate_certs: false


  tasks:

    # =========================================================
    # 1. Run mdsstat
    # =========================================================

    - name: Run mdsstat
      ansible.builtin.shell: |
        source /etc/profile.d/CP.sh
        mdsstat
      args:
        executable: /bin/bash
      register: mdsstat_output
      changed_when: false
      failed_when:
        - mdsstat_output.rc != 0


    # =========================================================
    # 2. Display raw mdsstat
    # =========================================================

    - name: Display mdsstat output
      ansible.builtin.debug:
        var: mdsstat_output.stdout_lines


    # =========================================================
    # 3. Initialize CMA structure
    #
    # Result will become:
    #
    # cma_inventory:
    #   - name: CMA1_Pri_SMS
    #     ip: 172.20.50.31
    #   - name: CMA2_SMS1
    #     ip: 172.20.50.41
    # =========================================================

    - name: Initialize structured CMA inventory
      ansible.builtin.set_fact:
        cma_inventory: []


    # =========================================================
    # 4. Parse CMA rows
    #
    # mdsstat:
    #
    # | CMA | CMA1_Pri_SMS | 172.20.50.31 | ...
    #
    # split('|'):
    #
    # [1] = CMA
    # [2] = CMA1_Pri_SMS
    # [3] = 172.20.50.31
    # =========================================================

    - name: Build structured CMA inventory
      ansible.builtin.set_fact:
        cma_inventory: >-
          {{
            cma_inventory
            +
            [
              {
                'name': item.split('|')[2] | trim,
                'ip': item.split('|')[3] | trim
              }
            ]
          }}
      loop: "{{ mdsstat_output.stdout_lines }}"
      loop_control:
        label: "{{ item }}"
      when:
        - item.split('|') | length >= 4
        - item.split('|')[1] | trim == 'CMA'
        - item.split('|')[2] | trim | length > 0
        - item.split('|')[3] | trim | length > 0


    # =========================================================
    # 5. Verify CMAs were found
    # =========================================================

    - name: Verify CMA entries were discovered
      ansible.builtin.assert:
        that:
          - cma_inventory | length > 0
        fail_msg: >-
          No CMA entries could be extracted from mdsstat.
        success_msg: >-
          Found {{ cma_inventory | length }} CMA entries.


    # =========================================================
    # 6. Validate CMA data
    # =========================================================

    - name: Validate CMA entries
      ansible.builtin.assert:
        that:
          - item.name | length > 0
          - item.ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: >-
          Invalid CMA entry: {{ item }}
        quiet: true
      loop: "{{ cma_inventory }}"
      loop_control:
        label: "{{ item.name }}"


    # =========================================================
    # 7. Display discovered CMAs
    # =========================================================

    - name: Display discovered CMA inventory
      ansible.builtin.debug:
        var: cma_inventory


    # =========================================================
    # 8. Build text-format inventory
    #
    # Required MDS output:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1 172.20.50.41
    # =========================================================

    - name: Initialize inventory file lines
      ansible.builtin.set_fact:
        mds_inventory_lines: []


    - name: Build inventory file lines
      ansible.builtin.set_fact:
        mds_inventory_lines: >-
          {{
            mds_inventory_lines
            +
            [
              item.name ~ ' ' ~ item.ip
            ]
          }}
      loop: "{{ cma_inventory }}"
      loop_control:
        label: "{{ item.name }}"


    # =========================================================
    # 9. Ensure parent directory exists
    # =========================================================

    - name: Ensure CDT Inventory directory exists
      ansible.builtin.file:
        path: "{{ inventory_directory }}"
        state: directory
        mode: "0755"


    # =========================================================
    # 10. Check existing mds_inventory
    #
    # This also handles the old case where mds_inventory
    # accidentally existed as a directory.
    # =========================================================

    - name: Check existing mds_inventory path
      ansible.builtin.stat:
        path: "{{ inventory_file }}"
      register: existing_inventory_path


    # =========================================================
    # 11. Remove old incorrect directory
    # =========================================================

    - name: Remove old incorrect mds_inventory directory
      ansible.builtin.file:
        path: "{{ inventory_file }}"
        state: absent
      when:
        - existing_inventory_path.stat.exists | default(false)
        - existing_inventory_path.stat.isdir | default(false)


    # =========================================================
    # 12. Write mds_inventory
    # =========================================================

    - name: Write MDS CMA inventory file
      ansible.builtin.copy:
        content: "{{ mds_inventory_lines | join('\n') ~ '\n' }}"
        dest: "{{ inventory_file }}"
        mode: "0644"
        force: true


    # =========================================================
    # 13. Verify output file
    # =========================================================

    - name: Check generated inventory file
      ansible.builtin.stat:
        path: "{{ inventory_file }}"
      register: generated_inventory_stat


    - name: Verify generated inventory is a regular file
      ansible.builtin.assert:
        that:
          - generated_inventory_stat.stat.exists | default(false)
          - generated_inventory_stat.stat.isreg | default(false)
          - not generated_inventory_stat.stat.isdir | default(false)
        fail_msg: >-
          {{ inventory_file }} was not created correctly.
        success_msg: >-
          {{ inventory_file }} was created successfully.


    # =========================================================
    # 14. Read generated file
    # =========================================================

    - name: Read generated MDS inventory file
      ansible.builtin.slurp:
        src: "{{ inventory_file }}"
      register: generated_inventory_raw


    - name: Decode generated MDS inventory
      ansible.builtin.set_fact:
        generated_inventory_content: >-
          {{
            generated_inventory_raw.content
            | b64decode
            | trim
          }}


    # =========================================================
    # 15. Verify file content
    # =========================================================

    - name: Verify generated inventory content
      ansible.builtin.assert:
        that:
          - generated_inventory_content == (mds_inventory_lines | join('\n'))
        fail_msg: |
          Generated inventory file does not match discovered CMA data.

          Expected:

          {{ mds_inventory_lines | join('\n') }}

          Actual:

          {{ generated_inventory_content }}
        success_msg: >-
          Generated MDS inventory content is correct.


    # =========================================================
    # 16. Build Survey choices
    #
    # Only CMA NAME goes into AWX dropdown:
    #
    # CMA1_Pri_SMS
    # CMA2_SMS1
    #
    # Not the IP.
    # =========================================================

    - name: Build CMA Survey choices
      ansible.builtin.set_fact:
        cma_survey_names: >-
          {{
            cma_inventory
            | map(attribute='name')
            | unique
            | sort
            | list
          }}


    # =========================================================
    # 17. Display choices before changing AWX
    # =========================================================

    - name: Display CMA Survey choices
      ansible.builtin.debug:
        msg:
          - "Target Job Template ID: {{ target_job_template_id }}"
          - "CMA choices: {{ cma_survey_names }}"


    # =========================================================
    # 18. Validate AWX API configuration
    # =========================================================

    - name: Validate AWX API configuration
      ansible.builtin.assert:
        that:
          - awx_controller_url | length > 0
          - target_job_template_id | int == 11
          - awx_oauth_token | length > 0
        fail_msg: >-
          AWX API configuration is incomplete.
          Verify awx_controller_url and AWX_OAUTH_TOKEN.


    # =========================================================
    # 19. Check Job Template 11
    #
    # delegate_to localhost means this request executes from
    # the AWX Execution Environment, not from MDS21.
    # =========================================================

    - name: Check target AWX Job Template
      ansible.builtin.uri:
        url: >-
          {{ awx_controller_url }}/api/v2/job_templates/{{ target_job_template_id }}/
        method: GET

        headers:
          Authorization: "Bearer {{ awx_oauth_token }}"
          Accept: "application/json"

        validate_certs: "{{ awx_validate_certs }}"
        return_content: true

        status_code:
          - 200

      delegate_to: localhost
      run_once: true

      register: target_job_template

      no_log: true


    # =========================================================
    # 20. Update Survey on Job Template 11
    #
    # multiplechoice = select exactly one CMA
    #
    # Job Template 11 will receive:
    #
    # selected_cma_name: CMA1_Pri_SMS
    # =========================================================

    - name: Update CMA Survey on Job Template 11
      ansible.builtin.uri:
        url: >-
          {{ awx_controller_url }}/api/v2/job_templates/{{ target_job_template_id }}/survey_spec/

        method: POST

        headers:
          Authorization: "Bearer {{ awx_oauth_token }}"
          Accept: "application/json"
          Content-Type: "application/json"

        body_format: json

        body:
          name: "CMA Selection"

          description: >-
            Select one CMA from the current MDS inventory.

          spec:

            - question_name: "Select CMA"

              question_description: >-
                Select the CMA to be used for this CDT operation.

              required: true

              type: "multiplechoice"

              variable: "selected_cma_name"

              choices: "{{ cma_survey_names }}"

              default: "{{ cma_survey_names | first }}"

        validate_certs: "{{ awx_validate_certs }}"

        return_content: true

        status_code:
          - 200

      delegate_to: localhost
      run_once: true

      register: survey_update_result

      no_log: true


    # =========================================================
    # 21. Enable Survey on Job Template 11
    # =========================================================

    - name: Enable Survey on Job Template 11
      ansible.builtin.uri:
        url: >-
          {{ awx_controller_url }}/api/v2/job_templates/{{ target_job_template_id }}/

        method: PATCH

        headers:
          Authorization: "Bearer {{ awx_oauth_token }}"
          Accept: "application/json"
          Content-Type: "application/json"

        body_format: json

        body:
          survey_enabled: true

        validate_certs: "{{ awx_validate_certs }}"

        return_content: true

        status_code:
          - 200

      delegate_to: localhost
      run_once: true

      register: survey_enable_result

      no_log: true


    # =========================================================
    # 22. Publish simple structured AWX artifact
    #
    # Keeps the useful structure you already tested:
    #
    # {
    #   "cma_inventory": [
    #       {
    #           "name": "CMA1_Pri_SMS",
    #           "ip": "172.20.50.31"
    #       }
    #   ]
    # }
    # =========================================================

    - name: Publish structured CMA inventory artifact
      ansible.builtin.set_stats:
        data:
          cma_inventory: "{{ cma_inventory }}"
        per_host: false


    # =========================================================
    # 23. Final result
    # =========================================================

    - name: Display final result
      ansible.builtin.debug:
        msg:
          - "MDS CMA inventory successfully generated."
          - "Inventory file: {{ inventory_file }}"
          - "CMA count: {{ cma_inventory | length }}"
          - "CMA inventory: {{ cma_inventory }}"
          - "Job Template {{ target_job_template_id }} Survey successfully refreshed."
          - "Survey variable: selected_cma_name"
          - "Survey choices: {{ cma_survey_names }}"
