---
- name: Save selected CDT targets by Job ID
  hosts: all
  gather_facts: false
  become: true

  vars:
    # CMA name-to-IP inventory
    mds_inventory_file: "/var/log/CDT_Project/Inventory/mds_inventory"

    # Job-specific target selection directory
    filters_base_dir: "/var/log/CDT_Project/Filters"

  tasks:

    # ============================================================
    # 1. Display AWX survey inputs
    # ============================================================

    - name: Display variables received from AWX
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "              CDT TARGET SELECTION INPUT"
          - "============================================================"
          - "Job ID                  : {{ job_id | default('NOT RECEIVED') }}"
          - "Selected target choices : {{ selected_target_choices | default([]) }}"
          - "============================================================"


    # ============================================================
    # 2. Validate Job ID
    # ============================================================

    - name: Validate Job ID
      ansible.builtin.assert:
        that:
          - "job_id is defined"
          - "job_id | string | trim | length > 0"
          - "job_id is match('^[A-Za-z0-9_-]+$')"
        fail_msg: |
          Invalid or missing job_id.

          Enter the Job ID in the Target Selection survey.

          Allowed characters:
          - Letters
          - Numbers
          - Underscore
          - Hyphen
        success_msg: >-
          Job ID received: {{ job_id | string | trim }}


    # ============================================================
    # 3. Validate target multiselect variable
    # ============================================================

    - name: Require selected target choices
      ansible.builtin.assert:
        that:
          - "selected_target_choices is defined"
        fail_msg: |
          selected_target_choices was not received.

          Confirm the AWX multiselect survey uses:

          Variable name:
          selected_target_choices


    # ============================================================
    # 4. Normalize Job ID
    # ============================================================

    - name: Normalize Job ID
      ansible.builtin.set_fact:
        normalized_job_id: "{{ job_id | string | trim }}"


    # ============================================================
    # 5. Convert AWX multiselect result to a list
    #
    # AWX can return:
    #
    # A list:
    #   - CMA2_SMS1 :: CXL103 (Cluster)
    #   - CMA2_SMS1 :: GW301 (Gateway)
    #
    # Or a newline-separated string.
    # ============================================================

    - name: Convert selected target choices to a raw list
      ansible.builtin.set_fact:
        selected_target_choices_raw: >-
          {{
            selected_target_choices
            if (
              selected_target_choices is sequence
              and selected_target_choices is not string
            )
            else (
              selected_target_choices
              | string
              | split('\n')
            )
          }}


    - name: Trim selected target choices
      ansible.builtin.set_fact:
        selected_target_choices_list: >-
          {{
            selected_target_choices_raw
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | list
          }}


    - name: Require at least one selected target
      ansible.builtin.assert:
        that:
          - "selected_target_choices_list | length > 0"
        fail_msg: >-
          No Cluster or Gateway was selected in the AWX survey.
        success_msg: >-
          Received {{ selected_target_choices_list | length }}
          target selection(s).


    - name: Display selected target choices
      ansible.builtin.debug:
        msg: "{{ selected_target_choices_list }}"


    # ============================================================
    # 6. Validate target-choice format
    #
    # Required:
    #
    # CMA2_SMS1 :: CXL103 (Cluster)
    # CMA2_SMS1 :: GW301 (Gateway)
    #
    # Important:
    # The complete assertion containing " :: " is quoted to prevent
    # YAML from interpreting colon-space as a mapping separator.
    # ============================================================

    - name: Validate selected target choice format
      ansible.builtin.assert:
        that:
          - "item is string"
          - "item.count(' :: ') == 1"
          - "item.count(' (') == 1"
          - "item.endswith(')')"
          - "item.split(' :: ', 1)[0] | trim | length > 0"
          - "item.split(' :: ', 1)[1] | trim | length > 0"
        fail_msg: |
          Invalid target choice:

          {{ item }}

          Required format:

          CMA2_SMS1 :: CXL103 (Cluster)

          or:

          CMA2_SMS1 :: GW301 (Gateway)
      loop: "{{ selected_target_choices_list }}"
      loop_control:
        label: "{{ item }}"


    # ============================================================
    # 7. Parse choices without regex
    #
    # Input:
    # CMA2_SMS1 :: CXL103 (Cluster)
    #
    # Output:
    # cma_name: CMA2_SMS1
    # name: CXL103
    # type: Cluster
    # ============================================================

    - name: Initialize parsed target choices
      ansible.builtin.set_fact:
        parsed_target_choices: []


    - name: Parse selected target choices
      ansible.builtin.set_fact:
        parsed_target_choices: >-
          {{
            parsed_target_choices
            +
            [
              {
                'cma_name': parsed_cma_name,
                'name': parsed_target_name,
                'type': parsed_target_type
              }
            ]
          }}
      vars:
        choice_sections: "{{ item.split(' :: ', 1) }}"

        parsed_cma_name: >-
          {{
            choice_sections[0]
            | string
            | trim
          }}

        target_section: >-
          {{
            choice_sections[1]
            | string
            | trim
          }}

        target_sections: "{{ target_section.split(' (', 1) }}"

        parsed_target_name: >-
          {{
            target_sections[0]
            | string
            | trim
          }}

        parsed_target_type: >-
          {{
            target_sections[1]
            | string
            | replace(')', '')
            | trim
          }}
      loop: "{{ selected_target_choices_list }}"
      loop_control:
        label: "{{ item }}"


    # ============================================================
    # 8. Validate parsed targets
    # ============================================================

    - name: Validate parsed target entries
      ansible.builtin.assert:
        that:
          - "item.cma_name | string | trim | length > 0"
          - "item.cma_name is match('^[A-Za-z0-9_.-]+$')"
          - "item.name | string | trim | length > 0"
          - "item.type in ['Cluster', 'Gateway']"
        fail_msg: |
          Failed to parse target choice:

          {{ item }}

          Target type must be:
          - Cluster
          - Gateway
      loop: "{{ parsed_target_choices }}"
      loop_control:
        label: >-
          {{ item.cma_name | default('UNKNOWN') }}
          ::
          {{ item.name | default('UNKNOWN') }}


    - name: Display parsed target choices
      ansible.builtin.debug:
        var: parsed_target_choices


    # ============================================================
    # 9. Determine CMA embedded in survey choices
    #
    # The survey is generated for one CMA at a time.
    # All choices in one launch must therefore belong to one CMA.
    # ============================================================

    - name: Collect embedded CMA names
      ansible.builtin.set_fact:
        embedded_cma_names: >-
          {{
            parsed_target_choices
            | map(attribute='cma_name')
            | unique
            | list
          }}


    - name: Require one CMA in the current selection
      ansible.builtin.assert:
        that:
          - "embedded_cma_names | length == 1"
        fail_msg: |
          More than one CMA was found in the current selection:

          {{ embedded_cma_names }}

          Select targets from one CMA per Target Selection run.

          To add targets from another CMA:
          1. Generate the survey for the other CMA.
          2. Launch Target Selection again.
          3. Enter the same Job ID.
        success_msg: >-
          Current targets belong to CMA {{ embedded_cma_names[0] }}.


    - name: Store embedded CMA name
      ansible.builtin.set_fact:
        normalized_cma_name: >-
          {{
            embedded_cma_names[0]
            | string
            | trim
          }}


    # ============================================================
    # 10. Build normalized target list
    # ============================================================

    - name: Initialize normalized target list
      ansible.builtin.set_fact:
        normalized_targets: []


    - name: Build normalized target list
      ansible.builtin.set_fact:
        normalized_targets: >-
          {{
            normalized_targets
            +
            [
              {
                'name': item.name | string | trim,
                'type': item.type | string | trim
              }
            ]
          }}
      loop: "{{ parsed_target_choices }}"
      loop_control:
        label: "{{ item.name }}"


    - name: Remove duplicate targets from current selection
      ansible.builtin.set_fact:
        normalized_targets: >-
          {{
            normalized_targets
            | unique(attribute='name')
            | list
          }}


    - name: Require normalized targets
      ansible.builtin.assert:
        that:
          - "normalized_targets | length > 0"
        fail_msg: >-
          No valid targets remained after parsing the survey values.


    - name: Display normalized selection
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "              NORMALIZED TARGET SELECTION"
          - "============================================================"
          - "Job ID  : {{ normalized_job_id }}"
          - "CMA     : {{ normalized_cma_name }}"
          - "Targets : {{ normalized_targets }}"
          - "============================================================"


    # ============================================================
    # 11. Define Job ID paths
    # ============================================================

    - name: Define Job ID paths
      ansible.builtin.set_fact:
        job_filter_dir: >-
          {{ filters_base_dir }}/{{ normalized_job_id }}

        selected_targets_file: >-
          {{ filters_base_dir }}/{{ normalized_job_id }}/selected_targets.yml


    # ============================================================
    # 12. Validate mds_inventory
    # ============================================================

    - name: Check mds_inventory file
      ansible.builtin.stat:
        path: "{{ mds_inventory_file }}"
      register: mds_inventory_stat


    - name: Require valid mds_inventory
      ansible.builtin.assert:
        that:
          - "mds_inventory_stat.stat.exists | default(false)"
          - "mds_inventory_stat.stat.isreg | default(false)"
          - "mds_inventory_stat.stat.size | default(0) | int > 0"
        fail_msg: |
          The MDS inventory file is missing or empty:

          {{ mds_inventory_file }}

          Run the MDS inventory-generation Job Template first.
        success_msg: >-
          MDS inventory file is available.


    # ============================================================
    # 13. Read and decode mds_inventory
    # ============================================================

    - name: Read CMA inventory
      ansible.builtin.slurp:
        src: "{{ mds_inventory_file }}"
      register: mds_inventory_raw


    - name: Decode CMA inventory
      ansible.builtin.set_fact:
        mds_inventory_content: >-
          {{
            mds_inventory_raw.content
            | b64decode
            | trim
          }}


    - name: Display CMA inventory
      ansible.builtin.debug:
        msg: |
          Current CMA inventory:

          {{ mds_inventory_content }}


    # ============================================================
    # 14. Resolve embedded CMA name to CMA IP
    #
    # Expected inventory format:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1    172.20.50.41
    # CMA3_SMS1    172.20.50.42
    # ============================================================

    - name: Initialize CMA inventory matches
      ansible.builtin.set_fact:
        cma_inventory_matches: []


    - name: Find CMA entry in mds_inventory
      ansible.builtin.set_fact:
        cma_inventory_matches: >-
          {{
            cma_inventory_matches
            +
            [
              {
                'cma_name': item.split()[0],
                'cma_ip': item.split()[1]
              }
            ]
          }}
      loop: "{{ mds_inventory_content.splitlines() }}"
      loop_control:
        label: "{{ item }}"
      when:
        - "item | trim | length > 0"
        - "not (item | trim).startswith('#')"
        - "item.split() | length == 2"
        - "item.split()[0] == normalized_cma_name"


    - name: Require exactly one CMA inventory match
      ansible.builtin.assert:
        that:
          - "cma_inventory_matches | length == 1"
        fail_msg: |
          CMA {{ normalized_cma_name }} was not found exactly once in:

          {{ mds_inventory_file }}

          Matching entries:
          {{ cma_inventory_matches }}

          Current inventory:

          {{ mds_inventory_content }}
        success_msg: >-
          CMA {{ normalized_cma_name }} was found in mds_inventory.


    - name: Store resolved CMA IP
      ansible.builtin.set_fact:
        normalized_cma_ip: >-
          {{
            cma_inventory_matches[0].cma_ip
            | string
            | trim
          }}


    - name: Validate CMA IPv4 address
      ansible.builtin.assert:
        that:
          - "normalized_cma_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')"
        fail_msg: |
          Invalid CMA IP for {{ normalized_cma_name }}:

          {{ normalized_cma_ip }}
        success_msg: >-
          CMA {{ normalized_cma_name }} resolved to
          {{ normalized_cma_ip }}.


    - name: Display resolved CMA information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "                  CMA INFORMATION"
          - "============================================================"
          - "CMA Name : {{ normalized_cma_name }}"
          - "CMA IP   : {{ normalized_cma_ip }}"
          - "============================================================"


    # ============================================================
    # 15. Create Job ID directory
    #
    # /var/log/CDT_Project/Filters/<job_id>/
    # ============================================================

    - name: Create Job ID directory
      ansible.builtin.file:
        path: "{{ job_filter_dir }}"
        state: directory
        mode: "0750"


    # ============================================================
    # 16. Check existing selected_targets.yml
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat


    # ============================================================
    # 17. Read existing selected_targets.yml
    # ============================================================

    - name: Read existing selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: existing_targets_raw
      when:
        - selected_targets_stat.stat.exists | default(false)


    - name: Parse existing selected_targets.yml
      ansible.builtin.set_fact:
        existing_data: >-
          {{
            existing_targets_raw.content
            | b64decode
            | from_yaml
          }}
      when:
        - selected_targets_stat.stat.exists | default(false)


    # ============================================================
    # 18. Initialize a new Job ID
    # ============================================================

    - name: Initialize new Job ID data
      ansible.builtin.set_fact:
        existing_data:
          schema_version: 1
          job_id: "{{ normalized_job_id }}"
          created_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          updated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          selected_cmas: []
      when:
        - not (selected_targets_stat.stat.exists | default(false))


    # ============================================================
    # 19. Validate existing selected_targets.yml
    # ============================================================

    - name: Validate existing YAML data
      ansible.builtin.assert:
        that:
          - "existing_data is not none"
          - "existing_data is mapping"
          - "existing_data.job_id is defined"
          - "existing_data.created_at is defined"
          - "existing_data.selected_cmas is defined"
          - "existing_data.selected_cmas is sequence"
        fail_msg: |
          The existing file is empty or does not have the expected
          YAML structure:

          {{ selected_targets_file }}


    - name: Validate existing Job ID
      ansible.builtin.assert:
        that:
          - "existing_data.job_id | string == normalized_job_id"
        fail_msg: |
          Job ID mismatch.

          Existing file Job ID:
          {{ existing_data.job_id | default('UNKNOWN') }}

          Current Job ID:
          {{ normalized_job_id }}


    # ============================================================
    # 20. Find CMA in the existing Job selection
    # ============================================================

    - name: Find selected CMA in existing Job
      ansible.builtin.set_fact:
        matching_cmas: >-
          {{
            existing_data.selected_cmas
            | default([])
            | selectattr(
                'cma_name',
                'equalto',
                normalized_cma_name
              )
            | list
          }}


    - name: Validate CMA is not duplicated
      ansible.builtin.assert:
        that:
          - "matching_cmas | length <= 1"
        fail_msg: |
          CMA {{ normalized_cma_name }} appears multiple times in:

          {{ selected_targets_file }}

          Correct the existing file before continuing.


    # ============================================================
    # 21. Validate stored CMA IP
    # ============================================================

    - name: Validate existing CMA IP
      ansible.builtin.assert:
        that:
          - "matching_cmas[0].cma_ip | string == normalized_cma_ip"
        fail_msg: |
          CMA IP mismatch for {{ normalized_cma_name }}.

          Stored IP:
          {{ matching_cmas[0].cma_ip }}

          Current mds_inventory IP:
          {{ normalized_cma_ip }}
      when:
        - matching_cmas | length == 1


    # ============================================================
    # 22. Merge targets for an existing CMA
    # ============================================================

    - name: Read existing targets for current CMA
      ansible.builtin.set_fact:
        current_cma_targets: >-
          {{
            matching_cmas[0].targets
            | default([])
          }}
      when:
        - matching_cmas | length == 1


    - name: Merge new targets into existing CMA
      ansible.builtin.set_fact:
        merged_cma_targets: >-
          {{
            (
              current_cma_targets
              +
              normalized_targets
            )
            | unique(attribute='name')
            | list
          }}
      when:
        - matching_cmas | length == 1


    - name: Remove current CMA from temporary list
      ansible.builtin.set_fact:
        cmas_without_current: >-
          {{
            existing_data.selected_cmas
            | rejectattr(
                'cma_name',
                'equalto',
                normalized_cma_name
              )
            | list
          }}
      when:
        - matching_cmas | length == 1


    - name: Add updated CMA back to the list
      ansible.builtin.set_fact:
        updated_cmas: >-
          {{
            cmas_without_current
            +
            [
              {
                'cma_name': normalized_cma_name,
                'cma_ip': normalized_cma_ip,
                'targets': merged_cma_targets
              }
            ]
          }}
      when:
        - matching_cmas | length == 1


    # ============================================================
    # 23. Add a new CMA to the same Job ID
    # ============================================================

    - name: Add newly selected CMA
      ansible.builtin.set_fact:
        updated_cmas: >-
          {{
            existing_data.selected_cmas
            | default([])
            +
            [
              {
                'cma_name': normalized_cma_name,
                'cma_ip': normalized_cma_ip,
                'targets': normalized_targets
              }
            ]
          }}
      when:
        - matching_cmas | length == 0


    # ============================================================
    # 24. Build final selected_targets.yml data
    # ============================================================

    - name: Build final selected target data
      ansible.builtin.set_fact:
        final_data:
          schema_version: 1
          job_id: "{{ normalized_job_id }}"
          created_at: "{{ existing_data.created_at }}"
          updated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          selected_cmas: "{{ updated_cmas }}"


    # ============================================================
    # 25. Back up existing selected_targets.yml
    # ============================================================

    - name: Back up existing selected_targets.yml
      ansible.builtin.copy:
        src: "{{ selected_targets_file }}"
        dest: >-
          {{ selected_targets_file }}.bak.{{
            now(utc=true, fmt='%Y%m%d_%H%M%S')
          }}
        remote_src: true
        mode: "0640"
      when:
        - selected_targets_stat.stat.exists | default(false)


    # ============================================================
    # 26. Write selected_targets.yml
    # ============================================================

    - name: Write selected_targets.yml
      ansible.builtin.copy:
        dest: "{{ selected_targets_file }}"
        mode: "0640"
        content: |
          {{ final_data | to_nice_yaml(indent=2, sort_keys=false) }}


    # ============================================================
    # 27. Read and validate saved file
    # ============================================================

    - name: Read saved selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: saved_targets_raw


    - name: Parse saved selected_targets.yml
      ansible.builtin.set_fact:
        saved_targets_data: >-
          {{
            saved_targets_raw.content
            | b64decode
            | from_yaml
          }}


    - name: Validate saved selected_targets.yml
      ansible.builtin.assert:
        that:
          - "saved_targets_data is mapping"
          - "saved_targets_data.job_id == normalized_job_id"
          - "saved_targets_data.selected_cmas is defined"
          - "saved_targets_data.selected_cmas | length > 0"
        fail_msg: >-
          selected_targets.yml was written but failed final validation.
        success_msg: >-
          selected_targets.yml was written and validated successfully.


    # ============================================================
    # 28. Display final summary
    # ============================================================

    - name: Display final Job summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "             CDT TARGET SELECTION SAVED"
          - "============================================================"
          - "Job ID      : {{ normalized_job_id }}"
          - "File        : {{ selected_targets_file }}"
          - "CMA Count   : {{ saved_targets_data.selected_cmas | length }}"
          - "Current CMA : {{ normalized_cma_name }}"
          - "CMA IP      : {{ normalized_cma_ip }}"
          - "============================================================"


    - name: Display targets grouped by CMA
      ansible.builtin.debug:
        msg:
          - "------------------------------------------------------------"
          - "CMA Name : {{ item.cma_name }}"
          - "CMA IP   : {{ item.cma_ip }}"
          - "Targets  : {{ item.targets }}"
      loop: "{{ saved_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"


    - name: Display final selected_targets.yml
      ansible.builtin.debug:
        msg: "{{ saved_targets_raw.content | b64decode }}"
