---
- name: Save selected CDT targets by Job ID
  hosts: all
  gather_facts: false
  become: true

  vars:
    # Existing CMA inventory generated from mdsstat
    mds_inventory_file: "/var/log/CDT_Project/Inventory/mds_inventory"

    # Base directory for Job ID target selections
    filters_base_dir: "/var/log/CDT_Project/Filters"

  tasks:

    # ============================================================
    # 1. Display variables received from AWX
    # ============================================================

    - name: Display variables received from AWX
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "             TARGET SELECTION INPUT"
          - "============================================================"
          - "Job ID           : {{ job_id | default('NOT RECEIVED') }}"
          - "Selected CMA     : {{ selected_cma | default('NOT RECEIVED') }}"
          - "Selected targets : {{ selected_targets | default([]) }}"
          - "============================================================"


    # ============================================================
    # 2. Validate AWX survey and workflow variables
    # ============================================================

    - name: Validate Job ID
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id is match('^[A-Za-z0-9_-]+$')
        fail_msg: >-
          Invalid or missing job_id.
          Enter the Job ID in the AWX survey.
          Only letters, numbers, underscores and hyphens are allowed.

    - name: Validate selected CMA
      ansible.builtin.assert:
        that:
          - selected_cma is defined
          - selected_cma | string | trim | length > 0
          - selected_cma is match('^[A-Za-z0-9_.-]+$')
        fail_msg: >-
          The selected CMA was not received.
          The variable selected_cma must contain the CMA name selected
          by the preceding CMA-selection workflow.

    - name: Validate selected targets
      ansible.builtin.assert:
        that:
          - selected_targets is defined
          - selected_targets | length > 0
        fail_msg: >-
          No Cluster or Gateway was selected.
          Select at least one target in the AWX survey.


    # ============================================================
    # 3. Normalize input values
    # ============================================================

    - name: Normalize Job ID and selected CMA
      ansible.builtin.set_fact:
        normalized_job_id: "{{ job_id | string | trim }}"
        normalized_cma_name: "{{ selected_cma | string | trim }}"

    - name: Normalize selected_targets into a list
      ansible.builtin.set_fact:
        selected_targets_list: >-
          {{
            selected_targets
            if (
              selected_targets is sequence
              and selected_targets is not string
            )
            else (
              selected_targets
              | string
              | split('\n')
              | reject('equalto', '')
              | list
            )
          }}

    - name: Define Job ID directory and selected target file
      ansible.builtin.set_fact:
        job_filter_dir: >-
          {{ filters_base_dir }}/{{ normalized_job_id }}
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ normalized_job_id }}/selected_targets.yml


    # ============================================================
    # 4. Validate mds_inventory
    # ============================================================

    - name: Check mds_inventory file
      ansible.builtin.stat:
        path: "{{ mds_inventory_file }}"
      register: mds_inventory_stat

    - name: Validate mds_inventory file
      ansible.builtin.assert:
        that:
          - mds_inventory_stat.stat.exists
          - mds_inventory_stat.stat.isreg
          - mds_inventory_stat.stat.size | int > 0
        fail_msg: >-
          The CMA inventory file {{ mds_inventory_file }} does not exist
          or is empty. Run the MDS inventory-generation playbook first.


    # ============================================================
    # 5. Display current CMA inventory
    # ============================================================

    - name: Read CMA inventory
      ansible.builtin.slurp:
        src: "{{ mds_inventory_file }}"
      register: mds_inventory_raw

    - name: Display CMA inventory
      ansible.builtin.debug:
        msg: "{{ mds_inventory_raw.content | b64decode }}"


    # ============================================================
    # 6. Find selected CMA IP in mds_inventory
    #
    # Inventory format:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1    172.20.50.41
    # CMA3_SMS1    172.20.50.42
    # ============================================================

    - name: Look up selected CMA in mds_inventory
      ansible.builtin.command:
        argv:
          - awk
          - -v
          - "selected_name={{ normalized_cma_name }}"
          - >-
            $1 == selected_name {
              print $2
            }
          - "{{ mds_inventory_file }}"
      register: cma_lookup
      changed_when: false

    - name: Validate selected CMA exists in mds_inventory
      ansible.builtin.assert:
        that:
          - cma_lookup.stdout_lines | length == 1
          - cma_lookup.stdout | trim | length > 0
        fail_msg: >-
          CMA {{ normalized_cma_name }} was not found exactly once in
          {{ mds_inventory_file }}. Verify the selected CMA name and
          check the inventory for missing or duplicate entries.

    - name: Store selected CMA IP
      ansible.builtin.set_fact:
        normalized_cma_ip: "{{ cma_lookup.stdout | trim }}"

    - name: Validate CMA IP format
      ansible.builtin.assert:
        that:
          - normalized_cma_ip is
            match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
        fail_msg: >-
          The value {{ normalized_cma_ip }} found for
          {{ normalized_cma_name }} is not a valid IPv4 address.


    # ============================================================
    # 7. Display resolved CMA information
    # ============================================================

    - name: Display resolved CMA information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "              CMA INFORMATION FOUND"
          - "============================================================"
          - "CMA Name       : {{ normalized_cma_name }}"
          - "CMA IP         : {{ normalized_cma_ip }}"
          - "Inventory file : {{ mds_inventory_file }}"
          - "============================================================"


    # ============================================================
    # 8. Create Job ID directory
    # ============================================================

    - name: Create Job ID directory
      ansible.builtin.file:
        path: "{{ job_filter_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"


    # ============================================================
    # 9. Check for existing selected_targets.yml
    # ============================================================

    - name: Check existing selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat


    # ============================================================
    # 10. Read existing selected_targets.yml
    # ============================================================

    - name: Read existing selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: existing_targets_raw
      when:
        - selected_targets_stat.stat.exists

    - name: Parse existing selected_targets.yml
      ansible.builtin.set_fact:
        existing_data: >-
          {{
            existing_targets_raw.content
            | b64decode
            | from_yaml
          }}
      when:
        - selected_targets_stat.stat.exists

    - name: Initialize data for a new Job ID
      ansible.builtin.set_fact:
        existing_data:
          schema_version: 1
          job_id: "{{ normalized_job_id }}"
          created_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          updated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          selected_cmas: []
      when:
        - not selected_targets_stat.stat.exists


    # ============================================================
    # 11. Validate existing YAML structure
    # ============================================================

    - name: Validate existing selected_targets.yml structure
      ansible.builtin.assert:
        that:
          - existing_data is mapping
          - existing_data.job_id is defined
          - existing_data.selected_cmas is defined
          - existing_data.selected_cmas is sequence
        fail_msg: >-
          The existing file {{ selected_targets_file }} does not have
          the expected selected_targets.yml structure.

    - name: Validate existing Job ID
      ansible.builtin.assert:
        that:
          - existing_data.job_id | string == normalized_job_id
        fail_msg: >-
          The existing file contains Job ID
          {{ existing_data.job_id | default('UNKNOWN') }},
          but the currently entered Job ID is
          {{ normalized_job_id }}. Processing stopped for safety.


    # ============================================================
    # 12. Parse selected Cluster/Gateway choices
    #
    # Supported formats:
    #
    # CXL103 (Cluster)
    # GW201 (Gateway)
    #
    # or:
    #
    # CXL103|Cluster
    # GW201|Gateway
    # ============================================================

    - name: Initialize normalized target list
      ansible.builtin.set_fact:
        normalized_targets: []

    - name: Parse pipe-format target selections
      ansible.builtin.set_fact:
        normalized_targets: >-
          {{
            normalized_targets
            +
            [
              {
                'name': item.split('|')[0] | trim,
                'type': item.split('|')[1] | trim
              }
            ]
          }}
      loop: "{{ selected_targets_list }}"
      loop_control:
        label: "{{ item }}"
      when:
        - "'|' in item"
        - item.split('|') | length >= 2

    - name: Parse display-format target selections
      ansible.builtin.set_fact:
        normalized_targets: >-
          {{
            normalized_targets
            +
            [
              {
                'name':
                  (
                    item
                    | regex_replace('\\s*\\([^)]*\\)\\s*$', '')
                    | trim
                  ),
                'type':
                  (
                    item
                    | regex_replace(
                        '^.*\\(([^)]*)\\)\\s*$',
                        '\\1'
                      )
                    | trim
                  )
              }
            ]
          }}
      loop: "{{ selected_targets_list }}"
      loop_control:
        label: "{{ item }}"
      when:
        - "'|' not in item"
        - item is match('^.+\\s+\\([^)]+\\)\\s*$')

    - name: Validate parsed target list
      ansible.builtin.assert:
        that:
          - normalized_targets | length > 0
        fail_msg: >-
          The selected targets could not be parsed.
          Expected target format:
          CXL103 (Cluster)
          or:
          CXL103|Cluster

    - name: Validate every parsed target
      ansible.builtin.assert:
        that:
          - item.name | trim | length > 0
          - item.type | trim | length > 0
          - item.type | lower in ['cluster', 'gateway']
        fail_msg: >-
          Invalid target entry:
          {{ item }}.
          Target type must be Cluster or Gateway.
      loop: "{{ normalized_targets }}"
      loop_control:
        label: "{{ item.name | default('UNKNOWN') }}"


    # ============================================================
    # 13. Remove duplicates from current survey selection
    # ============================================================

    - name: Remove duplicate targets from current selection
      ansible.builtin.set_fact:
        normalized_targets: >-
          {{
            normalized_targets
            | unique(attribute='name')
            | list
          }}


    # ============================================================
    # 14. Find selected CMA in existing Job file
    # ============================================================

    - name: Find matching CMA in the existing Job selection
      ansible.builtin.set_fact:
        matching_cmas: >-
          {{
            existing_data.selected_cmas
            | default([])
            | selectattr(
                'cma_name',
                'equalto',
                normalized_cma_name
              )
            | list
          }}

    - name: Ensure CMA does not appear more than once
      ansible.builtin.assert:
        that:
          - matching_cmas | length <= 1
        fail_msg: >-
          CMA {{ normalized_cma_name }} appears more than once in
          {{ selected_targets_file }}. Correct the file before rerunning
          Target Selection.


    # ============================================================
    # 15. Validate CMA IP consistency
    # ============================================================

    - name: Validate CMA IP against existing selection
      ansible.builtin.assert:
        that:
          - matching_cmas[0].cma_ip | string == normalized_cma_ip
        fail_msg: >-
          CMA {{ normalized_cma_name }} already exists in this Job ID,
          but the stored IP is {{ matching_cmas[0].cma_ip }} while
          mds_inventory currently reports {{ normalized_cma_ip }}.
          Processing stopped to avoid inconsistent data.
      when:
        - matching_cmas | length == 1


    # ============================================================
    # 16. Merge targets for an existing CMA
    # ============================================================

    - name: Get currently stored targets for existing CMA
      ansible.builtin.set_fact:
        current_cma_targets: >-
          {{
            matching_cmas[0].targets
            | default([])
          }}
      when:
        - matching_cmas | length == 1

    - name: Merge new targets into existing CMA
      ansible.builtin.set_fact:
        merged_cma_targets: >-
          {{
            (
              current_cma_targets
              +
              normalized_targets
            )
            | unique(attribute='name')
            | list
          }}
      when:
        - matching_cmas | length == 1

    - name: Build CMA list without the CMA being updated
      ansible.builtin.set_fact:
        cmas_without_current: >-
          {{
            existing_data.selected_cmas
            | rejectattr(
                'cma_name',
                'equalto',
                normalized_cma_name
              )
            | list
          }}
      when:
        - matching_cmas | length == 1

    - name: Add updated CMA back into CMA list
      ansible.builtin.set_fact:
        updated_cmas: >-
          {{
            cmas_without_current
            +
            [
              {
                'cma_name': normalized_cma_name,
                'cma_ip': normalized_cma_ip,
                'targets': merged_cma_targets
              }
            ]
          }}
      when:
        - matching_cmas | length == 1


    # ============================================================
    # 17. Add a newly selected CMA
    # ============================================================

    - name: Add new CMA and selected targets
      ansible.builtin.set_fact:
        updated_cmas: >-
          {{
            existing_data.selected_cmas
            | default([])
            +
            [
              {
                'cma_name': normalized_cma_name,
                'cma_ip': normalized_cma_ip,
                'targets': normalized_targets
              }
            ]
          }}
      when:
        - matching_cmas | length == 0


    # ============================================================
    # 18. Build final selected_targets.yml data
    # ============================================================

    - name: Build final selected target structure
      ansible.builtin.set_fact:
        final_data:
          schema_version: 1
          job_id: "{{ normalized_job_id }}"
          created_at: "{{ existing_data.created_at }}"
          updated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          selected_cmas: "{{ updated_cmas }}"


    # ============================================================
    # 19. Back up an existing selected_targets.yml
    # ============================================================

    - name: Back up existing selected_targets.yml
      ansible.builtin.copy:
        src: "{{ selected_targets_file }}"
        dest: >-
          {{ selected_targets_file }}.bak.{{
            now(utc=true, fmt='%Y%m%d_%H%M%S')
          }}
        remote_src: true
        owner: root
        group: root
        mode: "0640"
      when:
        - selected_targets_stat.stat.exists


    # ============================================================
    # 20. Write selected_targets.yml
    # ============================================================

    - name: Write selected_targets.yml
      ansible.builtin.copy:
        dest: "{{ selected_targets_file }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          {{ final_data | to_nice_yaml(indent=2, sort_keys=false) }}


    # ============================================================
    # 21. Read and verify the finished file
    # ============================================================

    - name: Read saved selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: saved_targets_raw

    - name: Parse saved selected_targets.yml
      ansible.builtin.set_fact:
        saved_targets_data: >-
          {{
            saved_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Verify saved selected_targets.yml
      ansible.builtin.assert:
        that:
          - saved_targets_data.job_id == normalized_job_id
          - saved_targets_data.selected_cmas | length > 0
        fail_msg: >-
          selected_targets.yml was written but failed final validation.


    # ============================================================
    # 22. Display final Job selection
    # ============================================================

    - name: Display final Job summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "            CDT TARGET SELECTION SAVED"
          - "============================================================"
          - "Job ID        : {{ normalized_job_id }}"
          - "Output file   : {{ selected_targets_file }}"
          - "CMA count     : {{ saved_targets_data.selected_cmas | length }}"
          - "Updated CMA   : {{ normalized_cma_name }}"
          - "Updated IP    : {{ normalized_cma_ip }}"
          - "============================================================"

    - name: Display targets grouped by CMA
      ansible.builtin.debug:
        msg:
          - "------------------------------------------------------------"
          - "CMA Name : {{ item.cma_name }}"
          - "CMA IP   : {{ item.cma_ip }}"
          - "Targets  : {{ item.targets | map(attribute='name') | list }}"
      loop: "{{ saved_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"

    - name: Display final selected_targets.yml
      ansible.builtin.debug:
        msg: "{{ saved_targets_raw.content | b64decode }}"
