---
- name: Save selected CDT targets by Job ID
  hosts: all
  gather_facts: false
  become: true

  vars:
    # Existing CMA inventory
    mds_inventory_file: "/var/log/CDT_Project/Inventory/mds_inventory"

    # Base directory for target selections
    filters_base_dir: "/var/log/CDT_Project/Filters"

  tasks:

    # ============================================================
    # 1. Display variables received from AWX
    # ============================================================

    - name: Display variables received from AWX
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "              CDT TARGET SELECTION INPUT"
          - "============================================================"
          - "Job ID           : {{ job_id | default('NOT RECEIVED') }}"
          - "Selected CMA     : {{ selected_cma_name | default('NOT RECEIVED') }}"
          - "Selected targets : {{ selected_targets | default([]) }}"
          - "============================================================"


    # ============================================================
    # 2. Validate AWX variables
    # ============================================================

    - name: Validate Job ID
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id is match('^[A-Za-z0-9_-]+$')
        fail_msg: >-
          Invalid or missing job_id.
          Enter the Job ID in the AWX Target Selection survey.
          Only letters, numbers, underscores and hyphens are allowed.


    - name: Validate selected CMA
      ansible.builtin.assert:
        that:
          - selected_cma_name is defined
          - selected_cma_name | string | trim | length > 0
        fail_msg: >-
          selected_cma_name was not received.
          The CMA-selection workflow must provide selected_cma_name.


    - name: Validate selected targets
      ansible.builtin.assert:
        that:
          - selected_targets is defined
          - selected_targets | length > 0
        fail_msg: >-
          No Cluster/Gateway was selected.
          Select at least one target in the AWX survey.


    # ============================================================
    # 3. Normalize variables
    # ============================================================

    - name: Normalize Job ID and CMA name
      ansible.builtin.set_fact:
        normalized_job_id: "{{ job_id | string | trim }}"
        normalized_cma_name: "{{ selected_cma_name | string | trim }}"


    # AWX multiple-choice/multiselect may normally arrive as a list.
    # This also handles newline-separated strings.
    - name: Normalize selected targets into a list
      ansible.builtin.set_fact:
        selected_targets_list: >-
          {{
            selected_targets
            if (
              selected_targets is sequence
              and selected_targets is not string
            )
            else (
              selected_targets
              | string
              | split('\n')
              | reject('equalto', '')
              | list
            )
          }}


    - name: Define Job ID paths
      ansible.builtin.set_fact:
        job_filter_dir: >-
          {{ filters_base_dir }}/{{ normalized_job_id }}
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ normalized_job_id }}/selected_targets.yml


    # ============================================================
    # 4. Check mds_inventory
    # ============================================================

    - name: Check mds_inventory file
      ansible.builtin.stat:
        path: "{{ mds_inventory_file }}"
      register: mds_inventory_stat


    - name: Validate mds_inventory
      ansible.builtin.assert:
        that:
          - mds_inventory_stat.stat.exists
          - mds_inventory_stat.stat.isreg
          - mds_inventory_stat.stat.size | int > 0
        fail_msg: >-
          {{ mds_inventory_file }} does not exist or is empty.
          Run the MDS inventory generation job first.


    # ============================================================
    # 5. Read mds_inventory
    # ============================================================

    - name: Read CMA inventory
      ansible.builtin.slurp:
        src: "{{ mds_inventory_file }}"
      register: mds_inventory_raw


    - name: Display current CMA inventory
      ansible.builtin.debug:
        msg: "{{ mds_inventory_raw.content | b64decode }}"


    # ============================================================
    # 6. Find selected CMA IP
    #
    # Expected inventory:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1    172.20.50.41
    # CMA3_SMS1    172.20.50.42
    # ============================================================

    - name: Find selected CMA IP from mds_inventory
      ansible.builtin.shell: |
        awk -v cma="{{ normalized_cma_name }}" '
          $1 == cma {
            print $2
          }
        ' "{{ mds_inventory_file }}"
      args:
        executable: /bin/bash
      register: cma_lookup
      changed_when: false


    - name: Validate CMA lookup result
      ansible.builtin.assert:
        that:
          - cma_lookup.stdout_lines | length == 1
          - cma_lookup.stdout | trim | length > 0
        fail_msg: >-
          CMA {{ normalized_cma_name }} was not found exactly once in
          {{ mds_inventory_file }}.
          Check selected_cma_name and the MDS CMA inventory.


    - name: Save resolved CMA IP
      ansible.builtin.set_fact:
        normalized_cma_ip: "{{ cma_lookup.stdout | trim }}"


    - name: Validate CMA IPv4 address
      ansible.builtin.assert:
        that:
          - normalized_cma_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
        fail_msg: >-
          Invalid CMA IP {{ normalized_cma_ip }}
          found for CMA {{ normalized_cma_name }}.


    # ============================================================
    # 7. Show resolved CMA
    # ============================================================

    - name: Display resolved CMA information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "                CMA INFORMATION"
          - "============================================================"
          - "CMA Name : {{ normalized_cma_name }}"
          - "CMA IP   : {{ normalized_cma_ip }}"
          - "============================================================"


    # ============================================================
    # 8. Create Job ID directory
    #
    # Example:
    # /var/log/CDT_Project/Filters/CHG0012345/
    # ============================================================

    - name: Create Job ID directory
      ansible.builtin.file:
        path: "{{ job_filter_dir }}"
        state: directory
        mode: "0750"


    # ============================================================
    # 9. Check whether selected_targets.yml already exists
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat


    # ============================================================
    # 10. Read existing selected_targets.yml
    # ============================================================

    - name: Read existing selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: existing_targets_raw
      when:
        - selected_targets_stat.stat.exists


    - name: Parse existing selected_targets.yml
      ansible.builtin.set_fact:
        existing_data: >-
          {{
            existing_targets_raw.content
            | b64decode
            | from_yaml
          }}
      when:
        - selected_targets_stat.stat.exists


    # ============================================================
    # 11. Initialize a new Job ID
    # ============================================================

    - name: Initialize new Job ID data
      ansible.builtin.set_fact:
        existing_data:
          schema_version: 1
          job_id: "{{ normalized_job_id }}"
          created_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          updated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          selected_cmas: []
      when:
        - not selected_targets_stat.stat.exists


    # ============================================================
    # 12. Validate existing selected_targets.yml
    # ============================================================

    - name: Validate existing selected_targets.yml structure
      ansible.builtin.assert:
        that:
          - existing_data is mapping
          - existing_data.job_id is defined
          - existing_data.selected_cmas is defined
          - existing_data.selected_cmas is sequence
        fail_msg: >-
          Existing file {{ selected_targets_file }} does not have
          the expected selected_targets.yml structure.


    - name: Validate selected_targets.yml Job ID
      ansible.builtin.assert:
        that:
          - existing_data.job_id | string == normalized_job_id
        fail_msg: >-
          Job ID mismatch.
          Existing file belongs to
          {{ existing_data.job_id | default('UNKNOWN') }},
          but current Job ID is {{ normalized_job_id }}.


    # ============================================================
    # 13. Normalize selected target information
    #
    # Supported:
    #
    # CXL103 (Cluster)
    # GW201 (Gateway)
    #
    # Also supported:
    #
    # CXL103|Cluster
    # GW201|Gateway
    # ============================================================

    - name: Initialize normalized target list
      ansible.builtin.set_fact:
        normalized_targets: []


    # ------------------------------------------------------------
    # Format 1:
    # CXL103|Cluster
    # ------------------------------------------------------------

    - name: Parse pipe-format targets
      ansible.builtin.set_fact:
        normalized_targets: >-
          {{
            normalized_targets
            +
            [
              {
                'name': item.split('|')[0] | trim,
                'type': item.split('|')[1] | trim
              }
            ]
          }}
      loop: "{{ selected_targets_list }}"
      loop_control:
        label: "{{ item }}"
      when:
        - "'|' in item"
        - item.split('|') | length >= 2


    # ------------------------------------------------------------
    # Format 2:
    # CXL103 (Cluster)
    # ------------------------------------------------------------

    - name: Parse display-format targets
      ansible.builtin.set_fact:
        normalized_targets: >-
          {{
            normalized_targets
            +
            [
              {
                'name':
                  (
                    item
                    | regex_replace(
                        '\\s*\\([^)]*\\)\\s*$',
                        ''
                      )
                    | trim
                  ),
                'type':
                  (
                    item
                    | regex_replace(
                        '^.*\\(([^)]*)\\)\\s*$',
                        '\\1'
                      )
                    | trim
                  )
              }
            ]
          }}
      loop: "{{ selected_targets_list }}"
      loop_control:
        label: "{{ item }}"
      when:
        - "'|' not in item"
        - item is match('^.+\\s+\\([^)]+\\)\\s*$')


    # ============================================================
    # 14. Validate parsed targets
    # ============================================================

    - name: Validate normalized target list
      ansible.builtin.assert:
        that:
          - normalized_targets | length > 0
        fail_msg: >-
          The selected targets could not be parsed.
          Expected:
          CXL103 (Cluster)
          GW201 (Gateway)


    - name: Validate target type
      ansible.builtin.assert:
        that:
          - item.name | string | trim | length > 0
          - item.type | lower in ['cluster', 'gateway']
        fail_msg: >-
          Invalid target {{ item }}.
          Target type must be Cluster or Gateway.
      loop: "{{ normalized_targets }}"
      loop_control:
        label: "{{ item.name | default('UNKNOWN') }}"


    # ============================================================
    # 15. Remove duplicate selections from this AWX run
    # ============================================================

    - name: Remove duplicate targets
      ansible.builtin.set_fact:
        normalized_targets: >-
          {{
            normalized_targets
            | unique(attribute='name')
            | list
          }}


    # ============================================================
    # 16. Search for selected CMA in existing Job
    # ============================================================

    - name: Find selected CMA in existing Job
      ansible.builtin.set_fact:
        matching_cmas: >-
          {{
            existing_data.selected_cmas
            | default([])
            | selectattr(
                'cma_name',
                'equalto',
                normalized_cma_name
              )
            | list
          }}


    - name: Validate CMA is not duplicated in existing file
      ansible.builtin.assert:
        that:
          - matching_cmas | length <= 1
        fail_msg: >-
          CMA {{ normalized_cma_name }} appears multiple times in
          {{ selected_targets_file }}.
          Correct the existing file before continuing.


    # ============================================================
    # 17. Validate existing CMA IP
    # ============================================================

    - name: Validate existing CMA IP
      ansible.builtin.assert:
        that:
          - matching_cmas[0].cma_ip | string == normalized_cma_ip
        fail_msg: >-
          CMA IP mismatch for {{ normalized_cma_name }}.
          Stored IP:
          {{ matching_cmas[0].cma_ip }}
          Current mds_inventory IP:
          {{ normalized_cma_ip }}.
      when:
        - matching_cmas | length == 1


    # ============================================================
    # 18. EXISTING CMA
    #
    # Same Job ID + Same CMA
    # -> append newly selected targets
    # ============================================================

    - name: Get existing targets for current CMA
      ansible.builtin.set_fact:
        current_cma_targets: >-
          {{
            matching_cmas[0].targets
            | default([])
          }}
      when:
        - matching_cmas | length == 1


    - name: Merge targets for existing CMA
      ansible.builtin.set_fact:
        merged_cma_targets: >-
          {{
            (
              current_cma_targets
              +
              normalized_targets
            )
            | unique(attribute='name')
            | list
          }}
      when:
        - matching_cmas | length == 1


    - name: Remove current CMA from temporary CMA list
      ansible.builtin.set_fact:
        cmas_without_current: >-
          {{
            existing_data.selected_cmas
            | rejectattr(
                'cma_name',
                'equalto',
                normalized_cma_name
              )
            | list
          }}
      when:
        - matching_cmas | length == 1


    - name: Add updated CMA back into CMA list
      ansible.builtin.set_fact:
        updated_cmas: >-
          {{
            cmas_without_current
            +
            [
              {
                'cma_name': normalized_cma_name,
                'cma_ip': normalized_cma_ip,
                'targets': merged_cma_targets
              }
            ]
          }}
      when:
        - matching_cmas | length == 1


    # ============================================================
    # 19. NEW CMA
    #
    # Same Job ID + Different CMA
    # -> append new CMA
    # ============================================================

    - name: Add newly selected CMA
      ansible.builtin.set_fact:
        updated_cmas: >-
          {{
            existing_data.selected_cmas
            | default([])
            +
            [
              {
                'cma_name': normalized_cma_name,
                'cma_ip': normalized_cma_ip,
                'targets': normalized_targets
              }
            ]
          }}
      when:
        - matching_cmas | length == 0


    # ============================================================
    # 20. Build final data structure
    # ============================================================

    - name: Build final selected_targets data
      ansible.builtin.set_fact:
        final_data:
          schema_version: 1
          job_id: "{{ normalized_job_id }}"
          created_at: "{{ existing_data.created_at }}"
          updated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          selected_cmas: "{{ updated_cmas }}"


    # ============================================================
    # 21. Back up existing file
    # ============================================================

    - name: Back up existing selected_targets.yml
      ansible.builtin.copy:
        src: "{{ selected_targets_file }}"
        dest: >-
          {{ selected_targets_file }}.bak.{{
            now(utc=true, fmt='%Y%m%d_%H%M%S')
          }}
        remote_src: true
        mode: "0640"
      when:
        - selected_targets_stat.stat.exists


    # ============================================================
    # 22. Write selected_targets.yml
    # ============================================================

    - name: Write selected_targets.yml
      ansible.builtin.copy:
        dest: "{{ selected_targets_file }}"
        mode: "0640"
        content: |
          {{ final_data | to_nice_yaml(indent=2, sort_keys=false) }}


    # ============================================================
    # 23. Read saved file back for verification
    # ============================================================

    - name: Read saved selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: saved_targets_raw


    - name: Parse saved selected_targets.yml
      ansible.builtin.set_fact:
        saved_targets_data: >-
          {{
            saved_targets_raw.content
            | b64decode
            | from_yaml
          }}


    # ============================================================
    # 24. Validate finished file
    # ============================================================

    - name: Validate finished selected_targets.yml
      ansible.builtin.assert:
        that:
          - saved_targets_data is mapping
          - saved_targets_data.job_id == normalized_job_id
          - saved_targets_data.selected_cmas is defined
          - saved_targets_data.selected_cmas | length > 0
        fail_msg: >-
          selected_targets.yml was written but failed
          final validation.


    # ============================================================
    # 25. Display final Job summary
    # ============================================================

    - name: Display final Job summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "             CDT TARGET SELECTION SAVED"
          - "============================================================"
          - "Job ID      : {{ normalized_job_id }}"
          - "File        : {{ selected_targets_file }}"
          - "CMA Count   : {{ saved_targets_data.selected_cmas | length }}"
          - "Added CMA   : {{ normalized_cma_name }}"
          - "CMA IP      : {{ normalized_cma_ip }}"
          - "============================================================"


    # ============================================================
    # 26. Display every CMA and target currently associated
    #     with this Job ID
    # ============================================================

    - name: Display targets grouped by CMA
      ansible.builtin.debug:
        msg:
          - "------------------------------------------------------------"
          - "CMA Name : {{ item.cma_name }}"
          - "CMA IP   : {{ item.cma_ip }}"
          - "Targets:"
          - "{{ item.targets | map(attribute='name') | list }}"
      loop: "{{ saved_targets_data.selected_cmas }}"
      loop_control:
        label: "{{ item.cma_name }}"


    # ============================================================
    # 27. Display final YAML
    # ============================================================

    - name: Display final selected_targets.yml
      ansible.builtin.debug:
        msg: "{{ saved_targets_raw.content | b64decode }}"
