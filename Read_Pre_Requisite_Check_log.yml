---
- name: Display CDT Gateway Pre-Requisite Check Summaries
  hosts: all
  gather_facts: false
  become: false

  vars:
    # Use the known Python path and avoid the interpreter discovery warning.
    ansible_python_interpreter: /usr/bin/python3

    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    gateway_logs_dir: "/var/log/CDT_Project/Gateway_Logs"

  tasks:

    # ============================================================
    # 1. Validate job_id from AWX Workflow Survey
    # ============================================================

    - name: Validate job_id from AWX Workflow survey
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          The AWX survey variable "job_id" is missing or invalid.

          Allowed characters:
          - Letters
          - Numbers
          - Underscore
          - Hyphen
          - Period

          Example:
          CHG0012345
        success_msg: "Received job_id: {{ job_id | string | trim }}"

    - name: Normalize job_id
      ansible.builtin.set_fact:
        deployment_job_id: "{{ job_id | string | trim }}"

    - name: Define selected targets file
      ansible.builtin.set_fact:
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ deployment_job_id }}/selected_targets.yml


    # ============================================================
    # 2. Check selected_targets.yml without sudo
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop if selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          selected_targets.yml was not found.

          Job ID:
          {{ deployment_job_id }}

          Expected file:
          {{ selected_targets_file }}

          Verify that:
          1. The previous workflow job created the file.
          2. The AWX SSH account can access the job directory.
          3. The job_id supplied by the workflow is correct.
      when: not selected_targets_stat.stat.exists

    - name: Stop if selected_targets.yml is not a regular file
      ansible.builtin.fail:
        msg: |
          The selected targets path exists but is not a regular file:

          {{ selected_targets_file }}
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.isreg

    - name: Stop if selected_targets.yml is not readable
      ansible.builtin.fail:
        msg: |
          selected_targets.yml exists but the AWX SSH account cannot read it.

          File:
          {{ selected_targets_file }}

          Current AWX remote account:
          {{ ansible_user | default('unknown') }}

          Correct the file or directory permissions. This playbook does not use sudo.
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.readable


    # ============================================================
    # 3. Read and parse selected_targets.yml
    # ============================================================

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected_targets.yml structure
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas is iterable
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          No selected CMAs were found in:

          {{ selected_targets_file }}

          Expected structure:

          selected_cmas:
            - cma_name: CMA2_SMS1
              cma_ip: 172.20.50.41
              targets:
                - name: CXL103
                  type: Cluster


    # ============================================================
    # 4. Extract and validate CMA names
    # ============================================================

    - name: Initialize selected CMA list
      ansible.builtin.set_fact:
        selected_cma_names: []

    - name: Add CMA names to selected CMA list
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_cma_names
            +
            [item.cma_name | string | trim]
          }}
      loop: "{{ selected_targets_data.selected_cmas }}"
      when:
        - item.cma_name is defined
        - item.cma_name | string | trim | length > 0
      loop_control:
        label: "{{ item.cma_name | default('CMA name missing') }}"

    - name: Remove duplicate CMA names
      ansible.builtin.set_fact:
        selected_cma_names: "{{ selected_cma_names | unique | list }}"

    - name: Validate CMA names
      ansible.builtin.assert:
        that:
          - item is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          Invalid CMA name found in selected_targets.yml:

          {{ item }}

          CMA names may contain only letters, numbers, underscore,
          hyphen and period.
      loop: "{{ selected_cma_names }}"
      loop_control:
        label: "{{ item }}"

    - name: Verify at least one valid CMA was found
      ansible.builtin.assert:
        that:
          - selected_cma_names | length > 0
        fail_msg: |
          selected_targets.yml contains no valid cma_name entries.

          File:
          {{ selected_targets_file }}

    - name: Display job and CMA information
      ansible.builtin.debug:
        msg: |
          ============================================================
          CDT PRE-REQUISITE CHECK SUMMARY COLLECTION
          ============================================================
          Job ID        : {{ deployment_job_id }}
          Selected CMAs : {{ selected_cma_names | join(', ') }}
          Source file   : {{ selected_targets_file }}
          ============================================================


    # ============================================================
    # 5. Check each CMA candidate CSV
    # ============================================================

    - name: Check CMA candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item }}_PR_candidates.csv"
      loop: "{{ selected_cma_names }}"
      register: candidate_file_stats
      loop_control:
        label: "{{ item }}"

    - name: Report missing candidate CSV files
      ansible.builtin.debug:
        msg: |
          WARNING: Candidate CSV was not found.

          CMA:
          {{ item.item }}

          Expected file:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv

          Gateway logs cannot be identified for this CMA.
      loop: "{{ candidate_file_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Report unreadable candidate CSV files
      ansible.builtin.debug:
        msg: |
          WARNING: Candidate CSV exists but is not readable.

          CMA:
          {{ item.item }}

          File:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv

          Check the file and directory permissions for the AWX SSH account.
      loop: "{{ candidate_file_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 6. Extract gateway names from readable candidate CSV files
    #
    # Example candidate line:
    #
    # GW101 , CXL103 , 172.20.50.101 , R81.20/170 , active , 1
    #
    # The first CSV column is the gateway name.
    # Headers, separators, comments and blank lines are ignored.
    # ============================================================

    - name: Extract gateway names from candidate CSV files
      ansible.builtin.shell: |
        set -o pipefail

        awk -F',' '
          {
              gateway = $1

              gsub(/^[[:space:]]+/, "", gateway)
              gsub(/[[:space:]]+$/, "", gateway)

              # Ignore empty first column.
              if (gateway == "")
                  next

              # Ignore known headings.
              if (gateway == "Gateway Name")
                  next

              if (gateway == "Central Deployment Tool Candidates List:")
                  next

              # Ignore comments and separator lines.
              if (gateway ~ /^[*#=+-]+$/)
                  next
*              # Only accept safe g*teway-name characters.
           *  if (gateway !~ /^[A-Za-z0-9_.-]+*/)
                  next

       *      print gateway
          }
  *     ' "{{ candidates_dir }}/{{ it*m.item }}_PR_candidates.csv" |
   *    sort -u
      args:
        ex*cutable: /bin/bash
      loop: "{{*candidate_file_stats.results }}"
 *    when:
        - item.stat.exis*s
        - item.stat.isreg
      * - item.stat.readable
      register: gateway_extract_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 7. Build CMA-to-gateway mapping
    # ============================================================

    - name: Initialize CMA gateway mapping
      ansible.builtin.set_fact:
        cma_gateway_map: []

    - name: Add CMA and gateway results to mapping
      ansible.builtin.set_fact:
        cma_gateway_map: >-
          {{
            cma_gateway_map
            +
            [
              {
                'cma_name': item.item.item,
                'candidate_file':
                  candidates_dir
                  ~ '/'
                  ~ item.item.item
                  ~ '_PR_candidates.csv',
                'gateways':
                  (
                    item.stdout_lines
                    | default([])
                    | map('trim')
                    | reject('equalto', '')
                    | unique
                    | list
                  )
              }
            ]
          }}
      loop: "{{ gateway_extract_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
      loop_control:
        label: "{{ item.item.item | default('Unknown CMA') }}"

    - name: Display warning when candidate CSV has no gateway entries
      ansible.builtin.debug:
        msg: |
          WARNING: No gateway names were found in the candidate CSV.

          CMA:
          {{ item.cma_name }}

          Candidate file:
          {{ item.candidate_file }}
      loop: "{{ cma_gateway_map }}"
      when: item.gateways | length == 0
      loop_control:
        label: "{{ item.cma_name }}"


    # ============================================================
    # 8. Build unique global gateway list
    # ============================================================

    - name: Initialize gateway list
      ansible.builtin.set_fact:
        gateway_names: []

    - name: Add discovered gateways to global gateway list
      ansible.builtin.set_fact:
        gateway_names: >-
          {{
            (
              gateway_names
              +
              item.gateways
            )
            | unique
            | list
          }}
      loop: "{{ cma_gateway_map }}"
      when: item.gateways | length > 0
      loop_control:
        label: "{{ item.cma_name }}"

    - name: Stop if no gateways were discovered
      ansible.builtin.fail:
        msg: |
          No gateway names were found in any readable candidate CSV.

          CMAs checked:
          {{ selected_cma_names | join(', ') }}

          Candidate directory:
          {{ candidates_dir }}

          Expected filename format:
          <cma_name>_PR_candidates.csv
      when: gateway_names | length == 0

    - name: Display discovered gateway mapping
      ansible.builtin.debug:
        msg: |
          ============================================================
          GATEWAYS FOUND FROM CDT CANDIDATE FILES
          ============================================================
          {% for entry in cma_gateway_map %}
          CMA            : {{ entry.cma_name }}
          Candidate file : {{ entry.candidate_file }}
          Gateways       : {{ entry.gateways | join(', ') if entry.gateways | length > 0 else 'None found' }}

          {% endfor %}
          ============================================================
          Total unique gateways: {{ gateway_names | length }}
          ============================================================


    # ============================================================
    # 9. Check each gateway log
    # ============================================================

    - name: Check gateway pre-requisite log files
      ansible.builtin.stat:
        path: >-
          {{ gateway_logs_dir }}/{{ item }}_pre_requisite_check.log
      loop: "{{ gateway_names }}"
      register: gateway_log_stats
      loop_control:
        label: "{{ item }}"

    - name: Report missing gateway log files
      ansible.builtin.debug:
        msg: |
          WARNING: Gateway pre-requisite check log was not found.

          Gateway:
          {{ item.item }}

          Expected file:
          {{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Report unreadable gateway log files
      ansible.builtin.debug:
        msg: |
          WARNING: Gateway pre-requisite check log exists but is not readable.

          Gateway:
          {{ item.item }}

          File:
          {{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log

          Check file permissions for the AWX SSH account.
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 10. Extract only PRE-REQUISITE CHECK SUMMARY
    #
    # Extraction begins at:
    # PRE-REQUISITE CHECK SUMMARY
    #
    # Extraction ends after:
    # OVERALL STATUS : PASS/FAIL
    #
    # The separator before and after the summary is included.
    # ============================================================

    - name: Extract PRE-REQUISITE CHECK SUMMARY from gateway logs
      ansible.builtin.shell: |
        awk '
          # Save separator lines found before the summary title.
          /^[=]+[[:space:]]*$/ && !in_summary {
              previous_separator = $0
              next
          }

          # Start at the summary heading.
          /PRE-REQUISITE CHECK SUMMARY/ {
              if (previous_separator != "")
                  print previous_separator

              print
              in_summary = 1
              next
          }

          # Print summary content.
          in_summary {
              print

              # Finish immediately after OVERALL STATUS.
              if ($0 ~ /^[[:space:]]*OVERALL STATUS[[:space:]]*:/) {
                  if ((getline next_line) > 0) {
                      if (next_line ~ /^[=]+[[:space:]]*$/)
                          print next_line
                  }

                  summary_complete = 1
                  exit
              }
          }

          END {
              if (!in_summary)
                  exit 2

              if (!summary_complete)
                  exit 3
          }
        ' "{{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log"
      args:
        executable: /bin/bash
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: prereq_summary_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 11. Report logs without a complete summary
    #
    # Return codes:
    # 0 = complete summary found
    # 2 = summary heading not found
    # 3 = summary found, but OVERALL STATUS not found
    # ============================================================

    - name: Report log with no PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: |
          WARNING: PRE-REQUISITE CHECK SUMMARY was not found.

          Gateway:
          {{ item.item.item }}

          Log file:
          {{ gateway_logs_dir }}/{{ item.item.item }}_pre_requisite_check.log
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 2
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"

    - name: Report incomplete PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: |
          WARNING: The PRE-REQUISITE CHECK SUMMARY is incomplete.

          The heading was found, but the OVERALL STATUS line was not found.

          Gateway:
          {{ item.item.item }}

          Log file:
          {{ gateway_logs_dir }}/{{ item.item.item }}_pre_requisite_check.log
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 3
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"


    # ============================================================
    # 12. Display only complete PRE-REQUISITE CHECK SUMMARY results
    # ============================================================

    - name: Display PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: |
          {{ item.stdout }}
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
        - item.stdout is defined
        - item.stdout | trim | length > 0
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"


    # ============================================================
    # 13. Final processing result
    # ============================================================

    - name: Calculate summary result counts
      ansible.builtin.set_fact:
        complete_summary_count: >-
          {{
            prereq_summary_results.results
            | default([])
            | selectattr('rc', 'defined')
            | selectattr('rc', 'equalto', 0)
            | list
            | length
          }}

        missing_log_count: >-
          {{
            gateway_log_stats.results
            | rejectattr('stat.exists', 'equalto', true)
            | list
            | length
          }}

    - name: Display final collection result
      ansible.builtin.debug:
        msg: |
          ============================================================
          PRE-REQUISITE SUMMARY COLLECTION RESULT
          ============================================================
          Job ID                    : {{ deployment_job_id }}
          CMAs processed            : {{ selected_cma_names | length }}
          Unique gateways discovered: {{ gateway_names | length }}
          Complete summaries shown  : {{ complete_summary_count }}
          Missing gateway logs      : {{ missing_log_count }}
          ============================================================
