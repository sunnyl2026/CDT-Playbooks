---
- name: Generate CDT Pre-Requisite Check Summary
  hosts: all
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    gateway_logs_dir: "/var/log/CDT_Project/Gateway_Logs"

  tasks:

    # ============================================================
    # 1. Validate job_id from AWX Workflow survey
    # ============================================================

    - name: Validate job_id
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          ERROR: The AWX Workflow survey variable "job_id"
          is missing or invalid.

          Example:
          CHG0012345

          Allowed characters:
          Letters, numbers, underscore, hyphen and period.

    - name: Normalize job_id
      ansible.builtin.set_fact:
        deployment_job_id: "{{ job_id | string | trim }}"

    - name: Define job paths
      ansible.builtin.set_fact:
        job_directory: >-
          {{ filters_base_dir }}/{{ deployment_job_id }}

        selected_targets_file: >-
          {{ filters_base_dir }}/{{ deployment_job_id }}/selected_targets.yml

        combined_report_file: >-
          {{ filters_base_dir }}/{{ deployment_job_id }}/pre_requisite_check_summary.log


    # ============================================================
    # 2. Validate selected_targets.yml
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop if selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          ERROR: selected_targets.yml was not found.

          Job ID:
          {{ deployment_job_id }}

          Expected file:
          {{ selected_targets_file }}
      when: not selected_targets_stat.stat.exists

    - name: Stop if selected_targets.yml is not a regular file
      ansible.builtin.fail:
        msg: |
          ERROR: The selected targets path is not a regular file.

          Path:
          {{ selected_targets_file }}
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.isreg

    - name: Stop if selected_targets.yml is not readable
      ansible.builtin.fail:
        msg: |
          ERROR: The AWX SSH account cannot read:

          {{ selected_targets_file }}

          This playbook does not use sudo.
          Check file and directory permissions.
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.readable


    # ============================================================
    # 3. Read selected_targets.yml
    # ============================================================

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected_targets.yml structure
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas is iterable
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          ERROR: No selected_cmas information was found in:

          {{ selected_targets_file }}

          Expected structure:

          selected_cmas:
            - cma_name: CMA2_SMS1
              cma_ip: 172.20.50.41
              targets:
                - name: CXL103
                  type: Cluster


    # ============================================================
    # 4. Build selected CMA list
    # ============================================================

    - name: Initialize selected CMA list
      ansible.builtin.set_fact:
        selected_cma_names: []

    - name: Add selected CMA names
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_cma_names
            +
            [item.cma_name | string | trim]
          }}
      loop: "{{ selected_targets_data.selected_cmas }}"
      when:
        - item.cma_name is defined
        - item.cma_name | string | trim | length > 0
      loop_control:
        label: "{{ item.cma_name | default('Missing CMA name') }}"

    - name: Remove duplicate CMA names
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_cma_names
            | unique
            | list
          }}

    - name: Validate selected CMA list
      ansible.builtin.assert:
        that:
          - selected_cma_names | length > 0
        fail_msg: |
          ERROR: No valid CMA names were found in:

          {{ selected_targets_file }}

    - name: Validate CMA name characters
      ansible.builtin.assert:
        that:
          - item is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          ERROR: Invalid CMA name:

          {{ item }}

          Allowed characters:
          Letters, numbers, underscore, hyphen and period.
      loop: "{{ selected_cma_names }}"
      loop_control:
        label: "{{ item }}"


    # ============================================================
    # 5. Check candidate CSV files
    # ============================================================

    - name: Check CMA candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item }}_PR_candidates.csv"
      loop: "{{ selected_cma_names }}"
      register: candidate_csv_stats
      loop_control:
        label: "{{ item }}"

    - name: Report missing candidate CSV
      ansible.builtin.debug:
        msg: >-
          WARNING: Candidate CSV for {{ item.item }} was not found:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Report unreadable candidate CSV
      ansible.builtin.debug:
        msg: >-
          WARNING: Candidate CSV for {{ item.item }} cannot be read:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 6. Read CMA, gateway and cluster mapping
    #
    # Candidate CSV example:
    #
    # Gateway Name, Cluster Name, IP Address, ...
    # GW101, CXL103, 172.20.50.101, ...
    # GW102, CXL103, 172.20.50.102, ...
    #
    # Internal output:
    #
    # CMA2_SMS1|GW101|CXL103
    # CMA2_SMS1|GW102|CXL103
    # CMA3_SMS1|R8120GW202|
    # ============================================================

    - name: Read gateway and cluster mapping
      ansible.builtin.shell: |
        awk -F',' -v cma="{{ item.item }}" '
          {
              gateway = $1
              cluster = $2

              gsub(/^[[:space:]]+/, "", gateway)
              gsub(/[[:space:]]+$/, "", gateway)
              gsub(/\r$/, "", gateway)

              gsub(/^[[:space:]]+/, "", cluster)
              gsub(/[[:space:]]+$/, "", cluster)
              gsub(/\r$/, "", cluster)

              if (gateway == "") {
                  next
              }

              if (gateway == "Gateway Name") {
                  next
              }

              if (gateway == "Central Deployment Tool Candidates List:") {
                  next
              }

              if (gateway ~ /^[*#=+-]+$/) {
                  next
              }

              if (gateway !~ /^[A-Za-z0-9_.-]+$/) {
                  next
              }

              print cma "|" gateway "|" cluster
          }
        ' "{{ candidates_dir }}/{{ item.item }}_PR_candidates.csv"
      args:
        executable: /bin/bash
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: gateway_mapping_raw
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 7. Build structured target list
    # ============================================================

    - name: Initialize gateway target list
      ansible.builtin.set_fact:
        gateway_targets: []

    - name: Build gateway target list
      ansible.builtin.set_fact:
        gateway_targets: >-
          {{
            gateway_targets
            +
            [
              {
                'cma_name':
                  (item.1.split('|')[0] | trim),

                'gateway_name':
                  (item.1.split('|')[1] | trim),

                'cluster_name':
                  (
                    item.1.split('|')[2] | trim
                    if item.1.split('|') | length > 2
                    else ''
                  )
              }
            ]
          }}
      with_subelements:
        - "{{ gateway_mapping_raw.results | default([]) }}"
        - stdout_lines
        - skip_missing: true
      when:
        - item.1 is defined
        - item.1 | trim | length > 0
        - item.1.split('|') | length >= 2
      loop_control:
        label: "{{ item.1 }}"

    - name: Stop if no gateways were discovered
      ansible.builtin.fail:
        msg: |
          ERROR: No gateways were found in the candidate CSV files.

          CMAs:
          {{ selected_cma_names | join(', ') }}

          Candidate directory:
          {{ candidates_dir }}
      when: gateway_targets | length == 0


    # ============================================================
    # 8. Check gateway logs
    # ============================================================

    - name: Check gateway pre-requisite log files
      ansible.builtin.stat:
        path: >-
          {{ gateway_logs_dir }}/{{ item.gateway_name }}_pre_requisite_check.log
      loop: "{{ gateway_targets }}"
      register: gateway_log_stats
      loop_control:
        label: "{{ item.gateway_name }}"

    - name: Report missing gateway log
      ansible.builtin.debug:
        msg:
          - "WARNING: Pre-requisite log was not found."
          - "CMA: {{ item.item.cma_name }}"
          - >-
            Cluster:
            {{
              item.item.cluster_name
              if item.item.cluster_name | length > 0
              else 'N/A'
            }}
          - "Gateway: {{ item.item.gateway_name }}"
          - >-
            Expected:
            {{ gateway_logs_dir }}/{{ item.item.gateway_name }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item.gateway_name }}"

    - name: Report unreadable gateway log
      ansible.builtin.debug:
        msg:
          - "WARNING: Pre-requisite log cannot be read."
          - "CMA: {{ item.item.cma_name }}"
          - >-
            Cluster:
            {{
              item.item.cluster_name
              if item.item.cluster_name | length > 0
              else 'N/A'
            }}
          - "Gateway: {{ item.item.gateway_name }}"
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item.gateway_name }}"


    # ============================================================
    # 9. Initialize combined report
    # ============================================================

    - name: Initialize combined prerequisite report
      ansible.builtin.copy:
        dest: "{{ combined_report_file }}"
        mode: "0644"
        content: |
          ============================================================
           CDT PRE-REQUISITE CHECK REPORT
          ============================================================

          Job ID                    : {{ deployment_job_id }}
          Generated By              : AWX
          Selected CMA Count        : {{ selected_cma_names | length }}
          Discovered Gateway Count  : {{ gateway_targets | length }}

          ============================================================

      register: initialize_report_result


    # ============================================================
    # 10. Generate and append one formatted gateway report
    #
    # This task:
    #
    # - Reads the original gateway log.
    # - Extracts only PRE-REQUISITE CHECK SUMMARY.
    # - Inserts CMA, cluster and gateway details.
    # - Preserves the original report alignment.
    # - Appends the complete report to the combined output file.
    # - Prints one complete summary to task stdout.
    #
    # No debug module is used for report body output.
    # ============================================================

    - name: Generate formatted PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.shell: |
        set -o pipefail

        LOG_FILE="{{ gateway_logs_dir }}/{{ item.item.gateway_name }}_pre_requisite_check.log"
        REPORT_FILE="{{ combined_report_file }}"

        CMA_NAME="{{ item.item.cma_name }}"
        CLUSTER_NAME="{{ item.item.cluster_name | default('') }}"
        GATEWAY_NAME="{{ item.item.gateway_name }}"

        if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="N/A"
        fi

        TEMP_REPORT=$(mktemp)

        awk \
          -v cma="$CMA_NAME" \
          -v cluster="$CLUSTER_NAME" \
          -v gateway="$GATEWAY_NAME" '
          BEGIN {
              found = 0
              complete = 0
          }

          /PRE-REQUISITE CHECK SUMMARY/ {
              print "============================================================"
              print " PRE-REQUISITE CHECK SUMMARY"
              print "============================================================"
              print ""

              printf "%-27s : %s\n", "CMA Name", cma
              printf "%-27s : %s\n", "Cluster Name", cluster
              printf "%-27s : %s\n", "Gateway Name", gateway

              print ""

              found = 1
              next
          }

          found {
              if ($0 ~ /^[=]+[[:space:]]*$/) {
                  next
              }

              print

              if ($0 ~ /^[[:space:]]*OVERALL STATUS[[:space:]]*:/) {
                  print "============================================================"
                  complete = 1
                  exit
              }
          }

          END {
              if (!found) {
                  exit 2
              }

              if (!complete) {
                  exit 3
              }
          }
        ' "$LOG_FILE" > "$TEMP_REPORT"

        AWK_RC=$?

        if [ "$AWK_RC" -eq 2 ]; then
            {
                echo "============================================================"
                echo " PRE-REQUISITE CHECK SUMMARY"
                echo "============================================================"
                echo
                printf "%-27s : %s\n" "CMA Name" "$CMA_NAME"
                printf "%-27s : %s\n" "Cluster Name" "$CLUSTER_NAME"
                printf "%-27s : %s\n" "Gateway Name" "$GATEWAY_NAME"
                echo
                echo "ERROR: PRE-REQUISITE CHECK SUMMARY was not found."
                echo "============================================================"
            } > "$TEMP_REPORT"
        elif [ "$AWK_RC" -eq 3 ]; then
            {
                echo "============================================================"
                echo " PRE-REQUISITE CHECK SUMMARY"
                echo "============================================================"
                echo
                printf "%-27s : %s\n" "CMA Name" "$CMA_NAME"
                printf "%-27s : %s\n" "Cluster Name" "$CLUSTER_NAME"
                printf "%-27s : %s\n" "Gateway Name" "$GATEWAY_NAME"
                echo
                echo "ERROR: Summary is incomplete."
                echo "OVERALL STATUS was not found."
                echo "============================================================"
            } > "$TEMP_REPORT"
        fi

        cat "$TEMP_REPORT"
        echo >> "$REPORT_FILE"
        cat "$TEMP_REPORT" >> "$REPORT_FILE"
        echo >> "$REPORT_FILE"

        rm -f "$TEMP_REPORT"

        exit "$AWK_RC"
      args:
        executable: /bin/bash
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: formatted_report_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item.gateway_name }}"


    # ============================================================
    # 11. Count results
    # ============================================================

    - name: Initialize result counters
      ansible.builtin.set_fact:
        complete_summary_count: 0
        missing_summary_count: 0
        incomplete_summary_count: 0
        missing_log_count: 0
        unreadable_log_count: 0

    - name: Count complete summaries
      ansible.builtin.set_fact:
        complete_summary_count: "{{ complete_summary_count | int + 1 }}"
      loop: "{{ formatted_report_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"

    - name: Count missing summary sections
      ansible.builtin.set_fact:
        missing_summary_count: "{{ missing_summary_count | int + 1 }}"
      loop: "{{ formatted_report_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 2
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"

    - name: Count incomplete summaries
      ansible.builtin.set_fact:
        incomplete_summary_count: "{{ incomplete_summary_count | int + 1 }}"
      loop: "{{ formatted_report_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 3
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"

    - name: Count missing gateway logs
      ansible.builtin.set_fact:
        missing_log_count: "{{ missing_log_count | int + 1 }}"
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item.gateway_name }}"

    - name: Count unreadable gateway logs
      ansible.builtin.set_fact:
        unreadable_log_count: "{{ unreadable_log_count | int + 1 }}"
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item.gateway_name }}"


    # ============================================================
    # 12. Append collection result to combined report
    # ============================================================

    - name: Append final collection result to report
      ansible.builtin.blockinfile:
        path: "{{ combined_report_file }}"
        marker: ""
        insertafter: EOF
        block: |
          ============================================================
           PRE-REQUISITE SUMMARY COLLECTION RESULT
          ============================================================

          Job ID                     : {{ deployment_job_id }}
          CMAs processed             : {{ selected_cma_names | length }}
          Gateways discovered        : {{ gateway_targets | length }}
          Complete summaries         : {{ complete_summary_count }}
          Missing summary sections   : {{ missing_summary_count }}
          Incomplete summaries       : {{ incomplete_summary_count }}
          Missing gateway logs       : {{ missing_log_count }}
          Unreadable gateway logs    : {{ unreadable_log_count }}

          Combined report:
          {{ combined_report_file }}

          ============================================================


    # ============================================================
    # 13. Validate combined report
    # ============================================================

    - name: Check generated combined report
      ansible.builtin.stat:
        path: "{{ combined_report_file }}"
      register: combined_report_stat

    - name: Verify combined report was generated
      ansible.builtin.assert:
        that:
          - combined_report_stat.stat.exists
          - combined_report_stat.stat.isreg
          - combined_report_stat.stat.size | int > 0
        fail_msg: |
          ERROR: The combined prerequisite report was not generated.

          Expected:
          {{ combined_report_file }}


    # ============================================================
    # 14. Final AWX result
    #
    # This final result is intentionally short.
    # The exact terminal-style output is stored in the report file.
    # ============================================================

    - name: Display final collection result
      ansible.builtin.debug:
        msg:
          - "Job ID: {{ deployment_job_id }}"
          - "CMAs processed: {{ selected_cma_names | length }}"
          - "Gateways discovered: {{ gateway_targets | length }}"
          - "Complete summaries: {{ complete_summary_count }}"
          - "Missing gateway logs: {{ missing_log_count }}"
          - "Missing summary sections: {{ missing_summary_count }}"
          - "Incomplete summaries: {{ incomplete_summary_count }}"
          - "Full formatted report: {{ combined_report_file }}"
