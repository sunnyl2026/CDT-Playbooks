---
- name: Display CDT Gateway Pre-Requisite Check Summaries
  hosts: all
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    gateway_logs_dir: "/var/log/CDT_Project/Gateway_Logs"

  tasks:

    # ============================================================
    # 1. Validate job_id from AWX Workflow Survey
    # ============================================================

    - name: Validate job_id
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          ERROR: job_id is missing or invalid.

          Expected example:
          CHG0012345

    - name: Normalize job_id
      ansible.builtin.set_fact:
        deployment_job_id: "{{ job_id | string | trim }}"

    - name: Define selected targets file
      ansible.builtin.set_fact:
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ deployment_job_id }}/selected_targets.yml


    # ============================================================
    # 2. Check selected_targets.yml
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop when selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          ERROR: selected_targets.yml was not found.

          Job ID:
          {{ deployment_job_id }}

          Expected:
          {{ selected_targets_file }}
      when: not selected_targets_stat.stat.exists

    - name: Stop when selected_targets.yml is not readable
      ansible.builtin.fail:
        msg: |
          ERROR: selected_targets.yml exists but cannot be read.

          File:
          {{ selected_targets_file }}

          Check permissions for the AWX SSH account.
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.readable


    # ============================================================
    # 3. Read selected_targets.yml
    # ============================================================

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected_targets.yml
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          ERROR: selected_cmas was not found in:

          {{ selected_targets_file }}


    # ============================================================
    # 4. Create CMA list
    # ============================================================

    - name: Initialize CMA list
      ansible.builtin.set_fact:
        selected_cma_names: []

    - name: Add selected CMA names
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_cma_names
            +
            [item.cma_name | string | trim]
          }}
      loop: "{{ selected_targets_data.selected_cmas }}"
      when:
        - item.cma_name is defined
        - item.cma_name | string | trim | length > 0
      loop_control:
        label: "{{ item.cma_name | default('Unknown CMA') }}"

    - name: Remove duplicate CMA names
      ansible.builtin.set_fact:
        selected_cma_names: "{{ selected_cma_names | unique | list }}"

    - name: Validate CMA list
      ansible.builtin.assert:
        that:
          - selected_cma_names | length > 0
        fail_msg: "ERROR: No CMA names were found."


    # ============================================================
    # 5. Check candidate CSV for each CMA
    # ============================================================

    - name: Check CMA candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item }}_PR_candidates.csv"
      loop: "{{ selected_cma_names }}"
      register: candidate_csv_stats
      loop_control:
        label: "{{ item }}"

    - name: Report missing candidate CSV
      ansible.builtin.debug:
        msg: >-
          WARNING: Candidate CSV for {{ item.item }} was not found:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 6. Read Gateway + Cluster information
    #
    # Output produced by AWK:
    #
    # CMA2_SMS1|GW101|CXL103
    # CMA2_SMS1|GW102|CXL103
    #
    # For standalone gateway:
    #
    # CMA3_SMS1|R8120GW202|
    # ============================================================

    - name: Read gateway and cluster mapping from candidate CSV
      ansible.builtin.shell: |
        awk -F',' -v cma="{{ item.item }}" '
          {
              gateway = $1
              cluster = $2

              gsub(/^[[:space:]]+/, "", gateway)
              gsub(/[[:space:]]+$/, "", gateway)
              gsub(/\r$/, "", gateway)

              gsub(/^[[:space:]]+/, "", cluster)
              gsub(/[[:space:]]+$/, "", cluster)
              gsub(/\r$/, "", cluster)

              if (gateway == "")
                  next

              if (gateway == "Gateway Name")
                  next

              if (gateway == "Central Deployment Tool Candidates List:")
                  next

              if (gateway ~ /^[*#=+-]+$/)
                  next

              if (gateway !~ /^[A-Za-z0-9_.-]+$/)
                  next

              print cma "|" gateway "|" cluster
          }
        ' "{{ candidates_dir }}/{{ item.item }}_PR_candidates.csv"
      args:
        executable: /bin/bash
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: gateway_mapping_raw
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 7. Build structured gateway target list
    #
    # Example:
    #
    # gateway_targets:
    #   - cma_name: CMA2_SMS1
    #     gateway_name: GW101
    #     cluster_name: CXL103
    #
    #   - cma_name: CMA2_SMS1
    #     gateway_name: GW102
    #     cluster_name: CXL103
    # ============================================================

    - name: Initialize gateway target list
      ansible.builtin.set_fact:
        gateway_targets: []

    - name: Build gateway target list
      ansible.builtin.set_fact:
        gateway_targets: >-
          {{
            gateway_targets
            +
            [
              {
                'cma_name': (item.1.split('|')[0] | trim),
                'gateway_name': (item.1.split('|')[1] | trim),
                'cluster_name':
                  (
                    item.1.split('|')[2] | trim
                    if item.1.split('|') | length > 2
                    else ''
                  )
              }
            ]
          }}
      with_subelements:
        - "{{ gateway_mapping_raw.results | default([]) }}"
        - stdout_lines
        - skip_missing: true
      when:
        - item.1 is defined
        - item.1 | trim | length > 0
        - item.1.split('|') | length >= 2
      loop_control:
        label: "{{ item.1 }}"


    # ============================================================
    # 8. Validate discovered gateways
    # ============================================================

    - name: Stop when no gateways were discovered
      ansible.builtin.fail:
        msg: |
          ERROR: No gateways were found in the candidate CSV files.

          CMAs:
          {{ selected_cma_names | join(', ') }}

          Candidate directory:
          {{ candidates_dir }}
      when: gateway_targets | length == 0


    # ============================================================
    # 9. Check gateway prerequisite log
    # ============================================================

    - name: Check gateway pre-requisite log files
      ansible.builtin.stat:
        path: >-
          {{ gateway_logs_dir }}/{{ item.gateway_name }}_pre_requisite_check.log
      loop: "{{ gateway_targets }}"
      register: gateway_log_stats
      loop_control:
        label: "{{ item.gateway_name }}"


    # ============================================================
    # 10. Report missing logs
    # ============================================================

    - name: Report missing gateway log
      ansible.builtin.debug:
        msg: |
          WARNING: Gateway pre-requisite log was not found.

          CMA Name     : {{ item.item.cma_name }}
          Cluster Name : {{ item.item.cluster_name | default('') }}
          Gateway Name : {{ item.item.gateway_name }}

          Expected:
          {{ gateway_logs_dir }}/{{ item.item.gateway_name }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item.gateway_name }}"


    # ============================================================
    # 11. Extract summary and ADD CMA / Cluster / Gateway
    #
    # Expected output:
    #
    # ============================================================
    #  PRE-REQUISITE CHECK SUMMARY
    # ============================================================
    #
    # CMA Name                   : CMA2_SMS1
    # Cluster Name               : CXL103
    # Gateway Name               : GW101
    #
    # Script Version             : ...
    # Hostname                   : ...
    #
    # ...
    #
    # OVERALL STATUS             : PASS
    # ============================================================
    # ============================================================

    - name: Extract formatted PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.shell: |
        LOG_FILE="{{ gateway_logs_dir }}/{{ item.item.gateway_name }}_pre_requisite_check.log"

        awk \
          -v cma="{{ item.item.cma_name }}" \
          -v cluster="{{ item.item.cluster_name | default('') }}" \
          -v gateway="{{ item.item.gateway_name }}" '
          BEGIN {
              in_summary = 0
              summary_complete = 0
              header_added = 0
          }

          /^[=]+[[:space:]]*$/ && !in_summary {
              previous_separator = $0
              next
          }

          /PRE-REQUISITE CHECK SUMMARY/ {

              if (previous_separator != "")
                  print previous_separator
              else
                  print "============================================================"

              print
              print "============================================================"
              print ""
              printf "%-27s : %s\n", "CMA Name", cma

              if (cluster != "")
                  printf "%-27s : %s\n", "Cluster Name", cluster
              else
                  printf "%-27s : %s\n", "Cluster Name", "N/A"

              printf "%-27s : %s\n", "Gateway Name", gateway
              print ""

              in_summary = 1
              header_added = 1
              next
          }

          in_summary {

              print

              if ($0 ~ /^[[:space:]]*OVERALL STATUS[[:space:]]*:/) {

                  summary_complete = 1

                  if ((getline final_separator) > 0) {

                      if (final_separator ~ /^[=]+[[:space:]]*$/)
                          print final_separator
                      else
                          print "============================================================"

                  } else {
                      print "============================================================"
                  }

                  exit
              }
          }

          END {

              if (!in_summary)
                  exit 2

              if (!summary_complete)
                  exit 3
          }

        ' "$LOG_FILE"
      args:
        executable: /bin/bash
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: formatted_summary_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item.gateway_name }}"


    # ============================================================
    # 12. Report summary parsing problems
    # ============================================================

    - name: Report log without PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: |
          WARNING: PRE-REQUISITE CHECK SUMMARY was not found.

          CMA Name     : {{ item.item.item.cma_name }}
          Cluster Name : {{ item.item.item.cluster_name | default('N/A') }}
          Gateway Name : {{ item.item.item.gateway_name }}
      loop: "{{ formatted_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 2
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"


    - name: Report incomplete PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: |
          WARNING: PRE-REQUISITE CHECK SUMMARY is incomplete.

          CMA Name     : {{ item.item.item.cma_name }}
          Cluster Name : {{ item.item.item.cluster_name | default('N/A') }}
          Gateway Name : {{ item.item.item.gateway_name }}

          OVERALL STATUS was not found.
      loop: "{{ formatted_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 3
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"


    # ============================================================
    # 13. Display formatted summaries
    #
    # Keep this as ONE string instead of stdout_lines.
    #
    # The formatting contained inside stdout is exactly the
    # formatting generated above.
    # ============================================================

    - name: Display formatted PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ formatted_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
        - item.stdout is defined
        - item.stdout | length > 0
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"


    # ============================================================
    # 14. Count successful summaries
    # ============================================================

    - name: Initialize result counters
      ansible.builtin.set_fact:
        complete_summary_count: 0
        missing_log_count: 0

    - name: Count complete summaries
      ansible.builtin.set_fact:
        complete_summary_count: "{{ complete_summary_count | int + 1 }}"
      loop: "{{ formatted_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"

    - name: Count missing logs
      ansible.builtin.set_fact:
        missing_log_count: "{{ missing_log_count | int + 1 }}"
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item.gateway_name }}"


    # ============================================================
    # 15. Final result
    # ============================================================

    - name: Display final collection result
      ansible.builtin.debug:
        msg:
          - "Job ID: {{ deployment_job_id }}"
          - "CMAs processed: {{ selected_cma_names | length }}"
          - "Gateways processed: {{ gateway_targets | length }}"
          - "Complete summaries: {{ complete_summary_count }}"
          - "Missing gateway logs: {{ missing_log_count }}"
