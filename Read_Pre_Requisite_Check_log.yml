---
- name: Display CDT Gateway Pre-Requisite Check Summaries
  hosts: all
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    gateway_logs_dir: "/var/log/CDT_Project/Gateway_Logs"

  tasks:

    # ============================================================
    # 1. Validate job_id from AWX Workflow Survey
    # ============================================================

    - name: Validate job_id
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          ERROR: job_id is missing or invalid.

          Expected example:
          CHG0012345

    - name: Normalize job_id
      ansible.builtin.set_fact:
        deployment_job_id: "{{ job_id | string | trim }}"

    - name: Define selected targets file
      ansible.builtin.set_fact:
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ deployment_job_id }}/selected_targets.yml


    # ============================================================
    # 2. Check selected_targets.yml
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop if selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          ERROR: selected_targets.yml was not found.

          Job ID:
          {{ deployment_job_id }}

          Expected:
          {{ selected_targets_file }}
      when: not selected_targets_stat.stat.exists

    - name: Stop if selected_targets.yml is not readable
      ansible.builtin.fail:
        msg: |
          ERROR: selected_targets.yml is not readable.

          File:
          {{ selected_targets_file }}

          Check the file permissions for the AWX SSH account.
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.readable


    # ============================================================
    # 3. Read selected_targets.yml
    # ============================================================

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected CMA information
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          ERROR: No selected CMA information was found in:

          {{ selected_targets_file }}


    # ============================================================
    # 4. Build CMA list
    # ============================================================

    - name: Build selected CMA list
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_targets_data.selected_cmas
            | selectattr('cma_name', 'defined')
            | map(attribute='cma_name')
            | map('trim')
            | unique
            | list
          }}

    - name: Validate CMA list
      ansible.builtin.assert:
        that:
          - selected_cma_names | length > 0
        fail_msg: |
          ERROR: No valid CMA names were found.


    # ============================================================
    # 5. Show job being processed
    # ============================================================

    - name: Show CDT job information
      ansible.builtin.debug:
        msg:
          - "Job ID: {{ deployment_job_id }}"
          - "Selected CMAs: {{ selected_cma_names | join(', ') }}"


    # ============================================================
    # 6. Check candidate files
    # ============================================================

    - name: Check CMA candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item }}_PR_candidates.csv"
      loop: "{{ selected_cma_names }}"
      register: candidate_csv_stats
      loop_control:
        label: "{{ item }}"


    # ============================================================
    # 7. Warn about missing candidate files
    # ============================================================

    - name: Report missing candidate CSV
      ansible.builtin.debug:
        msg: >-
          WARNING: Candidate file for {{ item.item }} was not found:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 8. Extract gateways from candidate files
    #
    # Example:
    #
    # Gateway Name, Cluster Name, IP Address, ...
    #
    # GW101, CXL103, 172.20.50.101, ...
    # GW102, CXL103, 172.20.50.102, ...
    #
    # First column = Gateway Name
    # ============================================================

    - name: Extract gateways from candidate CSV
      ansible.builtin.shell: |
        awk -F',' '
          {
              gateway = $1

              gsub(/^[[:space:]]+/, "", gateway)
              gsub(/[[:space:]]+$/, "", gateway)

              if (gateway == "")
                  next

              if (gateway == "Gateway Name")
                  next

              if (gateway == "Central Deployment Tool Candidates List:")
                  next

              if (gateway ~ /^[*#=+-]+$/)
                  next

              if (gateway !~ /^[A-Za-z0-9_.-]+$/)
                  next

              print gateway
          }
        ' "{{ candidates_dir }}/{{ item.item }}_PR_candidates.csv" |
        sort -u
      args:
        executable: /bin/bash
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: gateway_extract_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 9. Build complete unique gateway list
    # ============================================================

    - name: Initialize gateway list
      ansible.builtin.set_fact:
        gateway_names: []

    - name: Add extracted gateways
      ansible.builtin.set_fact:
        gateway_names: >-
          {{
            gateway_names
            +
            (
              item.stdout_lines
              | default([])
              | map('trim')
              | reject('equalto', '')
              | list
            )
          }}
      loop: "{{ gateway_extract_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
      loop_control:
        label: "{{ item.item.item | default('CMA') }}"

    - name: Remove duplicate gateway names
      ansible.builtin.set_fact:
        gateway_names: "{{ gateway_names | unique | list }}"

    - name: Stop if no gateways were discovered
      ansible.builtin.fail:
        msg: |
          ERROR: No gateway names were found.

          CMAs:
          {{ selected_cma_names | join(', ') }}

          Candidate directory:
          {{ candidates_dir }}
      when: gateway_names | length == 0


    # ============================================================
    # 10. Show discovered gateways
    # ============================================================

    - name: Show discovered gateways
      ansible.builtin.debug:
        msg:
          - "Gateways discovered: {{ gateway_names | length }}"
          - "Gateways: {{ gateway_names | join(', ') }}"


    # ============================================================
    # 11. Check gateway log files
    # ============================================================

    - name: Check gateway pre-requisite log files
      ansible.builtin.stat:
        path: "{{ gateway_logs_dir }}/{{ item }}_pre_requisite_check.log"
      loop: "{{ gateway_names }}"
      register: gateway_log_stats
      loop_control:
        label: "{{ item }}"


    # ============================================================
    # 12. Report missing gateway logs
    # ============================================================

    - name: Report missing gateway log
      ansible.builtin.debug:
        msg: >-
          WARNING: Pre-requisite log for {{ item.item }} was not found:
          {{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 13. Extract PRE-REQUISITE CHECK SUMMARY
    #
    # IMPORTANT:
    #
    # stdout_lines is used later instead of stdout.
    #
    # This prevents AWX from displaying:
    #
    # \nScript Version...\nHostname...
    #
    # Each log line remains an individual list element.
    # ============================================================

    - name: Extract PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.shell: |
        awk '
          BEGIN {
              in_summary = 0
              summary_complete = 0
              separator = ""
          }

          /^[=]+[[:space:]]*$/ {
              if (!in_summary) {
                  separator = $0
                  next
              }
          }

          /PRE-REQUISITE CHECK SUMMARY/ {
              if (separator != "")
                  print separator

              print
              in_summary = 1
              next
          }

          in_summary {
              print

              if ($0 ~ /^[[:space:]]*OVERALL STATUS[[:space:]]*:/) {
                  summary_complete = 1

                  if ((getline final_separator) > 0) {
                      if (final_separator ~ /^[=]+[[:space:]]*$/)
                          print final_separator
                  }

                  exit
              }
          }

          END {
              if (!in_summary)
                  exit 2

              if (!summary_complete)
                  exit 3
          }
        ' "{{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log"
      args:
        executable: /bin/bash
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: prereq_summary_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 14. Report invalid log format
    # ============================================================

    - name: Report log without PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: >-
          WARNING: PRE-REQUISITE CHECK SUMMARY was not found for
          {{ item.item.item }}.
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 2
      loop_control:
        label: "{{ item.item.item | default('Gateway') }}"


    - name: Report incomplete PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: >-
          WARNING: PRE-REQUISITE CHECK SUMMARY for
          {{ item.item.item }} does not contain OVERALL STATUS.
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 3
      loop_control:
        label: "{{ item.item.item | default('Gateway') }}"


    # ============================================================
    # 15. Display summary line-by-line
    #
    # IMPORTANT CHANGE
    #
    # Do NOT use:
    #
    # msg: |
    #   {{ item.stdout }}
    #
    # AWX converts newlines to \n.
    #
    # Instead loop over stdout_lines so every original log line
    # is displayed separately.
    # ============================================================

    - name: Display PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: "{{ summary_line }}"
      loop: >-
        {{
          prereq_summary_results.results
          | default([])
          | selectattr('rc', 'defined')
          | selectattr('rc', 'equalto', 0)
          | list
        }}
      loop_control:
        loop_var: gateway_result
        label: "{{ gateway_result.item.item | default('Gateway') }}"
      vars:
        gateway_name: "{{ gateway_result.item.item }}"
      when:
        - gateway_result.stdout_lines is defined


    # ============================================================
    # 16. Print summaries using one line per AWX output line
    #
    # include_tasks would normally be needed for nested looping.
    #
    # Instead, use debug var with stdout_lines.
    # AWX displays this much more cleanly than a multiline msg.
    # ============================================================

    - name: Show formatted summary lines
      ansible.builtin.debug:
        var: gateway_result.stdout_lines
      loop: >-
        {{
          prereq_summary_results.results
          | default([])
          | selectattr('rc', 'defined')
          | selectattr('rc', 'equalto', 0)
          | list
        }}
      loop_control:
        loop_var: gateway_result
        label: "{{ gateway_result.item.item | default('Gateway') }}"


    # ============================================================
    # 17. Show final status
    # ============================================================

    - name: Count complete summaries
      ansible.builtin.set_fact:
        complete_summary_count: >-
          {{
            prereq_summary_results.results
            | default([])
            | selectattr('rc', 'defined')
            | selectattr('rc', 'equalto', 0)
            | list
            | length
          }}

    - name: Display collection result
      ansible.builtin.debug:
        msg:
          - "Job ID: {{ deployment_job_id }}"
          - "CMAs processed: {{ selected_cma_names | length }}"
          - "Gateways discovered: {{ gateway_names | length }}"
          - "Complete summaries: {{ complete_summary_count }}"
