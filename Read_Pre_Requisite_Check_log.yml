---
- name: Display CDT Gateway Pre-Requisite Check Summaries
  hosts: all
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    gateway_logs_dir: "/var/log/CDT_Project/Gateway_Logs"

  tasks:

    # ============================================================
    # 1. Validate job_id from AWX Workflow survey
    # ============================================================

    - name: Validate job_id
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          ERROR: The AWX Workflow survey variable "job_id"
          is missing or invalid.

          Example:
          CHG0012345

          Allowed characters:
          Letters, numbers, underscore, hyphen and period.

    - name: Normalize job_id
      ansible.builtin.set_fact:
        deployment_job_id: "{{ job_id | string | trim }}"

    - name: Define selected targets file
      ansible.builtin.set_fact:
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ deployment_job_id }}/selected_targets.yml


    # ============================================================
    # 2. Validate selected_targets.yml
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop if selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          ERROR: selected_targets.yml was not found.

          Job ID:
          {{ deployment_job_id }}

          Expected file:
          {{ selected_targets_file }}
      when: not selected_targets_stat.stat.exists

    - name: Stop if selected_targets.yml is not a regular file
      ansible.builtin.fail:
        msg: |
          ERROR: The selected target path is not a regular file.

          Path:
          {{ selected_targets_file }}
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.isreg

    - name: Stop if selected_targets.yml is not readable
      ansible.builtin.fail:
        msg: |
          ERROR: The AWX SSH account cannot read:

          {{ selected_targets_file }}

          This playbook does not use sudo.
          Check the file and parent-directory permissions.
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.readable


    # ============================================================
    # 3. Read and parse selected_targets.yml
    # ============================================================

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected_targets.yml structure
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas is iterable
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          ERROR: No selected_cmas list was found in:

          {{ selected_targets_file }}

          Expected structure:

          selected_cmas:
            - cma_name: CMA2_SMS1
              cma_ip: 172.20.50.41
              targets:
                - name: CXL103
                  type: Cluster


    # ============================================================
    # 4. Build selected CMA list
    # ============================================================

    - name: Initialize selected CMA list
      ansible.builtin.set_fact:
        selected_cma_names: []

    - name: Add selected CMA names
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_cma_names
            +
            [item.cma_name | string | trim]
          }}
      loop: "{{ selected_targets_data.selected_cmas }}"
      when:
        - item.cma_name is defined
        - item.cma_name | string | trim | length > 0
      loop_control:
        label: "{{ item.cma_name | default('Missing CMA name') }}"

    - name: Remove duplicate CMA names
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_cma_names
            | unique
            | list
          }}

    - name: Validate selected CMA list
      ansible.builtin.assert:
        that:
          - selected_cma_names | length > 0
        fail_msg: |
          ERROR: No valid CMA names were found in:

          {{ selected_targets_file }}

    - name: Validate CMA name characters
      ansible.builtin.assert:
        that:
          - item is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          ERROR: Invalid CMA name:

          {{ item }}

          Allowed characters:
          Letters, numbers, underscore, hyphen and period.
      loop: "{{ selected_cma_names }}"
      loop_control:
        label: "{{ item }}"


    # ============================================================
    # 5. Check candidate CSV files
    # ============================================================

    - name: Check CMA candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item }}_PR_candidates.csv"
      loop: "{{ selected_cma_names }}"
      register: candidate_csv_stats
      loop_control:
        label: "{{ item }}"

    - name: Report missing candidate CSV
      ansible.builtin.debug:
        msg:
          warning: "Candidate CSV was not found"
          cma_name: "{{ item.item }}"
          expected_file: >-
            {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Report unreadable candidate CSV
      ansible.builtin.debug:
        msg:
          warning: "Candidate CSV exists but is not readable"
          cma_name: "{{ item.item }}"
          candidate_file: >-
            {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 6. Read CMA, gateway and cluster association
    #
    # Candidate CSV:
    #
    # Gateway Name, Cluster Name, IP Address, ...
    # GW101, CXL103, 172.20.50.101, ...
    # GW102, CXL103, 172.20.50.102, ...
    #
    # Internal output:
    #
    # CMA2_SMS1|GW101|CXL103
    # CMA2_SMS1|GW102|CXL103
    # CMA3_SMS1|R8120GW202|
    # ============================================================

    - name: Extract gateway and cluster information
      ansible.builtin.shell: |
        awk -F',' -v cma="{{ item.item }}" '
          {
              gateway = $1
              cluster = $2

              gsub(/^[[:space:]]+/, "", gateway)
              gsub(/[[:space:]]+$/, "", gateway)
              gsub(/\r$/, "", gateway)

              gsub(/^[[:space:]]+/, "", cluster)
              gsub(/[[:space:]]+$/, "", cluster)
              gsub(/\r$/, "", cluster)

              if (gateway == "") {
                  next
              }

              if (gateway == "Gateway Name") {
                  next
              }

              if (gateway == "Central Deployment Tool Candidates List:") {
                  next
              }

              if (gateway ~ /^[*#=+-]+$/) {
                  next
              }

              if (gateway !~ /^[A-Za-z0-9_.-]+$/) {
                  next
              }

              if (cluster !~ /^[A-Za-z0-9_.-]*$/) {
                  cluster = ""
              }

              print cma "|" gateway "|" cluster
          }
        ' "{{ candidates_dir }}/{{ item.item }}_PR_candidates.csv"
      args:
        executable: /bin/bash
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: gateway_mapping_raw
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 7. Build structured gateway target list
    # ============================================================

    - name: Initialize gateway target list
      ansible.builtin.set_fact:
        gateway_targets: []

    - name: Build gateway target list
      ansible.builtin.set_fact:
        gateway_targets: >-
          {{
            gateway_targets
            +
            [
              {
                'cma_name':
                  (item.1.split('|')[0] | trim),

                'gateway_name':
                  (item.1.split('|')[1] | trim),

                'cluster_name':
                  (
                    item.1.split('|')[2] | trim
                    if item.1.split('|') | length > 2
                    else ''
                  )
              }
            ]
          }}
      with_subelements:
        - "{{ gateway_mapping_raw.results | default([]) }}"
        - stdout_lines
        - skip_missing: true
      when:
        - item.1 is defined
        - item.1 | trim | length > 0
        - item.1.split('|') | length >= 2
      loop_control:
        label: "{{ item.1 }}"

    - name: Stop if no gateways were discovered
      ansible.builtin.fail:
        msg: |
          ERROR: No gateway entries were found in the
          candidate CSV files.

          CMAs checked:
          {{ selected_cma_names | join(', ') }}

          Candidate directory:
          {{ candidates_dir }}
      when: gateway_targets | length == 0


    # ============================================================
    # 8. Check gateway prerequisite log files
    # ============================================================

    - name: Check gateway pre-requisite logs
      ansible.builtin.stat:
        path: >-
          {{ gateway_logs_dir }}/{{ item.gateway_name }}_pre_requisite_check.log
      loop: "{{ gateway_targets }}"
      register: gateway_log_stats
      loop_control:
        label: "{{ item.gateway_name }}"

    - name: Report missing gateway log
      ansible.builtin.debug:
        msg:
          warning: "Pre-requisite check log was not found"
          cma_name: "{{ item.item.cma_name }}"
          cluster_name: >-
            {{
              item.item.cluster_name
              if item.item.cluster_name | length > 0
              else 'N/A'
            }}
          gateway_name: "{{ item.item.gateway_name }}"
          expected_file: >-
            {{ gateway_logs_dir }}/{{ item.item.gateway_name }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item.gateway_name }}"

    - name: Report unreadable gateway log
      ansible.builtin.debug:
        msg:
          warning: "Pre-requisite check log is not readable"
          cma_name: "{{ item.item.cma_name }}"
          cluster_name: >-
            {{
              item.item.cluster_name
              if item.item.cluster_name | length > 0
              else 'N/A'
            }}
          gateway_name: "{{ item.item.gateway_name }}"
          log_file: >-
            {{ gateway_logs_dir }}/{{ item.item.gateway_name }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item.gateway_name }}"


    # ============================================================
    # 9. Parse the complete summary into smaller logical sections
    #
    # The Python code:
    #
    # - Finds PRE-REQUISITE CHECK SUMMARY.
    # - Reads through OVERALL STATUS.
    # - Preserves all lines.
    # - Adds CMA, cluster and gateway information.
    # - Separates the report into smaller AWX-visible sections.
    #
    # Return codes:
    #
    # 0 = complete report
    # 2 = summary heading not found
    # 3 = OVERALL STATUS not found
    # ============================================================

    - name: Parse complete PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.shell: |
        /usr/bin/python3 - \
          "{{ gateway_logs_dir }}/{{ item.item.gateway_name }}_pre_requisite_check.log" \
          "{{ item.item.cma_name }}" \
          "{{ item.item.cluster_name | default('') }}" \
          "{{ item.item.gateway_name }}" <<'PYTHON'
        import json
        import re
        import sys

        log_file = sys.argv[1]
        cma_name = sys.argv[2].strip()
        cluster_name = sys.argv[3].strip() or "N/A"
        gateway_name = sys.argv[4].strip()

        with open(log_file, "r", encoding="utf-8", errors="replace") as handle:
            raw_lines = [line.rstrip("\r\n") for line in handle]

        start_index = None
        end_index = None

        for index, line in enumerate(raw_lines):
            if "PRE-REQUISITE CHECK SUMMARY" in line:
                start_index = index
                break

        if start_index is None:
            sys.exit(2)

        for index in range(start_index, len(raw_lines)):
            if re.match(
                r"^\s*OVERALL STATUS\s*:",
                raw_lines[index],
                flags=re.IGNORECASE
            ):
                end_index = index
                break

        if end_index is None:
            sys.exit(3)

        summary_lines = raw_lines[start_index + 1:end_index + 1]

        while summary_lines and (
            not summary_lines[0].strip()
            or re.match(r"^=+\s*$", summary_lines[0])
        ):
            summary_lines.pop(0)

        sections = {
            "report_information": [],
            "cpu_check": [],
            "disk_space_check": [],
            "snapshot_check": [],
            "cluster_check": [],
            "final_result": []
        }

        current_section = "report_information"

        for line in summary_lines:
            stripped = line.strip()

            if stripped.startswith("CPU Average"):
                current_section = "cpu_check"

            elif stripped.startswith("/var/log Free"):
                current_section = "disk_space_check"

            elif stripped.startswith("Snapshot Space Required"):
                current_section = "snapshot_check"

            elif stripped.startswith("Cluster Local State"):
                current_section = "cluster_check"

            elif (
                stripped.startswith("PASS Count")
                or stripped.startswith("FAIL Count")
                or stripped.startswith("OVERALL STATUS")
                or re.match(r"^-+\s*$", stripped)
            ):
                current_section = "final_result"

            sections[current_section].append(line)

        def trim_blank_lines(lines):
            lines = list(lines)

            while lines and not lines[0].strip():
                lines.pop(0)

            while lines and not lines[-1].strip():
                lines.pop()

            return lines

        for section_name in sections:
            sections[section_name] = trim_blank_lines(
                sections[section_name]
            )

        report = {
            "target": {
                "cma_name": cma_name,
                "cluster_name": cluster_name,
                "gateway_name": gateway_name
            },

            "heading": [
                "============================================================",
                " PRE-REQUISITE CHECK SUMMARY",
                "============================================================"
            ],

            "target_information": [
                f"{'CMA Name':27s} : {cma_name}",
                f"{'Cluster Name':27s} : {cluster_name}",
                f"{'Gateway Name':27s} : {gateway_name}"
            ],

            "report_information": sections["report_information"],
            "cpu_check": sections["cpu_check"],
            "disk_space_check": sections["disk_space_check"],
            "snapshot_check": sections["snapshot_check"],
            "cluster_check": sections["cluster_check"],
            "final_result": sections["final_result"],

            "closing_separator":
                "============================================================"
        }

        print(json.dumps(report, ensure_ascii=False))
        PYTHON
      args:
        executable: /bin/bash
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: parsed_summary_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item.gateway_name }}"


    # ============================================================
    # 10. Report parsing failures
    # ============================================================

    - name: Report missing PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg:
          warning: "PRE-REQUISITE CHECK SUMMARY was not found"
          cma_name: "{{ item.item.item.cma_name }}"
          cluster_name: >-
            {{
              item.item.item.cluster_name
              if item.item.item.cluster_name | length > 0
              else 'N/A'
            }}
          gateway_name: "{{ item.item.item.gateway_name }}"
          log_file: >-
            {{ gateway_logs_dir }}/{{ item.item.item.gateway_name }}_pre_requisite_check.log
      loop: "{{ parsed_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 2
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"

    - name: Report incomplete PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg:
          warning: "PRE-REQUISITE CHECK SUMMARY is incomplete"
          reason: "OVERALL STATUS was not found"
          cma_name: "{{ item.item.item.cma_name }}"
          cluster_name: >-
            {{
              item.item.item.cluster_name
              if item.item.item.cluster_name | length > 0
              else 'N/A'
            }}
          gateway_name: "{{ item.item.item.gateway_name }}"
          log_file: >-
            {{ gateway_logs_dir }}/{{ item.item.item.gateway_name }}_pre_requisite_check.log
      loop: "{{ parsed_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 3
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"


    # ============================================================
    # 11. Build parsed report objects
    #
    # Converts each shell JSON result into an Ansible dictionary.
    # ============================================================

    - name: Initialize parsed report list
      ansible.builtin.set_fact:
        parsed_reports: []

    - name: Build parsed report list
      ansible.builtin.set_fact:
        parsed_reports: >-
          {{
            parsed_reports
            +
            [
              {
                'gateway_name':
                  item.item.item.gateway_name,

                'report':
                  (item.stdout | from_json)
              }
            ]
          }}
      loop: "{{ parsed_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
        - item.stdout is defined
        - item.stdout | trim | length > 0
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"


    # ============================================================
    # 12. Display one complete structured report per gateway
    #
    # Important:
    #
    # The report is separated into smaller sections.
    #
    # This prevents the large single "summary" list from being
    # visually cut off after End Timestamp in the AWX output.
    # ============================================================

    - name: Display PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg:
          target: "{{ report_item.report.target }}"

          heading: "{{ report_item.report.heading }}"

          target_information: >-
            {{ report_item.report.target_information }}

          report_information: >-
            {{ report_item.report.report_information }}

          cpu_check: >-
            {{ report_item.report.cpu_check }}

          disk_space_check: >-
            {{ report_item.report.disk_space_check }}

          snapshot_check: >-
            {{ report_item.report.snapshot_check }}

          cluster_check: >-
            {{ report_item.report.cluster_check }}

          final_result: >-
            {{ report_item.report.final_result }}

          closing_separator: >-
            {{ report_item.report.closing_separator }}
      loop: "{{ parsed_reports }}"
      loop_control:
        loop_var: report_item
        label: "{{ report_item.gateway_name }}"


    # ============================================================
    # 13. Calculate result counters
    # ============================================================

    - name: Initialize result counters
      ansible.builtin.set_fact:
        complete_summary_count: 0
        missing_summary_count: 0
        incomplete_summary_count: 0
        missing_log_count: 0
        unreadable_log_count: 0

    - name: Count complete summaries
      ansible.builtin.set_fact:
        complete_summary_count: >-
          {{ complete_summary_count | int + 1 }}
      loop: "{{ parsed_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"

    - name: Count missing summary sections
      ansible.builtin.set_fact:
        missing_summary_count: >-
          {{ missing_summary_count | int + 1 }}
      loop: "{{ parsed_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 2
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"

    - name: Count incomplete summaries
      ansible.builtin.set_fact:
        incomplete_summary_count: >-
          {{ incomplete_summary_count | int + 1 }}
      loop: "{{ parsed_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 3
      loop_control:
        label: "{{ item.item.item.gateway_name | default('Gateway') }}"

    - name: Count missing gateway logs
      ansible.builtin.set_fact:
        missing_log_count: >-
          {{ missing_log_count | int + 1 }}
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item.gateway_name }}"

    - name: Count unreadable gateway logs
      ansible.builtin.set_fact:
        unreadable_log_count: >-
          {{ unreadable_log_count | int + 1 }}
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item.gateway_name }}"


    # ============================================================
    # 14. Final result
    # ============================================================

    - name: Display collection result
      ansible.builtin.debug:
        msg:
          job_id: "{{ deployment_job_id }}"
          cmas_processed: "{{ selected_cma_names | length }}"
          gateways_discovered: "{{ gateway_targets | length }}"
          complete_summaries: "{{ complete_summary_count }}"
          missing_gateway_logs: "{{ missing_log_count }}"
          unreadable_gateway_logs: "{{ unreadable_log_count }}"
          missing_summary_sections: "{{ missing_summary_count }}"
          incomplete_summary_sections: "{{ incomplete_summary_count }}"
