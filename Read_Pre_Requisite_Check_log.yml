---
- name: Display CDT Gateway Pre-Requisite Check Summaries
  hosts: all
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    gateway_logs_dir: "/var/log/CDT_Project/Gateway_Logs"

  tasks:

    # ============================================================
    # 1. Validate job_id received from the AWX Workflow survey
    # ============================================================

    - name: Validate job_id
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          The AWX Workflow survey variable "job_id" is missing or invalid.

          Example:
          CHG0012345

          Allowed characters:
          Letters, numbers, underscore, hyphen and period.

    - name: Normalize job_id
      ansible.builtin.set_fact:
        deployment_job_id: "{{ job_id | string | trim }}"

    - name: Define selected targets file
      ansible.builtin.set_fact:
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ deployment_job_id }}/selected_targets.yml

    - name: Display input information
      ansible.builtin.debug:
        msg: |
          ============================================================
          CDT PRE-REQUISITE CHECK LOG READER
          ============================================================
          Job ID              : {{ deployment_job_id }}
          Selected targets    : {{ selected_targets_file }}
          Candidate directory : {{ candidates_dir }}
          Gateway log folder  : {{ gateway_logs_dir }}
          ============================================================


    # ============================================================
    # 2. Check selected_targets.yml
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop when selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          selected_targets.yml was not found.

          Job ID:
          {{ deployment_job_id }}

          Expected file:
          {{ selected_targets_file }}

          Verify that the previous AWX Workflow node created this file
          using the same job_id.
      when: not selected_targets_stat.stat.exists

    - name: Stop when selected_targets.yml is not a regular file
      ansible.builtin.fail:
        msg: |
          The selected targets path exists, but it is not a regular file:

          {{ selected_targets_file }}
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.isreg

    - name: Stop when selected_targets.yml is not readable
      ansible.builtin.fail:
        msg: |
          The AWX SSH account cannot read:

          {{ selected_targets_file }}

          This playbook does not use sudo. Check the permissions of:
          {{ filters_base_dir }}/{{ deployment_job_id }}
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.readable


    # ============================================================
    # 3. Read and parse selected_targets.yml
    # ============================================================

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected_targets.yml structure
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas is iterable
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          No selected_cmas list was found in:

          {{ selected_targets_file }}

          Expected format:

          selected_cmas:
            - cma_name: CMA2_SMS1
              cma_ip: 172.20.50.41
              targets:
                - name: CXL103
                  type: Cluster


    # ============================================================
    # 4. Build the CMA name list
    # ============================================================

    - name: Initialize CMA name list
      ansible.builtin.set_fact:
        selected_cma_names: []

    - name: Add CMA names
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_cma_names
            +
            [item.cma_name | string | trim]
          }}
      loop: "{{ selected_targets_data.selected_cmas }}"
      when:
        - item.cma_name is defined
        - item.cma_name | string | trim | length > 0
      loop_control:
        label: "{{ item.cma_name | default('Missing CMA name') }}"

    - name: Remove duplicate CMA names
      ansible.builtin.set_fact:
        selected_cma_names: "{{ selected_cma_names | unique | list }}"

    - name: Validate that CMA names were found
      ansible.builtin.assert:
        that:
          - selected_cma_names | length > 0
        fail_msg: |
          No valid cma_name entries were found in:

          {{ selected_targets_file }}

    - name: Validate CMA name characters
      ansible.builtin.assert:
        that:
          - item is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          Invalid CMA name found:

          {{ item }}

          Allowed characters:
          Letters, numbers, underscore, hyphen and period.
      loop: "{{ selected_cma_names }}"
      loop_control:
        label: "{{ item }}"

    - name: Display selected CMAs
      ansible.builtin.debug:
        msg: |
          ============================================================
          SELECTED CMAs
          ============================================================
          {% for cma_name in selected_cma_names %}
          {{ cma_name }}
          {% endfor %}
          ============================================================


    # ============================================================
    # 5. Check each CMA candidate CSV
    # ============================================================

    - name: Check candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item }}_PR_candidates.csv"
      loop: "{{ selected_cma_names }}"
      register: candidate_csv_stats
      loop_control:
        label: "{{ item }}"

    - name: Report missing candidate CSV
      ansible.builtin.debug:
        msg: |
          WARNING: Candidate CSV was not found.

          CMA:
          {{ item.item }}

          Expected file:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Report unreadable candidate CSV
      ansible.builtin.debug:
        msg: |
          WARNING: Candidate CSV exists but is not readable.

          CMA:
          {{ item.item }}

          File:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 6. Extract gateway names from each readable CSV
    #
    # Example candidate row:
    #
    # GW101 , CXL103 , 172.20.50.101 , R81.20/170 , active , 1
    #
    # The first CSV field is used as the gateway name.
    # ============================================================

    - name: Extract gateway names from candidate CSV files
      ansible.builtin.shell: |
        awk -F',' '
          {
              gateway = $1

              gsub(/^[[:space:]]+/, "", gateway)
              gsub(/[[:space:]]+$/, "", gateway)

              if (gateway == "") {
                  next
              }

              if (gateway == "Gateway Name") {
                  next
              }

              if (gateway == "Central Deployment Tool Candidates List:") {
                  next
              }

              if (gateway ~ /^[*#=+-]+$/) {
                  next
              }

              if (gateway !~ /^[A-Za-z0-9_.-]+$/) {
                  next
              }

              print gateway
          }
        ' "{{ candidates_dir }}/{{ item.item }}_PR_candidates.csv" | sort -u
      args:
        executable: /bin/bash
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: gateway_extract_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 7. Build the CMA-to-gateway mapping
    # ============================================================

    - name: Initialize CMA gateway mapping
      ansible.builtin.set_fact:
        cma_gateway_map: []

    - name: Add extracted gateways to CMA mapping
      ansible.builtin.set_fact:
        cma_gateway_map: >-
          {{
            cma_gateway_map
            +
            [
              {
                'cma_name': item.item.item,
                'candidate_file':
                  candidates_dir
                  ~ '/'
                  ~ item.item.item
                  ~ '_PR_candidates.csv',
                'gateways':
                  (
                    item.stdout_lines
                    | default([])
                    | map('trim')
                    | reject('equalto', '')
                    | unique
                    | list
                  )
              }
            ]
          }}
      loop: "{{ gateway_extract_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
      loop_control:
        label: "{{ item.item.item | default('Unknown CMA') }}"

    - name: Report candidate CSV without gateways
      ansible.builtin.debug:
        msg: |
          WARNING: No gateway names were found in this candidate CSV.

          CMA:
          {{ item.cma_name }}

          Candidate file:
          {{ item.candidate_file }}
      loop: "{{ cma_gateway_map }}"
      when: item.gateways | length == 0
      loop_control:
        label: "{{ item.cma_name }}"


    # ============================================================
    # 8. Build one unique gateway list
    # ============================================================

    - name: Initialize gateway list
      ansible.builtin.set_fact:
        gateway_names: []

    - name: Add gateways to the gateway list
      ansible.builtin.set_fact:
        gateway_names: >-
          {{
            (
              gateway_names
              +
              item.gateways
            )
            | unique
            | list
          }}
      loop: "{{ cma_gateway_map }}"
      when: item.gateways | length > 0
      loop_control:
        label: "{{ item.cma_name }}"

    - name: Stop when no gateway names were discovered
      ansible.builtin.fail:
        msg: |
          No gateway names were found in the readable candidate CSV files.

          CMAs checked:
          {{ selected_cma_names | join(', ') }}

          Candidate directory:
          {{ candidates_dir }}

          Expected filename format:
          <cma_name>_PR_candidates.csv
      when: gateway_names | length == 0

    - name: Display CMA and gateway mapping
      ansible.builtin.debug:
        msg: |
          ============================================================
          CMA AND GATEWAY MAPPING
          ============================================================
          {% for mapping in cma_gateway_map %}
          CMA            : {{ mapping.cma_name }}
          Candidate file : {{ mapping.candidate_file }}
          Gateways       : {{ mapping.gateways | join(', ') if mapping.gateways | length > 0 else 'None found' }}

          {% endfor %}
          Total unique gateways: {{ gateway_names | length }}
          ============================================================


    # ============================================================
    # 9. Check the gateway pre-requisite log files
    # ============================================================

    - name: Check gateway pre-requisite log files
      ansible.builtin.stat:
        path: "{{ gateway_logs_dir }}/{{ item }}_pre_requisite_check.log"
      loop: "{{ gateway_names }}"
      register: gateway_log_stats
      loop_control:
        label: "{{ item }}"

    - name: Report missing gateway log
      ansible.builtin.debug:
        msg: |
          WARNING: Gateway pre-requisite check log was not found.

          Gateway:
          {{ item.item }}

          Expected file:
          {{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Report unreadable gateway log
      ansible.builtin.debug:
        msg: |
          WARNING: Gateway pre-requisite check log is not readable.

          Gateway:
          {{ item.item }}

          Log file:
          {{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 10. Extract only PRE-REQUISITE CHECK SUMMARY
    #
    # Return codes:
    # 0 = complete summary found
    # 2 = summary heading not found
    # 3 = OVERALL STATUS line not found
    # ============================================================

    - name: Extract PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.shell: |
        awk '
          /^[=]+[[:space:]]*$/ && !in_summary {
              previous_separator = $0
              next
          }

          /PRE-REQUISITE CHECK SUMMARY/ {
              if (previous_separator != "") {
                  print previous_separator
              }

              print
              in_summary = 1
              next
          }

          in_summary {
              print

              if ($0 ~ /^[[:space:]]*OVERALL STATUS[[:space:]]*:/) {
                  summary_complete = 1

                  if ((getline final_separator) > 0) {
                      if (final_separator ~ /^[=]+[[:space:]]*$/) {
                          print final_separator
                      }
                  }

                  exit
              }
          }

          END {
              if (!in_summary) {
                  exit 2
              }

              if (!summary_complete) {
                  exit 3
              }
          }
        ' "{{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log"
      args:
        executable: /bin/bash
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: prereq_summary_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 11. Report invalid or incomplete log summaries
    # ============================================================

    - name: Report missing PRE-REQUISITE CHECK SUMMARY section
      ansible.builtin.debug:
        msg: |
          WARNING: PRE-REQUISITE CHECK SUMMARY was not found.

          Gateway:
          {{ item.item.item }}

          Log file:
          {{ gateway_logs_dir }}/{{ item.item.item }}_pre_requisite_check.log
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 2
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"

    - name: Report incomplete PRE-REQUISITE CHECK SUMMARY section
      ansible.builtin.debug:
        msg: |
          WARNING: An incomplete PRE-REQUISITE CHECK SUMMARY was found.

          The PRE-REQUISITE CHECK SUMMARY heading exists, but an
          OVERALL STATUS line was not found.

          Gateway:
          {{ item.item.item }}

          Log file:
          {{ gateway_logs_dir }}/{{ item.item.item }}_pre_requisite_check.log
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 3
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"


    # ============================================================
    # 12. Display only complete summaries
    # ============================================================

    - name: Display PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: |
          {{ item.stdout }}
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
        - item.stdout is defined
        - item.stdout | trim | length > 0
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"


    # ============================================================
    # 13. Calculate and display collection statistics
    # ============================================================

    - name: Initialize result counters
      ansible.builtin.set_fact:
        complete_summary_count: 0
        missing_log_count: 0
        unreadable_log_count: 0

    - name: Count complete summaries
      ansible.builtin.set_fact:
        complete_summary_count: "{{ complete_summary_count | int + 1 }}"
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"

    - name: Count missing logs
      ansible.builtin.set_fact:
        missing_log_count: "{{ missing_log_count | int + 1 }}"
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Count unreadable logs
      ansible.builtin.set_fact:
        unreadable_log_count: "{{ unreadable_log_count | int + 1 }}"
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"

    - name: Display final result
      ansible.builtin.debug:
        msg: |
          ============================================================
          PRE-REQUISITE SUMMARY COLLECTION RESULT
          ============================================================
          Job ID                     : {{ deployment_job_id }}
          CMAs processed             : {{ selected_cma_names | length }}
          Unique gateways discovered : {{ gateway_names | length }}
          Complete summaries shown   : {{ complete_summary_count }}
          Missing gateway logs       : {{ missing_log_count }}
          Unreadable gateway logs    : {{ unreadable_log_count }}
          ============================================================
