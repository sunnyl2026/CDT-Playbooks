---
- name: Display CDT Gateway Pre-Requisite Check Summaries
  hosts: all
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    filters_base_dir: "/var/log/CDT_Project/Filters"
    candidates_dir: "/var/log/CDT_Project/candidates"
    gateway_logs_dir: "/var/log/CDT_Project/Gateway_Logs"

  tasks:

    # ============================================================
    # 1. Validate job_id from AWX Workflow survey
    # ============================================================

    - name: Validate job_id
      ansible.builtin.assert:
        that:
          - job_id is defined
          - job_id | string | trim | length > 0
          - job_id | string | trim is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          ERROR: The AWX Workflow survey variable "job_id"
          is missing or invalid.

          Example:
          CHG0012345

          Allowed characters:
          Letters, numbers, underscore, hyphen and period.

    - name: Normalize job_id
      ansible.builtin.set_fact:
        deployment_job_id: "{{ job_id | string | trim }}"

    - name: Define selected targets file
      ansible.builtin.set_fact:
        selected_targets_file: >-
          {{ filters_base_dir }}/{{ deployment_job_id }}/selected_targets.yml


    # ============================================================
    # 2. Check selected_targets.yml
    # ============================================================

    - name: Check selected_targets.yml
      ansible.builtin.stat:
        path: "{{ selected_targets_file }}"
      register: selected_targets_stat

    - name: Stop when selected_targets.yml does not exist
      ansible.builtin.fail:
        msg: |
          ERROR: selected_targets.yml was not found.

          Job ID:
          {{ deployment_job_id }}

          Expected file:
          {{ selected_targets_file }}

          Verify that the earlier Workflow node created this file
          using the same job_id.
      when: not selected_targets_stat.stat.exists

    - name: Stop when selected_targets.yml is not a regular file
      ansible.builtin.fail:
        msg: |
          ERROR: The selected targets path exists, but it is
          not a regular file.

          Path:
          {{ selected_targets_file }}
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.isreg

    - name: Stop when selected_targets.yml is not readable
      ansible.builtin.fail:
        msg: |
          ERROR: The AWX SSH account cannot read:

          {{ selected_targets_file }}

          This playbook does not use sudo. Check the permissions
          of the file and its parent directories.
      when:
        - selected_targets_stat.stat.exists
        - not selected_targets_stat.stat.readable


    # ============================================================
    # 3. Read and parse selected_targets.yml
    # ============================================================

    - name: Read selected_targets.yml
      ansible.builtin.slurp:
        src: "{{ selected_targets_file }}"
      register: selected_targets_raw

    - name: Parse selected_targets.yml
      ansible.builtin.set_fact:
        selected_targets_data: >-
          {{
            selected_targets_raw.content
            | b64decode
            | from_yaml
          }}

    - name: Validate selected_targets.yml structure
      ansible.builtin.assert:
        that:
          - selected_targets_data is mapping
          - selected_targets_data.selected_cmas is defined
          - selected_targets_data.selected_cmas is iterable
          - selected_targets_data.selected_cmas | length > 0
        fail_msg: |
          ERROR: No selected_cmas list was found in:

          {{ selected_targets_file }}

          Expected structure:

          selected_cmas:
            - cma_name: CMA2_SMS1
              cma_ip: 172.20.50.41
              targets:
                - name: CXL103
                  type: Cluster


    # ============================================================
    # 4. Build selected CMA list
    # ============================================================

    - name: Initialize selected CMA list
      ansible.builtin.set_fact:
        selected_cma_names: []

    - name: Add CMA names to selected CMA list
      ansible.builtin.set_fact:
        selected_cma_names: >-
          {{
            selected_cma_names
            +
            [item.cma_name | string | trim]
          }}
      loop: "{{ selected_targets_data.selected_cmas }}"
      when:
        - item.cma_name is defined
        - item.cma_name | string | trim | length > 0
      loop_control:
        label: "{{ item.cma_name | default('Missing CMA name') }}"

    - name: Remove duplicate CMA names
      ansible.builtin.set_fact:
        selected_cma_names: "{{ selected_cma_names | unique | list }}"

    - name: Verify at least one CMA was found
      ansible.builtin.assert:
        that:
          - selected_cma_names | length > 0
        fail_msg: |
          ERROR: No valid cma_name entries were found in:

          {{ selected_targets_file }}

    - name: Validate CMA name characters
      ansible.builtin.assert:
        that:
          - item is match('^[A-Za-z0-9_.-]+$')
        fail_msg: |
          ERROR: Invalid CMA name:

          {{ item }}

          Allowed characters:
          Letters, numbers, underscore, hyphen and period.
      loop: "{{ selected_cma_names }}"
      loop_control:
        label: "{{ item }}"

    - name: Display input information
      ansible.builtin.debug:
        msg:
          - "Job ID: {{ deployment_job_id }}"
          - "Selected CMAs: {{ selected_cma_names | join(', ') }}"
          - "Candidate directory: {{ candidates_dir }}"
          - "Gateway log directory: {{ gateway_logs_dir }}"


    # ============================================================
    # 5. Check candidate CSV files
    # ============================================================

    - name: Check CMA candidate CSV files
      ansible.builtin.stat:
        path: "{{ candidates_dir }}/{{ item }}_PR_candidates.csv"
      loop: "{{ selected_cma_names }}"
      register: candidate_csv_stats
      loop_control:
        label: "{{ item }}"

    - name: Report missing candidate CSV files
      ansible.builtin.debug:
        msg: |
          WARNING: Candidate CSV was not found.

          CMA:
          {{ item.item }}

          Expected file:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Report unreadable candidate CSV files
      ansible.builtin.debug:
        msg: |
          WARNING: Candidate CSV exists but is not readable.

          CMA:
          {{ item.item }}

          File:
          {{ candidates_dir }}/{{ item.item }}_PR_candidates.csv
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 6. Extract gateway names from candidate CSV files
    #
    # Example candidate data:
    #
    # Gateway Name, Cluster Name, IP Address, Version/JHF Take, ...
    # GW101, CXL103, 172.20.50.101, R81.20/170, active, 1
    # GW102, CXL103, 172.20.50.102, R81.20/170, standby, 1
    #
    # The first column is the gateway name.
    # ============================================================

    - name: Extract gateway names from candidate CSV files
      ansible.builtin.shell: |
        awk -F',' '
          {
              gateway = $1

              gsub(/^[[:space:]]+/, "", gateway)
              gsub(/[[:space:]]+$/, "", gateway)
              gsub(/\r$/, "", gateway)

              if (gateway == "") {
                  next
              }

              if (gateway == "Gateway Name") {
                  next
              }

              if (gateway == "Central Deployment Tool Candidates List:") {
                  next
              }

              if (gateway ~ /^[*#=+-]+$/) {
                  next
              }

              if (gateway !~ /^[A-Za-z0-9_.-]+$/) {
                  next
              }

              print gateway
          }
        ' "{{ candidates_dir }}/{{ item.item }}_PR_candidates.csv" |
        sort -u
      args:
        executable: /bin/bash
      loop: "{{ candidate_csv_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: gateway_extract_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 7. Build CMA-to-gateway mapping
    # ============================================================

    - name: Initialize CMA gateway mapping
      ansible.builtin.set_fact:
        cma_gateway_map: []

    - name: Add extracted gateways to CMA mapping
      ansible.builtin.set_fact:
        cma_gateway_map: >-
          {{
            cma_gateway_map
            +
            [
              {
                'cma_name': item.item.item,
                'candidate_file':
                  candidates_dir
                  ~ '/'
                  ~ item.item.item
                  ~ '_PR_candidates.csv',
                'gateways':
                  (
                    item.stdout_lines
                    | default([])
                    | map('trim')
                    | reject('equalto', '')
                    | unique
                    | list
                  )
              }
            ]
          }}
      loop: "{{ gateway_extract_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
      loop_control:
        label: "{{ item.item.item | default('Unknown CMA') }}"

    - name: Report candidate CSV without gateway entries
      ansible.builtin.debug:
        msg: |
          WARNING: No gateway names were found.

          CMA:
          {{ item.cma_name }}

          Candidate file:
          {{ item.candidate_file }}
      loop: "{{ cma_gateway_map }}"
      when: item.gateways | length == 0
      loop_control:
        label: "{{ item.cma_name }}"


    # ============================================================
    # 8. Build unique gateway list
    # ============================================================

    - name: Initialize gateway list
      ansible.builtin.set_fact:
        gateway_names: []

    - name: Add gateways to global gateway list
      ansible.builtin.set_fact:
        gateway_names: >-
          {{
            (
              gateway_names
              +
              item.gateways
            )
            | unique
            | list
          }}
      loop: "{{ cma_gateway_map }}"
      when: item.gateways | length > 0
      loop_control:
        label: "{{ item.cma_name }}"

    - name: Stop when no gateways were discovered
      ansible.builtin.fail:
        msg: |
          ERROR: No gateway names were found in any readable
          candidate CSV.

          CMAs checked:
          {{ selected_cma_names | join(', ') }}

          Candidate directory:
          {{ candidates_dir }}

          Expected filename:
          <cma_name>_PR_candidates.csv
      when: gateway_names | length == 0

    - name: Display CMA and gateway mapping
      ansible.builtin.debug:
        msg:
          - "CMA: {{ item.cma_name }}"
          - "Candidate file: {{ item.candidate_file }}"
          - >-
            Gateways:
            {{
              item.gateways | join(', ')
              if item.gateways | length > 0
              else 'None found'
            }}
      loop: "{{ cma_gateway_map }}"
      loop_control:
        label: "{{ item.cma_name }}"

    - name: Display unique gateway list
      ansible.builtin.debug:
        msg:
          - "Total gateways discovered: {{ gateway_names | length }}"
          - "Gateways: {{ gateway_names | join(', ') }}"


    # ============================================================
    # 9. Check gateway pre-requisite log files
    # ============================================================

    - name: Check gateway pre-requisite check log files
      ansible.builtin.stat:
        path: "{{ gateway_logs_dir }}/{{ item }}_pre_requisite_check.log"
      loop: "{{ gateway_names }}"
      register: gateway_log_stats
      loop_control:
        label: "{{ item }}"

    - name: Report missing gateway log files
      ansible.builtin.debug:
        msg: |
          WARNING: Gateway pre-requisite check log was not found.

          Gateway:
          {{ item.item }}

          Expected file:
          {{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Report unreadable gateway log files
      ansible.builtin.debug:
        msg: |
          WARNING: Gateway pre-requisite check log exists but
          is not readable.

          Gateway:
          {{ item.item }}

          Log file:
          {{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 10. Extract PRE-REQUISITE CHECK SUMMARY
    #
    # Return codes:
    #
    # 0 = Complete summary found
    # 2 = PRE-REQUISITE CHECK SUMMARY heading not found
    # 3 = OVERALL STATUS line not found
    # ============================================================

    - name: Extract PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.shell: |
        awk '
          BEGIN {
              in_summary = 0
              summary_complete = 0
              previous_separator = ""
          }

          /^[=]+[[:space:]]*$/ && !in_summary {
              previous_separator = $0
              next
          }

          /PRE-REQUISITE CHECK SUMMARY/ {
              if (previous_separator != "") {
                  print previous_separator
              }

              print
              in_summary = 1
              next
          }

          in_summary {
              print

              if ($0 ~ /^[[:space:]]*OVERALL STATUS[[:space:]]*:/) {
                  summary_complete = 1

                  if ((getline final_separator) > 0) {
                      if (final_separator ~ /^[=]+[[:space:]]*$/) {
                          print final_separator
                      }
                  }

                  exit
              }
          }

          END {
              if (!in_summary) {
                  exit 2
              }

              if (!summary_complete) {
                  exit 3
              }
          }
        ' "{{ gateway_logs_dir }}/{{ item.item }}_pre_requisite_check.log"
      args:
        executable: /bin/bash
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - item.stat.isreg
        - item.stat.readable
      register: prereq_summary_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 11. Report missing or incomplete summary sections
    # ============================================================

    - name: Report log without PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: |
          WARNING: PRE-REQUISITE CHECK SUMMARY was not found.

          Gateway:
          {{ item.item.item }}

          Log file:
          {{ gateway_logs_dir }}/{{ item.item.item }}_pre_requisite_check.log
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 2
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"

    - name: Report incomplete PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg: |
          WARNING: The PRE-REQUISITE CHECK SUMMARY is incomplete.

          The summary heading was found, but the OVERALL STATUS
          line was not found.

          Gateway:
          {{ item.item.item }}

          Log file:
          {{ gateway_logs_dir }}/{{ item.item.item }}_pre_requisite_check.log
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 3
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"


    # ============================================================
    # 12. Display complete PRE-REQUISITE CHECK SUMMARY results
    #
    # Important:
    #
    # This uses stdout_lines instead of stdout.
    #
    # It does not use the removed "summary_line" variable.
    # Therefore, there is no undefined-variable error.
    #
    # AWX will display the summary as a structured list of lines
    # instead of one string containing literal "\n".
    # ============================================================

    - name: Display PRE-REQUISITE CHECK SUMMARY
      ansible.builtin.debug:
        msg:
          gateway: "{{ gateway_result.item.item }}"
          summary: "{{ gateway_result.stdout_lines }}"
      loop: >-
        {{
          prereq_summary_results.results
          | default([])
          | selectattr('rc', 'defined')
          | selectattr('rc', 'equalto', 0)
          | list
        }}
      loop_control:
        loop_var: gateway_result
        label: "{{ gateway_result.item.item | default('Unknown gateway') }}"


    # ============================================================
    # 13. Calculate final counters
    # ============================================================

    - name: Initialize result counters
      ansible.builtin.set_fact:
        complete_summary_count: 0
        summary_not_found_count: 0
        incomplete_summary_count: 0
        missing_log_count: 0
        unreadable_log_count: 0

    - name: Count complete summaries
      ansible.builtin.set_fact:
        complete_summary_count: "{{ complete_summary_count | int + 1 }}"
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 0
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"

    - name: Count logs without summary section
      ansible.builtin.set_fact:
        summary_not_found_count: "{{ summary_not_found_count | int + 1 }}"
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 2
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"

    - name: Count incomplete summaries
      ansible.builtin.set_fact:
        incomplete_summary_count: "{{ incomplete_summary_count | int + 1 }}"
      loop: "{{ prereq_summary_results.results | default([]) }}"
      when:
        - item.skipped is not defined
        - item.rc is defined
        - item.rc == 3
      loop_control:
        label: "{{ item.item.item | default('Unknown gateway') }}"

    - name: Count missing gateway logs
      ansible.builtin.set_fact:
        missing_log_count: "{{ missing_log_count | int + 1 }}"
      loop: "{{ gateway_log_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Count unreadable gateway logs
      ansible.builtin.set_fact:
        unreadable_log_count: "{{ unreadable_log_count | int + 1 }}"
      loop: "{{ gateway_log_stats.results }}"
      when:
        - item.stat.exists
        - not item.stat.readable
      loop_control:
        label: "{{ item.item }}"


    # ============================================================
    # 14. Final result
    # ============================================================

    - name: Display final collection result
      ansible.builtin.debug:
        msg:
          - "Job ID: {{ deployment_job_id }}"
          - "CMAs processed: {{ selected_cma_names | length }}"
          - "Unique gateways discovered: {{ gateway_names | length }}"
          - "Complete summaries shown: {{ complete_summary_count }}"
          - "Summary sections not found: {{ summary_not_found_count }}"
          - "Incomplete summaries: {{ incomplete_summary_count }}"
          - "Missing gateway logs: {{ missing_log_count }}"
          - "Unreadable gateway logs: {{ unreadable_log_count }}"
