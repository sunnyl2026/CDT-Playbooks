---
- name: Generate MDS CMA inventory
  hosts: all
  gather_facts: false

  vars:
    inventory_dir: "/var/log/CDT_Project/Inventory"
    inventory_file: "/var/log/CDT_Project/Inventory/mds_inventory"

  tasks:

    # ---------------------------------------------------------
    # Run mdsstat
    # ---------------------------------------------------------

    - name: Run mdsstat
      ansible.builtin.shell: |
        source /etc/profile.d/CP.sh
        mdsstat
      args:
        executable: /bin/bash
      register: mdsstat_output
      changed_when: false

    - name: Display mdsstat output
      ansible.builtin.debug:
        var: mdsstat_output.stdout_lines


    # ---------------------------------------------------------
    # Extract CMA name and IP
    #
    # Expected final format:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1 172.20.50.41
    # ---------------------------------------------------------

    - name: Extract CMA name and IP from mdsstat
      ansible.builtin.shell: |
        source /etc/profile.d/CP.sh
        mdsstat | awk '
        /^[[:space:]]*\|/ {
            gsub(/^[[:space:]]*\|[[:space:]]*/, "", $0)
            gsub(/[[:space:]]*\|[[:space:]]*$/, "", $0)

            n = split($0, a, "|")

            for (i = 1; i <= n; i++) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", a[i])
            }

            if (a[1] ~ /^CMA/ && a[2] ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) {
                print a[1], a[2]
            }
        }'
      args:
        executable: /bin/bash
      register: cma_inventory
      changed_when: false


    # ---------------------------------------------------------
    # Verify that something was extracted
    # ---------------------------------------------------------

    - name: Fail if no CMA was found
      ansible.builtin.fail:
        msg: "No CMA information could be extracted from mdsstat."
      when: cma_inventory.stdout | trim == ""


    # ---------------------------------------------------------
    # Create parent directory ONLY
    # ---------------------------------------------------------

    - name: Ensure CDT Inventory directory exists
      ansible.builtin.file:
        path: "{{ inventory_dir }}"
        state: directory
        mode: "0755"


    # ---------------------------------------------------------
    # Handle old incorrect mds_inventory directory
    #
    # This is needed because the previous playbook created:
    #
    # /var/log/CDT_Project/Inventory/mds_inventory/
    #
    # We now want mds_inventory to be a FILE.
    # ---------------------------------------------------------

    - name: Check existing mds_inventory path
      ansible.builtin.stat:
        path: "{{ inventory_file }}"
      register: old_inventory_path

    - name: Remove old mds_inventory directory if it exists
      ansible.builtin.file:
        path: "{{ inventory_file }}"
        state: absent
      when:
        - old_inventory_path.stat.exists
        - old_inventory_path.stat.isdir | default(false)


    # ---------------------------------------------------------
    # Write inventory file to MDS
    # ---------------------------------------------------------

    - name: Write MDS inventory file
      ansible.builtin.copy:
        content: "{{ cma_inventory.stdout | trim }}\n"
        dest: "{{ inventory_file }}"
        mode: "0644"


    # ---------------------------------------------------------
    # Read back file for verification
    # ---------------------------------------------------------

    - name: Read generated MDS inventory
      ansible.builtin.command:
        cmd: "cat {{ inventory_file }}"
      register: generated_inventory
      changed_when: false


    - name: Display generated MDS inventory
      ansible.builtin.debug:
        msg: |
          MDS inventory successfully generated:

          {{ generated_inventory.stdout }}

          File location:
          {{ inventory_file }}


    # ---------------------------------------------------------
    # Store CMA information as AWX Artifact
    # ---------------------------------------------------------

    - name: Store MDS inventory as AWX artifact
      ansible.builtin.set_stats:
        data:
          mds_inventory: "{{ generated_inventory.stdout }}"
          mds_inventory_file: "{{ inventory_file }}"
          cma_list: "{{ generated_inventory.stdout_lines }}"
        per_host: false
