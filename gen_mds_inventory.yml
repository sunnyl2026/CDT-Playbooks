---
- name: Generate MDS CMA inventory
  hosts: all
  gather_facts: false

  vars:
    # Use the Python version available on the MDS.
    ansible_python_interpreter: /usr/bin/python3

    inventory_directory: /var/log/CDT_Project/Inventory
    inventory_file: /var/log/CDT_Project/Inventory/mds_inventory

  tasks:

    # =========================================================
    # 1. Run mdsstat once
    # =========================================================

    - name: Run mdsstat
      ansible.builtin.shell: |
        source /etc/profile.d/CP.sh
        mdsstat
      args:
        executable: /bin/bash
      register: mdsstat_output
      changed_when: false
      failed_when:
        - mdsstat_output.rc != 0

    - name: Display mdsstat output
      ansible.builtin.debug:
        var: mdsstat_output.stdout_lines


    # =========================================================
    # 2. Initialize structured CMA list
    #
    # Final structure:
    #
    # cma_inventory:
    #   - name: CMA1_Pri_SMS
    #     ip: 172.20.50.31
    #   - name: CMA2_SMS1
    #     ip: 172.20.50.41
    # =========================================================

    - name: Initialize structured CMA inventory
      ansible.builtin.set_fact:
        cma_inventory: []


    # =========================================================
    # 3. Extract CMA name and IP address
    #
    # mdsstat source format:
    #
    # | CMA | CMA1_Pri_SMS | 172.20.50.31 | up ... |
    #
    # split('|') produces:
    #
    # index 0 = empty
    # index 1 = CMA
    # index 2 = CMA1_Pri_SMS
    # index 3 = 172.20.50.31
    #
    # Using split avoids the previous awk quoting problem.
    # =========================================================

    - name: Build structured CMA inventory
      ansible.builtin.set_fact:
        cma_inventory: >-
          {{
            cma_inventory
            +
            [
              {
                'name': item.split('|')[2] | trim,
                'ip': item.split('|')[3] | trim
              }
            ]
          }}
      loop: "{{ mdsstat_output.stdout_lines }}"
      loop_control:
        label: "{{ item }}"
      when:
        - item.split('|') | length >= 4
        - item.split('|')[1] | trim == 'CMA'
        - item.split('|')[2] | trim | length > 0
        - item.split('|')[3] | trim | length > 0


    # =========================================================
    # 4. Show the structured CMA information
    # =========================================================

    - name: Display structured CMA inventory
      ansible.builtin.debug:
        var: cma_inventory


    # =========================================================
    # 5. Confirm at least one CMA was detected
    # =========================================================

    - name: Fail if no CMA was extracted
      ansible.builtin.fail:
        msg: |
          No CMA information could be extracted from mdsstat.

          Expected rows similar to:

          | CMA | CMA1_Pri_SMS | 172.20.50.31 | up ... |
      when:
        - cma_inventory | length == 0


    # =========================================================
    # 6. Validate each structured CMA entry
    # =========================================================

    - name: Validate structured CMA entries
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.ip is defined
          - item.name | length > 0
          - item.ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: "Invalid CMA inventory entry: {{ item }}"
        quiet: true
      loop: "{{ cma_inventory }}"
      loop_control:
        label: "{{ item.name | default('unknown CMA') }}"


    # =========================================================
    # 7. Generate text lines for the MDS inventory file
    #
    # Result:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1 172.20.50.41
    # =========================================================

    - name: Initialize MDS inventory file lines
      ansible.builtin.set_fact:
        mds_inventory_lines: []

    - name: Build MDS inventory file lines
      ansible.builtin.set_fact:
        mds_inventory_lines: >-
          {{
            mds_inventory_lines
            +
            [
              item.name ~ ' ' ~ item.ip
            ]
          }}
      loop: "{{ cma_inventory }}"
      loop_control:
        label: "{{ item.name }}"


    # =========================================================
    # 8. Ensure the parent directory exists
    #
    # Correct structure:
    #
    # /var/log/CDT_Project/Inventory/
    # └── mds_inventory
    #
    # mds_inventory must be a file, not a directory.
    # =========================================================

    - name: Ensure CDT Inventory parent directory exists
      ansible.builtin.file:
        path: "{{ inventory_directory }}"
        state: directory
        mode: "0755"


    # =========================================================
    # 9. Check the existing mds_inventory path
    # =========================================================

    - name: Check existing mds_inventory path
      ansible.builtin.stat:
        path: "{{ inventory_file }}"
      register: existing_inventory_path


    # =========================================================
    # 10. Remove the old incorrect directory
    #
    # Removes:
    #
    # /var/log/CDT_Project/Inventory/mds_inventory/
    #
    # only when mds_inventory is a directory.
    # An existing regular file is not removed.
    # =========================================================

    - name: Remove old incorrect mds_inventory directory
      ansible.builtin.file:
        path: "{{ inventory_file }}"
        state: absent
      when:
        - existing_inventory_path.stat.exists | default(false)
        - existing_inventory_path.stat.isdir | default(false)


    # =========================================================
    # 11. Write the MDS inventory file
    # =========================================================

    - name: Write MDS inventory file
      ansible.builtin.copy:
        content: "{{ mds_inventory_lines | join('\n') ~ '\n' }}"
        dest: "{{ inventory_file }}"
        mode: "0644"
        force: true
      register: inventory_write_result


    # =========================================================
    # 12. Verify the output path is a regular file
    # =========================================================

    - name: Check generated MDS inventory file
      ansible.builtin.stat:
        path: "{{ inventory_file }}"
      register: generated_inventory_stat

    - name: Verify mds_inventory is a regular file
      ansible.builtin.assert:
        that:
          - generated_inventory_stat.stat.exists | default(false)
          - generated_inventory_stat.stat.isreg | default(false)
          - not generated_inventory_stat.stat.isdir | default(false)
        fail_msg: >-
          {{ inventory_file }} was not created as a regular file.
        success_msg: >-
          {{ inventory_file }} was created successfully as a regular file.


    # =========================================================
    # 13. Read and verify the generated file
    # =========================================================

    - name: Read generated MDS inventory file
      ansible.builtin.slurp:
        src: "{{ inventory_file }}"
      register: generated_inventory_raw

    - name: Decode generated MDS inventory file
      ansible.builtin.set_fact:
        generated_inventory_content: >-
          {{
            generated_inventory_raw.content
            | b64decode
            | trim
          }}

    - name: Verify generated inventory file content
      ansible.builtin.assert:
        that:
          - generated_inventory_content == (mds_inventory_lines | join('\n'))
        fail_msg: |
          Generated inventory file does not match the structured CMA data.

          Expected:

          {{ mds_inventory_lines | join('\n') }}

          Actual:

          {{ generated_inventory_content }}
        success_msg: "Generated MDS inventory file content is correct."


    # =========================================================
    # 14. Display the final result in AWX
    # =========================================================

    - name: Display final MDS inventory result
      ansible.builtin.debug:
        msg:
          - "MDS inventory generated successfully"
          - "File: {{ inventory_file }}"
          - "CMA count: {{ cma_inventory | length }}"
          - "CMA inventory: {{ cma_inventory }}"


    # =========================================================
    # 15. Publish one simple structured AWX artifact
    #
    # Result:
    #
    # {
    #   "cma_inventory": [
    #     {
    #       "name": "CMA1_Pri_SMS",
    #       "ip": "172.20.50.31"
    #     },
    #     {
    #       "name": "CMA2_SMS1",
    #       "ip": "172.20.50.41"
    #     }
    #   ]
    # }
    # =========================================================

    - name: Publish structured CMA inventory artifact
      ansible.builtin.set_stats:
        data:
          cma_inventory: "{{ cma_inventory }}"
        per_host: false
