---
- name: Generate MDS CMA inventory
  hosts: all
  gather_facts: false

  vars:
    # Prevent the Python interpreter discovery warning shown in AWX.
    ansible_python_interpreter: /usr/bin/python3

    inventory_directory: /var/log/CDT_Project/Inventory
    inventory_file: /var/log/CDT_Project/Inventory/mds_inventory

  tasks:

    # =========================================================
    # 1. Run mdsstat once
    # =========================================================

    - name: Run mdsstat
      ansible.builtin.shell: |
        source /etc/profile.d/CP.sh
        mdsstat
      args:
        executable: /bin/bash
      register: mdsstat_output
      changed_when: false
      failed_when: mdsstat_output.rc != 0

    - name: Display mdsstat output
      ansible.builtin.debug:
        var: mdsstat_output.stdout_lines


    # =========================================================
    # 2. Initialize the CMA inventory list
    # =========================================================

    - name: Initialize CMA inventory list
      ansible.builtin.set_fact:
        cma_inventory_lines: []


    # =========================================================
    # 3. Extract CMA name and IP address
    #
    # Source line:
    # | CMA | CMA1_Pri_SMS | 172.20.50.31 | up ... |
    #
    # Result:
    # CMA1_Pri_SMS 172.20.50.31
    # =========================================================

    - name: Extract CMA name and IP from mdsstat
      ansible.builtin.set_fact:
        cma_inventory_lines: >-
          {{
            cma_inventory_lines
            +
            [
              item
              | regex_replace(
                  '^\|\s*CMA\s*\|\s*([^|]+?)\s*\|\s*([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\s*\|.*$',
                  '\1 \2'
                )
              | trim
            ]
          }}
      loop: >-
        {{
          mdsstat_output.stdout_lines
          | select('match', '^\|\s*CMA\s*\|')
          | list
        }}
      loop_control:
        label: "{{ item }}"


    # =========================================================
    # 4. Display extracted entries
    # =========================================================

    - name: Display extracted CMA inventory
      ansible.builtin.debug:
        msg:
          - "CMA count: {{ cma_inventory_lines | length }}"
          - "CMA entries: {{ cma_inventory_lines }}"


    # =========================================================
    # 5. Validate CMA extraction
    # =========================================================

    - name: Fail if no CMA was extracted
      ansible.builtin.fail:
        msg: |
          No CMA information could be extracted from mdsstat.

          Expected an mdsstat row similar to:

          | CMA | CMA1_Pri_SMS | 172.20.50.31 | up ... |
      when: cma_inventory_lines | length == 0


    # =========================================================
    # 6. Validate every extracted entry
    #
    # Required format:
    # CMA_NAME IPv4_ADDRESS
    # =========================================================

    - name: Validate extracted CMA entries
      ansible.builtin.assert:
        that:
          - item is match('^\S+\s+[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: "Invalid CMA inventory entry: {{ item }}"
        success_msg: "Valid CMA inventory entry: {{ item }}"
      loop: "{{ cma_inventory_lines }}"
      loop_control:
        label: "{{ item }}"


    # =========================================================
    # 7. Ensure only the parent Inventory directory exists
    #
    # Correct destination:
    #
    # /var/log/CDT_Project/Inventory/mds_inventory
    #
    # mds_inventory must be a file, not a directory.
    # =========================================================

    - name: Ensure CDT Inventory parent directory exists
      ansible.builtin.file:
        path: "{{ inventory_directory }}"
        state: directory
        mode: "0755"


    # =========================================================
    # 8. Check the current mds_inventory path
    # =========================================================

    - name: Check existing mds_inventory path
      ansible.builtin.stat:
        path: "{{ inventory_file }}"
      register: existing_inventory_path


    # =========================================================
    # 9. Remove the incorrectly created directory
    #
    # Old incorrect structure:
    #
    # /var/log/CDT_Project/Inventory/mds_inventory/
    # └── mds_inventory
    #
    # An existing correct regular file is not removed here.
    # =========================================================

    - name: Remove old incorrect mds_inventory directory
      ansible.builtin.file:
        path: "{{ inventory_file }}"
        state: absent
      when:
        - existing_inventory_path.stat.exists | default(false)
        - existing_inventory_path.stat.isdir | default(false)


    # =========================================================
    # 10. Write the inventory file
    #
    # Expected content:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1 172.20.50.41
    # =========================================================

    - name: Write MDS inventory file
      ansible.builtin.copy:
        content: "{{ cma_inventory_lines | join('\n') ~ '\n' }}"
        dest: "{{ inventory_file }}"
        mode: "0644"
        force: true
      register: inventory_write_result


    # =========================================================
    # 11. Confirm that mds_inventory is a regular file
    # =========================================================

    - name: Check generated MDS inventory file
      ansible.builtin.stat:
        path: "{{ inventory_file }}"
      register: generated_inventory_stat

    - name: Verify mds_inventory is a regular file
      ansible.builtin.assert:
        that:
          - generated_inventory_stat.stat.exists | default(false)
          - generated_inventory_stat.stat.isreg | default(false)
          - not generated_inventory_stat.stat.isdir | default(false)
        fail_msg: >-
          {{ inventory_file }} was not created as a regular file.
        success_msg: >-
          {{ inventory_file }} was created as a regular file.


    # =========================================================
    # 12. Read the generated file from MDS
    # =========================================================

    - name: Read generated MDS inventory file
      ansible.builtin.slurp:
        src: "{{ inventory_file }}"
      register: generated_inventory_raw

    - name: Decode generated inventory file
      ansible.builtin.set_fact:
        generated_inventory_content: >-
          {{
            generated_inventory_raw.content
            | b64decode
            | trim
          }}


    # =========================================================
    # 13. Verify file content matches extracted CMA data
    # =========================================================

    - name: Verify generated inventory content
      ansible.builtin.assert:
        that:
          - generated_inventory_content == (cma_inventory_lines | join('\n'))
        fail_msg: |
          Generated inventory file does not match the extracted CMA data.

          Extracted data:
          {{ cma_inventory_lines | join('\n') }}

          File content:
          {{ generated_inventory_content }}
        success_msg: "Generated inventory file content is correct."


    # =========================================================
    # 14. Display final result in AWX output
    # =========================================================

    - name: Display generated MDS inventory
      ansible.builtin.debug:
        msg: |
          MDS inventory generated successfully.

          File:
          {{ inventory_file }}

          CMA count:
          {{ cma_inventory_lines | length }}

          Content:
          {{ generated_inventory_content }}


    # =========================================================
    # 15. Publish AWX artifacts
    # =========================================================

    - name: Store MDS inventory as AWX artifacts
      ansible.builtin.set_stats:
        data:
          mds_inventory_file: "{{ inventory_file }}"
          mds_inventory: "{{ generated_inventory_content }}"
          cma_count: "{{ cma_inventory_lines | length }}"
          cma_list: "{{ cma_inventory_lines }}"
        per_host: false
