---
- name: Generate MDS CMA inventory
  hosts: all
  gather_facts: false

  vars:
    inventory_directory: "/var/log/CDT_Project/Inventory"
    inventory_file: "/var/log/CDT_Project/Inventory/mds_inventory"

  tasks:

    # =========================================================
    # 1. Run mdsstat once
    # =========================================================

    - name: Run mdsstat
      ansible.builtin.shell: |
        source /etc/profile.d/CP.sh
        mdsstat
      args:
        executable: /bin/bash
      register: mdsstat_output
      changed_when: false
      failed_when: mdsstat_output.rc != 0

    - name: Display mdsstat output
      ansible.builtin.debug:
        var: mdsstat_output.stdout_lines


    # =========================================================
    # 2. Parse CMA name and IP address
    #
    # Actual mdsstat format:
    #
    # | CMA | CMA1_Pri_SMS | 172.20.50.31 | up ... |
    #
    # Required output:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1 172.20.50.41
    # =========================================================

    - name: Extract CMA name and IP from mdsstat
      ansible.builtin.shell: |
        awk -F'|' '
          {
            type = $2
            name = $3
            ip   = $4

            gsub(/^[[:space:]]+|[[:space:]]+$/, "", type)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", ip)

            if (
              type == "CMA" &&
              name != "" &&
              ip ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/
            ) {
              print name, ip
            }
          }
        '
      args:
        executable: /bin/bash
        stdin: "{{ mdsstat_output.stdout }}"
      register: cma_inventory
      changed_when: false

    - name: Display extracted CMA inventory
      ansible.builtin.debug:
        var: cma_inventory.stdout_lines


    # =========================================================
    # 3. Validate the extracted CMA information
    # =========================================================

    - name: Fail if no CMA was extracted
      ansible.builtin.fail:
        msg: |
          No CMA information could be extracted from mdsstat.

          Review the mdsstat output shown earlier in this AWX job.
      when: cma_inventory.stdout | trim | length == 0


    # =========================================================
    # 4. Ensure only the parent Inventory directory exists
    #
    # Correct structure:
    #
    # /var/log/CDT_Project/Inventory/
    # └── mds_inventory
    #
    # "mds_inventory" must be a file, not a directory.
    # =========================================================

    - name: Ensure CDT Inventory parent directory exists
      ansible.builtin.file:
        path: "{{ inventory_directory }}"
        state: directory
        mode: "0755"


    # =========================================================
    # 5. Detect the existing mds_inventory path
    # =========================================================

    - name: Check existing mds_inventory path
      ansible.builtin.stat:
        path: "{{ inventory_file }}"
      register
