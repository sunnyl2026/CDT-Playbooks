---
- name: Generate Cluster or Gateway List for Selected CMA
  hosts: all
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    # Generated by the MDS inventory-generation playbook.
    mds_inventory_file: /var/log/CDT_Project/Inventory/mds_inventory

    # Directory for per-CMA inventory files.
    cdt_inventory_directory: /var/log/CDT_Project/Inventory

    # Resulting per-CMA inventory filename.
    #
    # Example:
    # /var/log/CDT_Project/Inventory/CMA2_SMS1_inventory.csv
    cma_inventory_suffix: "_inventory.csv"

  tasks:

    # =========================================================
    # 1. Validate the AWX Survey input
    # =========================================================

    - name: Verify selected CMA name was provided
      ansible.builtin.assert:
        that:
          - selected_cma_name is defined
          - selected_cma_name | string | trim | length > 0
        fail_msg: |
          No CMA was selected.

          Launch this Job Template through its AWX Survey and select
          one CMA using the selected_cma_name variable.
        success_msg: >-
          Selected CMA: {{ selected_cma_name }}

    - name: Normalize selected CMA name
      ansible.builtin.set_fact:
        selected_cma_name_normalized: "{{ selected_cma_name | trim }}"


    # =========================================================
    # 2. Validate the MDS inventory file
    # =========================================================

    - name: Check MDS inventory file
      ansible.builtin.stat:
        path: "{{ mds_inventory_file }}"
      register: mds_inventory_stat

    - name: Require the MDS inventory file
      ansible.builtin.assert:
        that:
          - mds_inventory_stat.stat.exists | default(false)
          - mds_inventory_stat.stat.isreg | default(false)
          - mds_inventory_stat.stat.size | default(0) | int > 0
        fail_msg: |
          The MDS inventory file is missing, is not a regular file,
          or is empty:

          {{ mds_inventory_file }}

          Run the MDS inventory-generation Job Template first.
        success_msg: "MDS inventory file is available."


    # =========================================================
    # 3. Read the MDS inventory
    #
    # Expected format:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1    172.20.50.41
    # CMA3_SMS1    172.20.50.42
    # =========================================================

    - name: Read MDS inventory file
      ansible.builtin.slurp:
        src: "{{ mds_inventory_file }}"
      register: mds_inventory_raw

    - name: Decode MDS inventory content
      ansible.builtin.set_fact:
        mds_inventory_content: >-
          {{
            mds_inventory_raw.content
            | b64decode
            | trim
          }}

    - name: Display current MDS inventory
      ansible.builtin.debug:
        msg: |
          Current MDS inventory:

          {{ mds_inventory_content }}


    # =========================================================
    # 4. Find the selected CMA without regular expressions
    #
    # The previous playbook used:
    #
    # [[:space:]]
    #
    # Python regex does not correctly support that POSIX syntax.
    # This version compares the first field directly.
    # =========================================================

    - name: Initialize matching CMA entries
      ansible.builtin.set_fact:
        selected_cma_matches: []

    - name: Find selected CMA in MDS inventory
      ansible.builtin.set_fact:
        selected_cma_matches: >-
          {{
            selected_cma_matches
            +
            [
              {
                'name': item.split()[0],
                'ip': item.split()[1],
                'line': item | trim
              }
            ]
          }}
      loop: "{{ mds_inventory_content.splitlines() }}"
      loop_control:
        label: "{{ item }}"
      when:
        - item | trim | length > 0
        - not (item | trim).startswith('#')
        - item.split() | length == 2
        - item.split()[0] == selected_cma_name_normalized


    # =========================================================
    # 5. Require exactly one matching CMA
    # =========================================================

    - name: Require exactly one matching CMA
      ansible.builtin.assert:
        that:
          - selected_cma_matches | length == 1
        fail_msg: |
          Expected exactly one entry for CMA
          "{{ selected_cma_name_normalized }}" in:

          {{ mds_inventory_file }}

          Matching entries found:
          {{ selected_cma_matches | length }}

          Current MDS inventory:

          {{ mds_inventory_content }}

          Regenerate the MDS inventory and refresh the AWX Survey
          if the selected CMA is no longer current.
        success_msg: >-
          Found exactly one inventory entry for
          {{ selected_cma_name_normalized }}.


    # =========================================================
    # 6. Set selected CMA name and IP
    # =========================================================

    - name: Set selected CMA information
      ansible.builtin.set_fact:
        selected_cma:
          name: "{{ selected_cma_matches[0].name }}"
          ip: "{{ selected_cma_matches[0].ip }}"

        selected_cma_line: "{{ selected_cma_matches[0].line }}"
        selected_cma_ip: "{{ selected_cma_matches[0].ip }}"


    # =========================================================
    # 7. Validate the selected CMA IP
    # =========================================================

    - name: Validate the selected CMA IP
      ansible.builtin.assert:
        that:
          - selected_cma_ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: |
          Invalid IP address found for CMA
          "{{ selected_cma_name_normalized }}":

          {{ selected_cma_ip }}
        success_msg: >-
          CMA {{ selected_cma_name_normalized }} resolved to
          {{ selected_cma_ip }}.

    - name: Display selected CMA information
      ansible.builtin.debug:
        msg:
          - "CMA name: {{ selected_cma.name }}"
          - "CMA IP: {{ selected_cma.ip }}"
          - "Inventory entry: {{ selected_cma_line }}"


    # =========================================================
    # 8. Define the final per-CMA inventory file
    # =========================================================

    - name: Define CMA inventory output file
      ansible.builtin.set_fact:
        cma_inventory_file: >-
          {{
            cdt_inventory_directory
            ~ '/'
            ~ selected_cma.name
            ~ cma_inventory_suffix
          }}

    - name: Display output file
      ansible.builtin.debug:
        msg: "CMA inventory output: {{ cma_inventory_file }}"


    # =========================================================
    # 9. Ensure the permanent output directory exists
    # =========================================================

    - name: Ensure CDT inventory directory exists
      ansible.builtin.file:
        path: "{{ cdt_inventory_directory }}"
        state: directory
        mode: "0755"


    # =========================================================
    # 10. Create the temporary working directory
    # =========================================================

    - name: Create temporary discovery directory
      ansible.builtin.tempfile:
        state: directory
        path: /tmp
        prefix: cdt-target-discovery-
      register: discovery_temp_directory


    # =========================================================
    # 11. Install, run and verify the discovery script
    #
    # The always section removes temporary files even when
    # CDT generation fails.
    # =========================================================

    - name: Generate selected CMA target inventory
      block:

        # -----------------------------------------------------
        # 11.1 Install the inventory-generation script
        # -----------------------------------------------------

        - name: Install the CDT inventory-generation script
          ansible.builtin.copy:
            dest: "{{ discovery_temp_directory.path }}/generate_inventory.sh"
            mode: "0755"
            content: |
              #!/bin/bash

              set -eo pipefail

              OUTPUT_FILE="{{ cma_inventory_file }}"
              TEMP_JSON="{{ discovery_temp_directory.path }}/gateways_and_servers.json"
              TEMP_LIST="{{ discovery_temp_directory.path }}/cma_targets.tmp"

              rm -f "${TEMP_JSON}" "${TEMP_LIST}"

              echo "Querying gateways and servers from the active CMA..."

              mgmt_cli show gateways-and-servers \
                details-level full \
                limit 500 \
                offset 0 \
                --format json \
                -r true > "${TEMP_JSON}"

              if [[ ! -s "${TEMP_JSON}" ]]; then
                  echo "ERROR: mgmt_cli returned no data." >&2
                  exit 10
              fi

              if ! jq -e . "${TEMP_JSON}" >/dev/null 2>&1; then
                  echo "ERROR: mgmt_cli output is not valid JSON." >&2
                  cat "${TEMP_JSON}" >&2
                  exit 11
              fi

              jq -r '
                (.objects // [])
                | .[]
                | select(
                    .type == "simple-gateway"
                    or .type == "cluster"
                    or .type == "CpmiGatewayCluster"
                    or .type == "CpmiHostCkp"
                  )
                | [
                    (.name // ""),
                    (
                      ."ipv4-address"
                      // ."ip-address"
                      // ."cluster-address"
                      // ""
                    )
                  ]
                | select(.[0] != "")
                | @tsv
              ' "${TEMP_JSON}" \
              | awk -F '\t' '
                  {
                      name = $1
                      ip = $2

                      gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
                      gsub(/^[[:space:]]+|[[:space:]]+$/, "", ip)

                      if (name != "" && ip != "") {
                          print name "," ip
                      } else if (name != "") {
                          print name ","
                      }
                  }
                ' \
              | sort -u > "${TEMP_LIST}"

              if [[ ! -s "${TEMP_LIST}" ]]; then
                  echo "ERROR: No gateway or cluster objects were found." >&2
                  exit 12
              fi

              install -m 0644 "${TEMP_LIST}" "${OUTPUT_FILE}"

              echo
              echo "Generated CMA inventory:"
              cat "${OUTPUT_FILE}"


        # -----------------------------------------------------
        # 11.2 Build one complete login-shell command
        #
        # Important:
        # Do not use "source $1". The complete command is passed
        # as one argument to Bash through argv.
        # -----------------------------------------------------

        - name: Build CMA login-shell command
          ansible.builtin.set_fact:
            cma_login_shell_command: >-
              set -eo pipefail;
              source /etc/profile.d/CP.sh;
              echo "Requested CMA: {{ selected_cma.name }}";
              echo "Requested CMA IP: {{ selected_cma.ip }}";
              mdsenv {{ selected_cma.name | quote }};
              echo "MDS environment switched successfully";
              echo "FWDIR=${FWDIR:-not-set}";
              echo "MDSDIR=${MDSDIR:-not-set}";
              command -v mdsenv;
              command -v mgmt_cli;
              command -v jq;
              command -v cdt-inventory-generation;
              cdt-inventory-generation
              {{ (discovery_temp_directory.path ~ '/generate_inventory.sh') | quote }}


        # -----------------------------------------------------
        # 11.3 Execute through a real Bash login shell
        #
        # argv ensures the complete command remains the single
        # argument following -c.
        # -----------------------------------------------------

        - name: Generate CMA CDT inventory in a login shell
          ansible.builtin.command:
            argv:
              - /bin/bash
              - -l
              - -c
              - "{{ cma_login_shell_command }}"
          register: cdt_generation_result
          changed_when: true
          failed_when: false


        # -----------------------------------------------------
        # 11.4 Always show stdout and stderr
        # -----------------------------------------------------

        - name: Display CDT generation output
          ansible.builtin.debug:
            msg:
              - "Return code: {{ cdt_generation_result.rc }}"
              - "STDOUT: {{ cdt_generation_result.stdout_lines | default([]) }}"
              - "STDERR: {{ cdt_generation_result.stderr_lines | default([]) }}"


        # -----------------------------------------------------
        # 11.5 Fail with the visible CDT error
        # -----------------------------------------------------

        - name: Verify CDT inventory-generation command succeeded
          ansible.builtin.assert:
            that:
              - cdt_generation_result.rc | int == 0
            fail_msg: |
              CDT inventory generation failed.

              CMA:
              {{ selected_cma.name }}

              CMA IP:
              {{ selected_cma.ip }}

              Return code:
              {{ cdt_generation_result.rc }}

              STDOUT:
              {{ cdt_generation_result.stdout | default('') }}

              STDERR:
              {{ cdt_generation_result.stderr | default('') }}
            success_msg: >-
              CDT inventory-generation command completed successfully.


        # -----------------------------------------------------
        # 11.6 Check generated inventory file
        # -----------------------------------------------------

        - name: Check generated CMA inventory file
          ansible.builtin.stat:
            path: "{{ cma_inventory_file }}"
          register: generated_cma_inventory_stat

        - name: Verify CMA inventory file was generated
          ansible.builtin.assert:
            that:
              - generated_cma_inventory_stat.stat.exists | default(false)
              - generated_cma_inventory_stat.stat.isreg | default(false)
              - generated_cma_inventory_stat.stat.size | default(0) | int > 0
            fail_msg: |
              CMA inventory file was not generated correctly:

              {{ cma_inventory_file }}
            success_msg: >-
              CMA inventory file was generated successfully.


        # -----------------------------------------------------
        # 11.7 Read the completed CMA inventory
        # -----------------------------------------------------

        - name: Read generated CMA inventory file
          ansible.builtin.slurp:
            src: "{{ cma_inventory_file }}"
          register: generated_cma_inventory_raw

        - name: Decode generated CMA inventory
          ansible.builtin.set_fact:
            generated_cma_inventory_content: >-
              {{
                generated_cma_inventory_raw.content
                | b64decode
                | trim
              }}

        - name: Convert generated inventory into a list
          ansible.builtin.set_fact:
            generated_cma_targets: >-
              {{
                generated_cma_inventory_content.splitlines()
              }}


        # -----------------------------------------------------
        # 11.8 Display the final inventory
        # -----------------------------------------------------

        - name: Display generated CMA inventory
          ansible.builtin.debug:
            msg:
              - "Selected CMA name: {{ selected_cma.name }}"
              - "Selected CMA IP: {{ selected_cma.ip }}"
              - "Inventory file: {{ cma_inventory_file }}"
              - "Target count: {{ generated_cma_targets | length }}"
              - "Targets: {{ generated_cma_targets }}"


        # -----------------------------------------------------
        # 11.9 Publish structured AWX artifacts
        # -----------------------------------------------------

        - name: Publish selected CMA and target inventory artifacts
          ansible.builtin.set_stats:
            data:
              selected_cma:
                name: "{{ selected_cma.name }}"
                ip: "{{ selected_cma.ip }}"

              cma_target_inventory:
                cma_name: "{{ selected_cma.name }}"
                cma_ip: "{{ selected_cma.ip }}"
                inventory_file: "{{ cma_inventory_file }}"
                target_count: "{{ generated_cma_targets | length }}"
                targets: "{{ generated_cma_targets }}"
            per_host: false


        # -----------------------------------------------------
        # 11.10 Display final summary
        # -----------------------------------------------------

        - name: Display final summary
          ansible.builtin.debug:
            msg:
              - "CMA target discovery completed successfully."
              - "CMA name: {{ selected_cma.name }}"
              - "CMA IP: {{ selected_cma.ip }}"
              - "Output file: {{ cma_inventory_file }}"
              - "Discovered targets: {{ generated_cma_targets | length }}"

      always:

        # -----------------------------------------------------
        # 11.11 Always remove the temporary directory
        # -----------------------------------------------------

        - name: Remove temporary discovery directory
          ansible.builtin.file:
            path: "{{ discovery_temp_directory.path }}"
            state: absent
          when:
            - discovery_temp_directory is defined
            - discovery_temp_directory.path is defined
