---
- name: Generate CDT candidate inventory and update Job Template 12 Survey
  hosts: all
  gather_facts: false

  vars:
    # =========================================================
    # MDS and CDT configuration
    # =========================================================

    ansible_python_interpreter: /usr/bin/python3

    mds_inventory_file: /var/log/CDT_Project/Inventory/mds_inventory
    cdt_inventory_directory: /var/log/CDT_Project/Inventory
    deployment_plan_file: /var/log/CDT_Project/Deployment_Plans/inventory.xml

    # =========================================================
    # AWX API configuration
    # =========================================================

    target_job_template_id: 12

    awx_controller_url: "http://172.20.50.28:30080"

    awx_oauth_token: >-
      {{
        lookup('ansible.builtin.env', 'AWX_OAUTH_TOKEN')
        | default('', true)
        | trim
      }}

    awx_validate_certs: false

  tasks:

    # =========================================================
    # 1. Validate selected CMA
    # =========================================================

    - name: Require selected CMA name
      ansible.builtin.assert:
        that:
          - selected_cma_name is defined
          - selected_cma_name | string | trim | length > 0
        fail_msg: |
          No CMA was selected.

          Launch this Job Template through the CMA Survey.

          Required Survey variable:
          selected_cma_name
        success_msg: >-
          Selected CMA: {{ selected_cma_name }}

    - name: Normalize selected CMA name
      ansible.builtin.set_fact:
        selected_cma_name_normalized: >-
          {{
            selected_cma_name
            | string
            | trim
          }}


    # =========================================================
    # 2. Validate MDS inventory
    # =========================================================

    - name: Check MDS inventory file
      ansible.builtin.stat:
        path: "{{ mds_inventory_file }}"
      register: mds_inventory_stat

    - name: Require MDS inventory file
      ansible.builtin.assert:
        that:
          - mds_inventory_stat.stat.exists | default(false)
          - mds_inventory_stat.stat.isreg | default(false)
          - mds_inventory_stat.stat.size | default(0) | int > 0
        fail_msg: |
          The MDS inventory file is missing or empty:

          {{ mds_inventory_file }}

          Run the MDS inventory-generation Job Template first.
        success_msg: >-
          MDS inventory file is available.


    # =========================================================
    # 3. Read MDS inventory
    # =========================================================

    - name: Read MDS inventory file
      ansible.builtin.slurp:
        src: "{{ mds_inventory_file }}"
      register: mds_inventory_raw

    - name: Decode MDS inventory
      ansible.builtin.set_fact:
        mds_inventory_content: >-
          {{
            mds_inventory_raw.content
            | b64decode
            | trim
          }}

    - name: Display current MDS inventory
      ansible.builtin.debug:
        msg: |
          Current MDS inventory:

          {{ mds_inventory_content }}


    # =========================================================
    # 4. Resolve selected CMA and IP
    # =========================================================

    - name: Initialize selected CMA matches
      ansible.builtin.set_fact:
        selected_cma_matches: []

    - name: Find selected CMA in MDS inventory
      ansible.builtin.set_fact:
        selected_cma_matches: >-
          {{
            selected_cma_matches
            +
            [
              {
                'name': item.split()[0],
                'ip': item.split()[1]
              }
            ]
          }}
      loop: "{{ mds_inventory_content.splitlines() }}"
      loop_control:
        label: "{{ item }}"
      when:
        - item | trim | length > 0
        - not (item | trim).startswith('#')
        - item.split() | length == 2
        - item.split()[0] == selected_cma_name_normalized

    - name: Require exactly one selected CMA match
      ansible.builtin.assert:
        that:
          - selected_cma_matches | length == 1
        fail_msg: |
          Expected exactly one inventory entry for CMA:

          {{ selected_cma_name_normalized }}

          Matching entries found:
          {{ selected_cma_matches | length }}

          Current MDS inventory:

          {{ mds_inventory_content }}
        success_msg: >-
          Found exactly one entry for
          {{ selected_cma_name_normalized }}.

    - name: Set selected CMA information
      ansible.builtin.set_fact:
        selected_cma:
          name: "{{ selected_cma_matches[0].name }}"
          ip: "{{ selected_cma_matches[0].ip }}"

    - name: Validate selected CMA IP
      ansible.builtin.assert:
        that:
          - selected_cma.ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: |
          Invalid IP address for {{ selected_cma.name }}:

          {{ selected_cma.ip }}
        success_msg: >-
          CMA {{ selected_cma.name }} resolved to
          {{ selected_cma.ip }}.

    - name: Display selected CMA
      ansible.builtin.debug:
        msg:
          - "CMA name: {{ selected_cma.name }}"
          - "CMA IP: {{ selected_cma.ip }}"


    # =========================================================
    # 5. Define CentralDeploymentTool values
    # =========================================================

    - name: Define CentralDeploymentTool values
      ansible.builtin.set_fact:
        cdt_session_name: "{{ selected_cma.name }}_session"

        cma_inventory_file: >-
          {{
            cdt_inventory_directory
            ~ '/'
            ~ selected_cma.name
            ~ '_inventory.csv'
          }}

    - name: Display CentralDeploymentTool values
      ansible.builtin.debug:
        msg:
          - "Session: {{ cdt_session_name }}"
          - "Candidates file: {{ cma_inventory_file }}"
          - "Deployment plan: {{ deployment_plan_file }}"
          - "Server: {{ selected_cma.ip }}"


    # =========================================================
    # 6. Validate required paths
    # =========================================================

    - name: Ensure CDT inventory directory exists
      ansible.builtin.file:
        path: "{{ cdt_inventory_directory }}"
        state: directory
        mode: "0755"

    - name: Check deployment plan
      ansible.builtin.stat:
        path: "{{ deployment_plan_file }}"
      register: deployment_plan_stat

    - name: Require deployment plan
      ansible.builtin.assert:
        that:
          - deployment_plan_stat.stat.exists | default(false)
          - deployment_plan_stat.stat.isreg | default(false)
          - deployment_plan_stat.stat.size | default(0) | int > 0
        fail_msg: |
          The deployment plan is missing or empty:

          {{ deployment_plan_file }}
        success_msg: >-
          CentralDeploymentTool deployment plan is available.


    # =========================================================
    # 7. Remove stale candidate inventory
    # =========================================================

    - name: Remove stale CMA candidate inventory
      ansible.builtin.file:
        path: "{{ cma_inventory_file }}"
        state: absent


    # =========================================================
    # 8. Build CentralDeploymentTool login-shell command
    # =========================================================

    - name: Build CentralDeploymentTool login-shell command
      ansible.builtin.set_fact:
        cdt_login_shell_command: |
          echo "===== CHECK POINT LOGIN SHELL ====="
          echo "User: $(whoami)"
          echo "Selected CMA: {{ selected_cma.name }}"
          echo "Selected CMA IP: {{ selected_cma.ip }}"

          if ! command -v mdsenv >/dev/null 2>&1; then
              echo "ERROR: mdsenv is unavailable in the login shell" >&2
              echo "PATH=${PATH}" >&2
              exit 20
          fi

          echo "mdsenv path: $(command -v mdsenv)"
          echo "===== SWITCH TO SELECTED CMA ====="

          mdsenv {{ selected_cma.name | quote }}
          MDSENV_RC=$?

          echo "mdsenv return code: ${MDSENV_RC}"

          if [ "${MDSENV_RC}" -ne 0 ]; then
              echo "ERROR: mdsenv failed for {{ selected_cma.name }}" >&2
              exit 21
          fi

          echo "===== CMA ENVIRONMENT ====="
          echo "FWDIR=${FWDIR:-NOT_SET}"
          echo "MDSDIR=${MDSDIR:-NOT_SET}"
          echo "CDTDIR=${CDTDIR:-NOT_SET}"

          if [ -z "${CDTDIR:-}" ]; then
              echo "ERROR: CDTDIR is undefined" >&2
              exit 22
          fi

          if [ ! -x "${CDTDIR}/CentralDeploymentTool" ]; then
              echo "ERROR: CentralDeploymentTool is missing or not executable:" >&2
              echo "${CDTDIR}/CentralDeploymentTool" >&2
              exit 23
          fi

          echo "CentralDeploymentTool path: ${CDTDIR}/CentralDeploymentTool"
          echo "===== RUN CENTRAL DEPLOYMENT TOOL ====="

          "${CDTDIR}/CentralDeploymentTool" -generate \
            -session={{ cdt_session_name | quote }} \
            -candidates={{ cma_inventory_file | quote }} \
            -deploymentplan={{ deployment_plan_file | quote }} \
            -server={{ selected_cma.ip | quote }}

          CDT_RC=$?

          echo "CentralDeploymentTool return code: ${CDT_RC}"

          exit "${CDT_RC}"


    # =========================================================
    # 9. Run CentralDeploymentTool in login shell
    # =========================================================

    - name: Generate CMA candidate inventory in login shell
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -l
          - -c
          - "{{ cdt_login_shell_command }}"
      register: cdt_generation_result
      changed_when: true
      failed_when: false

    - name: Display CentralDeploymentTool result
      ansible.builtin.debug:
        msg: |
          Return code:
          {{ cdt_generation_result.rc }}

          STDOUT:
          {{ cdt_generation_result.stdout | default('') }}

          STDERR:
          {{ cdt_generation_result.stderr | default('') }}

    - name: Require successful CentralDeploymentTool generation
      ansible.builtin.assert:
        that:
          - cdt_generation_result.rc | int == 0
        fail_msg: |
          CentralDeploymentTool inventory generation failed.

          CMA:
          {{ selected_cma.name }}

          CMA IP:
          {{ selected_cma.ip }}

          Return code:
          {{ cdt_generation_result.rc }}

          STDOUT:
          {{ cdt_generation_result.stdout | default('') }}

          STDERR:
          {{ cdt_generation_result.stderr | default('') }}
        success_msg: >-
          CentralDeploymentTool generated the candidate inventory.


    # =========================================================
    # 10. Validate generated candidate inventory
    # =========================================================

    - name: Check generated CMA candidate inventory
      ansible.builtin.stat:
        path: "{{ cma_inventory_file }}"
      register: cma_inventory_stat

    - name: Require generated CMA candidate inventory
      ansible.builtin.assert:
        that:
          - cma_inventory_stat.stat.exists | default(false)
          - cma_inventory_stat.stat.isreg | default(false)
          - cma_inventory_stat.stat.size | default(0) | int > 0
        fail_msg: |
          The generated candidate file is missing or empty:

          {{ cma_inventory_file }}
        success_msg: >-
          Generated CMA candidate inventory is available.


    # =========================================================
    # 11. Read generated candidate inventory
    # =========================================================

    - name: Read generated CMA candidate inventory
      ansible.builtin.slurp:
        src: "{{ cma_inventory_file }}"
      register: generated_inventory_raw

    - name: Decode generated CMA candidate inventory
      ansible.builtin.set_fact:
        generated_inventory_content: >-
          {{
            generated_inventory_raw.content
            | b64decode
            | trim
          }}

    - name: Display generated CMA candidate inventory
      ansible.builtin.debug:
        msg: |
          Generated candidate inventory:

          {{ generated_inventory_content }}


    # =========================================================
    # 12. Extract clusters and standalone gateways
    #
    # Cluster Name is not N/A:
    #   Add Cluster Name.
    #
    # Cluster Name is N/A:
    #   Add Gateway Name.
    # =========================================================

    - name: Initialize discovered target choices
      ansible.builtin.set_fact:
        discovered_target_choices: []

    - name: Extract cluster and gateway choices
      ansible.builtin.set_fact:
        discovered_target_choices: >-
          {{
            discovered_target_choices
            +
            [
              (
                (item.split(',')[1] | trim)
                ~ ' (Cluster)'
              )
              if (
                item.split(',')[1]
                | trim
                | upper
              ) != 'N/A'
              else
              (
                (item.split(',')[0] | trim)
                ~ ' (Gateway)'
              )
            ]
          }}
      loop: "{{ generated_inventory_content.splitlines() }}"
      loop_control:
        label: "{{ item }}"
      when:
        - item.split(',') | length >= 3
        - item.split(',')[0] | trim | length > 0
        - item.split(',')[1] | trim | length > 0
        - item.split(',')[2] | trim is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')


    # =========================================================
    # 13. Build unique Survey choices
    # =========================================================

    - name: Build unique sorted target choices
      ansible.builtin.set_fact:
        target_survey_choices: >-
          {{
            discovered_target_choices
            | unique
            | sort
            | list
          }}

    - name: Require target Survey choices
      ansible.builtin.assert:
        that:
          - target_survey_choices | length > 0
        fail_msg: |
          No cluster or standalone gateway choices were extracted
          from:

          {{ cma_inventory_file }}
        success_msg: >-
          Extracted {{ target_survey_choices | length }}
          unique target choices.

    - name: Display target Survey choices
      ansible.builtin.debug:
        msg:
          - "Target Job Template ID: {{ target_job_template_id }}"
          - "Choice count: {{ target_survey_choices | length }}"
          - "Choices: {{ target_survey_choices }}"


    # =========================================================
    # 14. Build AWX choices with real line-feed characters
    # =========================================================

    - name: Build AWX multiselect choices string
      ansible.builtin.set_fact:
        target_survey_choices_text: |-
          {% for target_choice in target_survey_choices %}
          {{ target_choice }}
          {% endfor %}

    - name: Display AWX multiselect choices
      ansible.builtin.debug:
        msg: |
          AWX multiselect choices:

          {{ target_survey_choices_text }}


    # =========================================================
    # 15. Validate AWX API configuration
    # =========================================================

    - name: Display AWX API credential status
      ansible.builtin.debug:
        msg:
          - "AWX Controller URL: {{ awx_controller_url }}"
          - "AWX OAuth token available: {{ (awx_oauth_token | length > 0) | bool }}"
          - "Target Job Template ID: {{ target_job_template_id }}"

    - name: Validate AWX API configuration
      ansible.builtin.assert:
        that:
          - awx_controller_url | trim | length > 0
          - not awx_controller_url.endswith('/')
          - awx_oauth_token | length > 0
          - target_job_template_id | int == 12
        fail_msg: |
          AWX API configuration is incomplete.

          Check the AWX controller URL and confirm the
          AWX API Token credential is attached.
        success_msg: >-
          AWX API configuration is available.


    # =========================================================
    # 16. Test AWX API
    # =========================================================

    - name: Test AWX API root
      ansible.builtin.uri:
        url: "{{ awx_controller_url }}/api/v2/"
        method: GET
        validate_certs: "{{ awx_validate_certs }}"
        return_content: false
        status_code: 200
      delegate_to: localhost
      run_once: true
      register: awx_api_test
      changed_when: false


    # =========================================================
    # 17. Verify Job Template 12 access
    # =========================================================

    - name: Check authenticated access to Job Template 12
      ansible.builtin.uri:
        url: >-
          {{ awx_controller_url }}/api/v2/job_templates/{{ target_job_template_id }}/
        method: GET
        headers:
          Authorization: "Bearer {{ awx_oauth_token }}"
          Accept: "application/json"
        validate_certs: "{{ awx_validate_certs }}"
        return_content: false
        status_code:
          - 200
          - 401
          - 403
          - 404
      delegate_to: localhost
      run_once: true
      register: target_template_test
      changed_when: false
      no_log: true

    - name: Display Job Template access status
      ansible.builtin.debug:
        msg:
          - "Job Template status: {{ target_template_test.status }}"
          - "Target Job Template ID: {{ target_job_template_id }}"

    - name: Require access to Job Template 12
      ansible.builtin.assert:
        that:
          - target_template_test.status | int == 200
        fail_msg: |
          Unable to access Job Template 12.

          HTTP status:
          {{ target_template_test.status }}
        success_msg: >-
          Job Template 12 is accessible.


    # =========================================================
    # 18. Update Job Template 12 multiselect Survey
    #
    # choices is a string with real LF separators.
    # default remains an empty string.
    # =========================================================

    - name: Update multiselect Survey on Job Template 12
      ansible.builtin.uri:
        url: >-
          {{ awx_controller_url }}/api/v2/job_templates/{{ target_job_template_id }}/survey_spec/
        method: POST

        headers:
          Authorization: "Bearer {{ awx_oauth_token }}"
          Accept: "application/json"
          Content-Type: "application/json"

        body_format: json

        body:
          name: "Cluster and Gateway Selection"

          description: >-
            Select one or more clusters or gateways from
            {{ selected_cma.name }}.

          spec:
            - question_name: "Select Cluster / Gateway"

              question_description: >-
                Select one or more targets for the CDT operation.

              required: true

              type: "multiselect"

              variable: "selected_target_choices"

              choices: "{{ target_survey_choices_text }}"

              default: ""

        validate_certs: "{{ awx_validate_certs }}"
        return_content: false

        status_code:
          - 200
          - 201
          - 400
          - 401
          - 403
          - 404

      delegate_to: localhost
      run_once: true
      register: survey_update_result
      no_log: true

    - name: Display Survey update status
      ansible.builtin.debug:
        msg:
          - "Survey update status: {{ survey_update_result.status }}"
          - "Target Job Template ID: {{ target_job_template_id }}"

    - name: Require successful Survey update
      ansible.builtin.assert:
        that:
          - survey_update_result.status | int in [200, 201]
        fail_msg: |
          Updating the multiselect Survey failed.

          HTTP status:
          {{ survey_update_result.status }}

          400 = AWX rejected the Survey specification.
          401 = Invalid or expired OAuth token.
          403 = Token owner lacks permission.
          404 = Job Template or Survey endpoint was not found.
        success_msg: >-
          Job Template 12 multiselect Survey was updated.


    # =========================================================
    # 19. Enable Survey
    # =========================================================

    - name: Enable Survey on Job Template 12
      ansible.builtin.uri:
        url: >-
          {{ awx_controller_url }}/api/v2/job_templates/{{ target_job_template_id }}/
        method: PATCH

        headers:
          Authorization: "Bearer {{ awx_oauth_token }}"
          Accept: "application/json"
          Content-Type: "application/json"

        body_format: json

        body:
          survey_enabled: true

        validate_certs: "{{ awx_validate_certs }}"
        return_content: false

        status_code:
          - 200
          - 400
          - 401
          - 403
          - 404

      delegate_to: localhost
      run_once: true
      register: survey_enable_result
      no_log: true

    - name: Display Survey enable status
      ansible.builtin.debug:
        msg:
          - "Survey enable status: {{ survey_enable_result.status }}"
          - "Target Job Template ID: {{ target_job_template_id }}"

    - name: Require successful Survey enablement
      ansible.builtin.assert:
        that:
          - survey_enable_result.status | int == 200
        fail_msg: >-
          Enabling the Survey failed with HTTP status
          {{ survey_enable_result.status }}.
        success_msg: >-
          Survey was enabled on Job Template 12.


    # =========================================================
    # 20. Retrieve final Survey
    # =========================================================

    - name: Retrieve final Survey specification
      ansible.builtin.uri:
        url: >-
          {{ awx_controller_url }}/api/v2/job_templates/{{ target_job_template_id }}/survey_spec/
        method: GET

        headers:
          Authorization: "Bearer {{ awx_oauth_token }}"
          Accept: "application/json"

        validate_certs: "{{ awx_validate_certs }}"
        return_content: true
        status_code: 200

      delegate_to: localhost
      run_once: true
      register: final_survey_spec
      changed_when: false
      no_log: true


    # =========================================================
    # 21. Verify final Survey
    # =========================================================

    - name: Verify final Survey structure
      ansible.builtin.assert:
        that:
          - final_survey_spec.json is defined
          - final_survey_spec.json.spec is defined
          - final_survey_spec.json.spec | length == 1
          - final_survey_spec.json.spec[0].variable == 'selected_target_choices'
          - final_survey_spec.json.spec[0].type == 'multiselect'
          - final_survey_spec.json.spec[0].required | bool
        fail_msg: >-
          Job Template 12 does not contain the expected
          selected_target_choices multiselect Survey.
        success_msg: >-
          Job Template 12 multiselect Survey structure is correct.

    - name: Normalize final Survey choices
      ansible.builtin.set_fact:
        final_survey_choices: >-
          {{
            final_survey_spec.json.spec[0].choices.splitlines()
            | map('trim')
            | reject('equalto', '')
            | list
          }}

    - name: Verify final Survey choices
      ansible.builtin.assert:
        that:
          - final_survey_choices == target_survey_choices
        fail_msg: |
          Final Survey choices do not match the generated choices.

          Expected:
          {{ target_survey_choices }}

          Stored:
          {{ final_survey_choices }}
        success_msg: >-
          Job Template 12 contains separate multiselect choices.

    - name: Display verified Survey choices
      ansible.builtin.debug:
        msg:
          - "Survey type: {{ final_survey_spec.json.spec[0].type }}"
          - "Survey variable: {{ final_survey_spec.json.spec[0].variable }}"
          - "Survey choices: {{ final_survey_choices }}"


    # =========================================================
    # 22. Final summary
    # =========================================================

    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - "CentralDeploymentTool inventory generated successfully."
          - "CMA name: {{ selected_cma.name }}"
          - "CMA IP: {{ selected_cma.ip }}"
          - "Candidates file: {{ cma_inventory_file }}"
          - "Target Job Template ID: {{ target_job_template_id }}"
          - "Survey type: Multiple Choice (multiple select)"
          - "Survey variable: selected_target_choices"
          - "Survey choices: {{ target_survey_choices }}"
