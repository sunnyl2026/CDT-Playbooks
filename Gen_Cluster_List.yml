---
- name: Generate Cluster or Gateway List for Selected CMA
  hosts: all
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    # MDS inventory generated by gen_mds_inventory.yml
    mds_inventory_file: /var/log/CDT_Project/Inventory/mds_inventory

    # CDT inventory directory
    cdt_inventory_directory: /var/log/CDT_Project/Inventory

    # Temporary working directory
    discovery_temp_prefix: /tmp/cdt-target-discovery-

  tasks:

    # =========================================================
    # 1. Verify the AWX Survey supplied a CMA name
    # =========================================================

    - name: Verify selected CMA name was provided
      ansible.builtin.assert:
        that:
          - selected_cma_name is defined
          - selected_cma_name | string | trim | length > 0
        fail_msg: |
          No CMA was selected.

          Launch this Job Template through the AWX Survey and select
          one CMA using the selected_cma_name survey variable.
        success_msg: >-
          Selected CMA: {{ selected_cma_name }}


    # =========================================================
    # 2. Check the MDS inventory file
    # =========================================================

    - name: Check MDS inventory file
      ansible.builtin.stat:
        path: "{{ mds_inventory_file }}"
      register: mds_inventory_stat

    - name: Require the MDS inventory file
      ansible.builtin.assert:
        that:
          - mds_inventory_stat.stat.exists | default(false)
          - mds_inventory_stat.stat.isreg | default(false)
          - mds_inventory_stat.stat.size | int > 0
        fail_msg: |
          The MDS inventory file is missing or empty:

          {{ mds_inventory_file }}

          Run the MDS inventory-generation Job Template first.
        success_msg: >-
          MDS inventory file is available.


    # =========================================================
    # 3. Read the MDS inventory
    # =========================================================

    - name: Read MDS inventory file
      ansible.builtin.slurp:
        src: "{{ mds_inventory_file }}"
      register: mds_inventory_raw

    - name: Decode MDS inventory content
      ansible.builtin.set_fact:
        mds_inventory_content: >-
          {{
            mds_inventory_raw.content
            | b64decode
            | trim
          }}


    # =========================================================
    # 4. Resolve selected CMA IP
    #
    # Expected file:
    #
    # CMA1_Pri_SMS 172.20.50.31
    # CMA2_SMS1    172.20.50.41
    # =========================================================

    - name: Resolve selected CMA entry from MDS inventory
      ansible.builtin.set_fact:
        selected_cma_matches: >-
          {{
            mds_inventory_content.splitlines()
            | select(
                'match',
                '^' ~ (selected_cma_name | regex_escape) ~ '[[:space:]]+'
              )
            | list
          }}

    - name: Require exactly one matching CMA
      ansible.builtin.assert:
        that:
          - selected_cma_matches | length == 1
        fail_msg: |
          Expected exactly one entry for CMA "{{ selected_cma_name }}"
          in {{ mds_inventory_file }}, but found:

          {{ selected_cma_matches | length }}

          Current MDS inventory:

          {{ mds_inventory_content }}

          Regenerate the MDS inventory and refresh the AWX Survey.
        success_msg: >-
          Found one inventory entry for {{ selected_cma_name }}.

    - name: Select the CMA inventory entry
      ansible.builtin.set_fact:
        selected_cma_line: "{{ selected_cma_matches | first }}"

    - name: Extract selected CMA IP
      ansible.builtin.set_fact:
        selected_cma_ip: "{{ selected_cma_line.split()[1] }}"

    - name: Validate selected CMA IP
      ansible.builtin.assert:
        that:
          - selected_cma_ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: >-
          Invalid IP address found for {{ selected_cma_name }}:
          {{ selected_cma_ip }}
        success_msg: >-
          Selected CMA IP: {{ selected_cma_ip }}


    # =========================================================
    # 5. Define final output path
    #
    # Example:
    #
    # /var/log/CDT_Project/Inventory/CMA1_Pri_SMS_inventory
    # =========================================================

    - name: Define CMA inventory output file
      ansible.builtin.set_fact:
        cma_inventory_file: >-
          {{
            cdt_inventory_directory
            ~ '/'
            ~ selected_cma_name
            ~ '_inventory'
          }}


    # =========================================================
    # 6. Ensure final inventory directory exists
    # =========================================================

    - name: Ensure CDT inventory directory exists
      ansible.builtin.file:
        path: "{{ cdt_inventory_directory }}"
        state: directory
        mode: "0755"


    # =========================================================
    # 7. Create temporary working directory
    # =========================================================

    - name: Create temporary discovery directory
      ansible.builtin.tempfile:
        state: directory
        path: /tmp
        prefix: cdt-target-discovery-
      register: discovery_temp_directory


    # =========================================================
    # 8. Install inventory-generation script
    #
    # The script runs after the playbook has entered the selected
    # CMA environment through a real Bash login shell.
    # =========================================================

    - name: Install the CDT inventory-generation script
      ansible.builtin.copy:
        dest: "{{ discovery_temp_directory.path }}/generate_inventory.sh"
        mode: "0755"
        content: |
          #!/bin/bash

          set -euo pipefail

          OUTPUT_FILE="{{ cma_inventory_file }}"
          TEMP_JSON="{{ discovery_temp_directory.path }}/gateways_and_servers.json"
          TEMP_LIST="{{ discovery_temp_directory.path }}/cma_targets.tmp"

          rm -f "${TEMP_JSON}" "${TEMP_LIST}"

          mgmt_cli show gateways-and-servers \
            details-level full \
            limit 500 \
            offset 0 \
            --format json \
            -r true > "${TEMP_JSON}"

          if [[ ! -s "${TEMP_JSON}" ]]; then
              echo "ERROR: mgmt_cli returned no data." >&2
              exit 10
          fi

          jq -r '
            (.objects // [])
            | .[]
            | select(
                .type == "simple-gateway"
                or .type == "cluster"
                or .type == "CpmiGatewayCluster"
                or .type == "CpmiHostCkp"
              )
            | [
                (.name // ""),
                (
                  ."ipv4-address"
                  // ."ip-address"
                  // ."cluster-address"
                  // ""
                )
              ]
            | select(.[0] != "")
            | @tsv
          ' "${TEMP_JSON}" \
          | awk -F '\t' '
              NF >= 1 {
                  name = $1
                  ip = $2

                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", ip)

                  if (name != "" && ip != "") {
                      print name, ip
                  } else if (name != "") {
                      print name
                  }
              }
            ' \
          | sort -u > "${TEMP_LIST}"

          if [[ ! -s "${TEMP_LIST}" ]]; then
              echo "ERROR: No gateway or cluster objects were found." >&2
              exit 11
          fi

          install -m 0644 "${TEMP_LIST}" "${OUTPUT_FILE}"

          echo "Generated inventory:"
          cat "${OUTPUT_FILE}"


    # =========================================================
    # 9. Build login-shell command
    #
    # Important:
    #
    # /bin/bash -l -c receives the whole following value as one
    # command argument. This avoids the broken command previously
    # shown in AWX:
    #
    # /bin/bash -lc source "$1" ...
    # =========================================================

    - name: Build CMA login-shell command
      ansible.builtin.set_fact:
        cma_login_shell_command: >-
          set -euo pipefail;
          source /etc/profile.d/CP.sh;
          mdsenv {{ selected_cma_name | quote }};
          echo "Active CMA: ${FWDIR:-not-set}";
          echo "CMA name: {{ selected_cma_name }}";
          echo "CMA IP: {{ selected_cma_ip }}";
          command -v mdsenv;
          command -v mgmt_cli;
          command -v jq;
          command -v cdt-inventory-generation;
          cdt-inventory-generation
          {{ (discovery_temp_directory.path ~ '/generate_inventory.sh') | quote }}


    # =========================================================
    # 10. Run in a real Bash login shell
    #
    # argv is used deliberately. It prevents YAML, Jinja and shell
    # quoting from splitting the -c command incorrectly.
    # =========================================================

    - name: Generate CMA CDT inventory in a login shell
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -l
          - -c
          - "{{ cma_login_shell_command }}"
      register: cdt_generation_result
      changed_when: true
      failed_when: cdt_generation_result.rc != 0


    # =========================================================
    # 11. Display command output
    # =========================================================

    - name: Display CDT generation output
      ansible.builtin.debug:
        msg:
          - "Return code: {{ cdt_generation_result.rc }}"
          - "STDOUT: {{ cdt_generation_result.stdout_lines }}"
          - "STDERR: {{ cdt_generation_result.stderr_lines }}"


    # =========================================================
    # 12. Check generated CMA inventory file
    # =========================================================

    - name: Check generated CMA inventory file
      ansible.builtin.stat:
        path: "{{ cma_inventory_file }}"
      register: generated_cma_inventory_stat

    - name: Verify CMA inventory file was generated
      ansible.builtin.assert:
        that:
          - generated_cma_inventory_stat.stat.exists | default(false)
          - generated_cma_inventory_stat.stat.isreg | default(false)
          - generated_cma_inventory_stat.stat.size | int > 0
        fail_msg: |
          CMA inventory file was not generated correctly:

          {{ cma_inventory_file }}

          CDT return code:
          {{ cdt_generation_result.rc }}

          CDT stdout:
          {{ cdt_generation_result.stdout }}

          CDT stderr:
          {{ cdt_generation_result.stderr }}
        success_msg: >-
          CMA inventory file was generated successfully.


    # =========================================================
    # 13. Read generated inventory
    # =========================================================

    - name: Read generated CMA inventory file
      ansible.builtin.slurp:
        src: "{{ cma_inventory_file }}"
      register: generated_cma_inventory_raw

    - name: Decode generated CMA inventory
      ansible.builtin.set_fact:
        generated_cma_inventory_content: >-
          {{
            generated_cma_inventory_raw.content
            | b64decode
            | trim
          }}

    - name: Convert generated inventory to a list
      ansible.builtin.set_fact:
        generated_cma_targets: >-
          {{
            generated_cma_inventory_content.splitlines()
          }}


    # =========================================================
    # 14. Display final generated inventory
    # =========================================================

    - name: Display generated CMA inventory
      ansible.builtin.debug:
        msg:
          - "Selected CMA name: {{ selected_cma_name }}"
          - "Selected CMA IP: {{ selected_cma_ip }}"
          - "Inventory file: {{ cma_inventory_file }}"
          - "Target count: {{ generated_cma_targets | length }}"
          - "Targets: {{ generated_cma_targets }}"


    # =========================================================
    # 15. Publish structured AWX artifacts
    #
    # These can be inherited by a later node in the same
    # AWX Workflow Job Template.
    # =========================================================

    - name: Publish selected CMA and target-list artifacts
      ansible.builtin.set_stats:
        data:
          selected_cma:
            name: "{{ selected_cma_name }}"
            ip: "{{ selected_cma_ip }}"

          cma_target_inventory:
            cma_name: "{{ selected_cma_name }}"
            cma_ip: "{{ selected_cma_ip }}"
            inventory_file: "{{ cma_inventory_file }}"
            targets: "{{ generated_cma_targets }}"
        per_host: false


    # =========================================================
    # 16. Final summary
    # =========================================================

    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - "CMA target discovery completed successfully."
          - "CMA name: {{ selected_cma_name }}"
          - "CMA IP: {{ selected_cma_ip }}"
          - "Output file: {{ cma_inventory_file }}"
          - "Discovered targets: {{ generated_cma_targets | length }}"


    # =========================================================
    # 17. Always clean temporary files
    # =========================================================

    - name: Remove temporary discovery directory
      ansible.builtin.file:
        path: "{{ discovery_temp_directory.path }}"
        state: absent
      when:
        - discovery_temp_directory is defined
        - discovery_temp_directory.path is defined
