---
# Discover the clusters and standalone gateways managed by one CMA, then
# replace one survey question on a target AWX Job Template with that list.
#
# Required survey input on this discovery Job Template:
#   selected_cma_name
#
# Optional input:
#   selected_cma_ip
# If selected_cma_ip is omitted, the playbook resolves it from mds_inventory.
#
# Controller credential injection on the AWX execution environment:
#   CONTROLLER_HOST=https://awx.example.com
#   CONTROLLER_OAUTH_TOKEN=<OAuth token>
#
# The CDT CSV format handled by the parser is:
#   Gateway Name, Cluster Name, IP Address, Version/HF Take, State, Upgrade Order
# Cluster-member rows are collapsed to one Cluster choice. A row whose
# Cluster Name is N/A becomes a standalone Gateway choice.

- name: Discover CMA targets and update the target-selection survey
  hosts: all
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_dir: /var/log/CDT_Project
    inventory_dir: "{{ project_dir }}/Inventory"
    mds_inventory_file: "{{ inventory_dir }}/mds_inventory"
    inventory_plan_file: "{{ project_dir }}/Deployment_Plans/inventory.xml"

    # Job Template whose survey receives the generated Cluster/Gateway choices.
    target_job_template_id: 12
    target_survey_variable: selected_target_choices
    target_survey_type: multiselect       # Use multiplechoice for one selection.
    target_survey_question: Select cluster/gateway target(s)
    target_survey_description: >-
      Select one or more clusters or standalone gateways managed by the
      selected CMA. Cluster members are intentionally not listed.

    # CDT normally must run in the Expert/admin login environment.
    cdt_become: false
    cdt_run_user: admin

    # Controller connection. Extra vars may override these defaults.
    controller_host: >-
      {{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') | default('', true) }}
    controller_oauth_token: >-
      {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') | default('', true) }}
    controller_validate_certs: true

  tasks:
    - name: Validate discovery inputs
      ansible.builtin.assert:
        that:
          - selected_cma_name is defined
          - selected_cma_name | string | length > 0
          - selected_cma_name | string is match('^[A-Za-z0-9_.-]+$')
          - target_job_template_id | int > 0
          - target_survey_type in ['multiplechoice', 'multiselect']
          - target_survey_variable is match('^[A-Za-z_][A-Za-z0-9_]*$')
        fail_msg: >-
          Supply a safe selected_cma_name and valid target Job Template/survey
          settings. CMA names may contain letters, numbers, underscore, dash,
          and dot only.

    - name: Create a private temporary working directory
      ansible.builtin.tempfile:
        state: directory
        prefix: cdt-target-discovery-
      register: discovery_tmp
      become: "{{ cdt_become | bool }}"
      become_user: "{{ cdt_run_user }}"

    - name: Set run-specific paths
      ansible.builtin.set_fact:
        selected_cma_name_normalized: "{{ selected_cma_name | string }}"
        cma_inventory_csv: >-
          {{ inventory_dir }}/{{ selected_cma_name | string }}_inventory.csv
        cma_target_json: >-
          {{ inventory_dir }}/{{ selected_cma_name | string }}_targets.json
        cdt_session_name: "{{ selected_cma_name | string }}_session"
        resolve_script: "{{ discovery_tmp.path }}/resolve_cma_ip.py"
        generate_script: "{{ discovery_tmp.path }}/generate_inventory.sh"
        parser_script: "{{ discovery_tmp.path }}/parse_cdt_inventory.py"

    - name: Run discovery and parse the CDT inventory
      block:
        - name: Check the CDT inventory deployment plan
          ansible.builtin.stat:
            path: "{{ inventory_plan_file }}"
          register: inventory_plan_status
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Require the inventory deployment plan
          ansible.builtin.assert:
            that:
              - inventory_plan_status.stat.exists
              - inventory_plan_status.stat.isreg
            fail_msg: "Inventory deployment plan not found: {{ inventory_plan_file }}"

        - name: Install the CMA-IP resolver
          ansible.builtin.copy:
            dest: "{{ resolve_script }}"
            mode: '0700'
            content: |
              #!/usr/bin/env python3
              import ipaddress
              import re
              import sys

              source, selected_name = sys.argv[1:3]
              matches = []

              with open(source, encoding="utf-8-sig") as handle:
                  for line_number, raw_line in enumerate(handle, 1):
                      line = raw_line.strip()
                      if not line or line.startswith("#"):
                          continue

                      # Supports either "CMA IP" or "CMA,IP" inventory lines.
                      fields = [
                          field.strip().strip('"').strip("'")
                          for field in re.split(r"[\s,]+", line)
                          if field.strip()
                      ]
                      if selected_name not in fields:
                          continue

                      selected_index = fields.index(selected_name)
                      candidates = fields[selected_index + 1:]
                      for candidate in candidates:
                          try:
                              parsed_ip = ipaddress.ip_address(candidate)
                          except ValueError:
                              continue
                          matches.append((line_number, str(parsed_ip)))
                          break

              unique_ips = sorted({address for _, address in matches})
              if not unique_ips:
                  raise SystemExit(
                      f"CMA {selected_name!r} was not found with a valid IP in {source}."
                  )
              if len(unique_ips) != 1:
                  raise SystemExit(
                      f"CMA {selected_name!r} maps to multiple IPs in {source}: "
                      + ", ".join(unique_ips)
                  )
              print(unique_ips[0])
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Check the MDS inventory when the CMA IP was not supplied
          ansible.builtin.stat:
            path: "{{ mds_inventory_file }}"
          register: mds_inventory_status
          when: selected_cma_ip | default('') | string | trim | length == 0
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Require the MDS inventory when resolving the CMA IP
          ansible.builtin.assert:
            that:
              - mds_inventory_status.stat.exists
              - mds_inventory_status.stat.isreg
            fail_msg: "MDS inventory not found: {{ mds_inventory_file }}"
          when: selected_cma_ip | default('') | string | trim | length == 0

        - name: Resolve the selected CMA IP from the MDS inventory
          ansible.builtin.command:
            argv:
              - python3
              - "{{ resolve_script }}"
              - "{{ mds_inventory_file }}"
              - "{{ selected_cma_name_normalized }}"
          register: resolved_cma_ip
          changed_when: false
          when: selected_cma_ip | default('') | string | trim | length == 0
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Select the CMA IP
          ansible.builtin.set_fact:
            selected_cma_ip_normalized: >-
              {{
                (selected_cma_ip | string | trim)
                if (selected_cma_ip | default('') | string | trim | length > 0)
                else (resolved_cma_ip.stdout | trim)
              }}

        - name: Validate the selected CMA IP
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - >-
                import ipaddress,sys;
                print(ipaddress.ip_address(sys.argv[1]))
              - "{{ selected_cma_ip_normalized }}"
          register: validated_cma_ip
          changed_when: false
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Install the CDT inventory-generation script
          ansible.builtin.copy:
            dest: "{{ generate_script }}"
            mode: '0700'
            content: |
              #!/usr/bin/env bash
              set -Eeuo pipefail

              : "${SELECTED_CMA_NAME:?SELECTED_CMA_NAME is required}"
              : "${SELECTED_CMA_IP:?SELECTED_CMA_IP is required}"
              : "${CDT_SESSION_NAME:?CDT_SESSION_NAME is required}"
              : "${CDT_CANDIDATES_FILE:?CDT_CANDIDATES_FILE is required}"
              : "${CDT_PLAN_FILE:?CDT_PLAN_FILE is required}"

              command -v mdsenv >/dev/null 2>&1 || {
                echo "mdsenv is unavailable in the login shell" >&2
                exit 20
              }

              mdsenv "${SELECTED_CMA_NAME}" >/dev/null

              : "${CDTDIR:?CDTDIR is not set by the login environment}"
              cdt_binary="${CDTDIR}/CentralDeploymentTool"
              [[ -x "${cdt_binary}" ]] || {
                echo "CDT binary is not executable: ${cdt_binary}" >&2
                exit 21
              }

              mkdir -p "$(dirname "${CDT_CANDIDATES_FILE}")"

              "${cdt_binary}" -generate \
                -session="${CDT_SESSION_NAME}" \
                -candidates="${CDT_CANDIDATES_FILE}" \
                -deploymentplan="${CDT_PLAN_FILE}" \
                -server="${SELECTED_CMA_IP}"
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Generate the CMA CDT inventory in a login shell
          ansible.builtin.command:
            argv:
              - /bin/bash
              - -lc
              - 'source "$1"'
              - cdt-inventory-generation
              - "{{ generate_script }}"
          environment:
            SELECTED_CMA_NAME: "{{ selected_cma_name_normalized }}"
            SELECTED_CMA_IP: "{{ selected_cma_ip_normalized }}"
            CDT_SESSION_NAME: "{{ cdt_session_name }}"
            CDT_CANDIDATES_FILE: "{{ cma_inventory_csv }}"
            CDT_PLAN_FILE: "{{ inventory_plan_file }}"
          register: cdt_generate
          changed_when: true
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Check the generated CDT inventory CSV
          ansible.builtin.stat:
            path: "{{ cma_inventory_csv }}"
          register: cma_inventory_status
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Require a non-empty CDT inventory CSV
          ansible.builtin.assert:
            that:
              - cma_inventory_status.stat.exists
              - cma_inventory_status.stat.isreg
              - cma_inventory_status.stat.size | int > 0
            fail_msg: "CDT did not create a non-empty inventory: {{ cma_inventory_csv }}"

        - name: Install the CDT inventory parser
          ansible.builtin.copy:
            dest: "{{ parser_script }}"
            mode: '0700'
            content: |
              #!/usr/bin/env python3
              import csv
              import datetime as dt
              import ipaddress
              import json
              import os
              import sys
              import tempfile
              import unicodedata

              source, destination, cma_name, cma_ip = sys.argv[1:5]
              ipaddress.ip_address(cma_ip)

              def clean(value):
                  return (value or "").replace("\ufeff", "").strip()

              def normalize_header(value):
                  return " ".join(clean(value).casefold().split())

              def safe_choice_name(value, field_name, row_number):
                  value = clean(value)
                  if not value:
                      raise SystemExit(
                          f"Empty {field_name} in CDT CSV row {row_number}."
                      )
                  if len(value) > 512:
                      raise SystemExit(
                          f"{field_name} exceeds 512 characters in row {row_number}."
                      )
                  if any(unicodedata.category(char).startswith("C") for char in value):
                      raise SystemExit(
                          f"Control character in {field_name} in row {row_number}."
                      )
                  return value

              with open(source, newline="", encoding="utf-8-sig") as handle:
                  sample = handle.read(8192)
                  handle.seek(0)
                  try:
                      dialect = csv.Sniffer().sniff(sample, delimiters=",")
                  except csv.Error:
                      dialect = csv.excel

                  reader = csv.DictReader(handle, dialect=dialect)
                  if not reader.fieldnames:
                      raise SystemExit(f"No CSV header found in {source}.")

                  original_headers = list(reader.fieldnames)
                  header_map = {
                      normalize_header(header): header
                      for header in original_headers
                      if header is not None
                  }

                  gateway_header = next(
                      (
                          header_map[key]
                          for key in ("gateway name", "object name")
                          if key in header_map
                      ),
                      None,
                  )
                  cluster_header = header_map.get("cluster name")

                  if gateway_header is None or cluster_header is None:
                      raise SystemExit(
                          "Required CDT CSV columns were not found. Expected "
                          "'Gateway Name' and 'Cluster Name'; found: "
                          + ", ".join(clean(header) for header in original_headers)
                      )

                  targets_by_name = {}
                  cluster_na_values = {"", "n/a", "na", "none", "null", "-"}

                  for row_number, row in enumerate(reader, start=2):
                      gateway_name = clean(row.get(gateway_header))
                      cluster_name = clean(row.get(cluster_header))

                      # Skip wholly blank records.
                      if not gateway_name and not cluster_name:
                          continue

                      if cluster_name.casefold() not in cluster_na_values:
                          target_name = safe_choice_name(
                              cluster_name, "Cluster Name", row_number
                          )
                          target_type = "Cluster"
                      else:
                          target_name = safe_choice_name(
                              gateway_name, "Gateway Name", row_number
                          )
                          target_type = "Gateway"

                      previous_type = targets_by_name.get(target_name)
                      if previous_type and previous_type != target_type:
                          raise SystemExit(
                              f"Target {target_name!r} appears as both "
                              f"{previous_type} and {target_type}."
                          )
                      targets_by_name[target_name] = target_type

              targets = [
                  {"name": name, "type": target_type}
                  for name, target_type in targets_by_name.items()
              ]
              targets.sort(
                  key=lambda item: (
                      0 if item["type"] == "Cluster" else 1,
                      item["name"].casefold(),
                  )
              )

              if not targets:
                  raise SystemExit(
                      "No clusters or standalone gateways were found in " + source
                  )

              payload = {
                  "schema_version": 1,
                  "cma_name": cma_name,
                  "cma_ip": cma_ip,
                  "generated_at_utc": dt.datetime.now(dt.timezone.utc)
                      .replace(microsecond=0)
                      .isoformat(),
                  "generated_from": source,
                  "targets": targets,
              }

              destination_dir = os.path.dirname(destination)
              os.makedirs(destination_dir, mode=0o750, exist_ok=True)
              file_descriptor, temporary_path = tempfile.mkstemp(
                  prefix=".targets-",
                  suffix=".json",
                  dir=destination_dir,
                  text=True,
              )
              try:
                  with os.fdopen(
                      file_descriptor, "w", encoding="utf-8"
                  ) as handle:
                      json.dump(payload, handle, indent=2, ensure_ascii=False)
                      handle.write("\n")
                  os.chmod(temporary_path, 0o640)
                  os.replace(temporary_path, destination)
              finally:
                  if os.path.exists(temporary_path):
                      os.unlink(temporary_path)

              for target in targets:
                  print(f'{target["name"]} --- {target["type"]}')
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Extract unique clusters and standalone gateways
          ansible.builtin.command:
            argv:
              - python3
              - "{{ parser_script }}"
              - "{{ cma_inventory_csv }}"
              - "{{ cma_target_json }}"
              - "{{ selected_cma_name_normalized }}"
              - "{{ selected_cma_ip_normalized }}"
          register: parsed_targets
          changed_when: true
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Read the validated target inventory
          ansible.builtin.slurp:
            src: "{{ cma_target_json }}"
          register: target_inventory_raw
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

        - name: Decode the validated target inventory
          ansible.builtin.set_fact:
            target_inventory: >-
              {{ target_inventory_raw.content | b64decode | from_json }}
            target_choices: >-
              {{ parsed_targets.stdout_lines | reject('equalto', '') | list }}

        - name: Validate the generated target inventory
          ansible.builtin.assert:
            that:
              - target_inventory.cma_name == selected_cma_name_normalized
              - target_inventory.cma_ip == selected_cma_ip_normalized
              - target_inventory.targets | length > 0
              - target_choices | length == target_inventory.targets | length
            fail_msg: "Generated target inventory failed validation."

      always:
        - name: Remove the temporary discovery directory
          ansible.builtin.file:
            path: "{{ discovery_tmp.path }}"
            state: absent
          when: discovery_tmp.path is defined
          become: "{{ cdt_become | bool }}"
          become_user: "{{ cdt_run_user }}"

    - name: Validate Controller API settings
      ansible.builtin.assert:
        that:
          - controller_host | string | trim | length > 0
          - controller_oauth_token | string | trim | length > 0
        fail_msg: >-
          Inject CONTROLLER_HOST and CONTROLLER_OAUTH_TOKEN, or provide the
          equivalent extra vars. The token needs update permission for the
          target Job Template.
      no_log: true

    - name: Normalize the Controller base URL
      ansible.builtin.set_fact:
        controller_base_url: "{{ controller_host | regex_replace('/+$', '') }}"

    - name: Get the target Job Template
      ansible.builtin.uri:
        url: "{{ controller_base_url }}/api/v2/job_templates/{{ target_job_template_id }}/"
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauth_token }}"
        return_content: true
        validate_certs: "{{ controller_validate_certs | bool }}"
        status_code: 200
      register: target_job_template
      delegate_to: localhost
      no_log: true

    - name: Get the current target survey
      ansible.builtin.uri:
        url: >-
          {{ controller_base_url }}/api/v2/job_templates/{{ target_job_template_id }}/survey_spec/
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauth_token }}"
        return_content: true
        validate_certs: "{{ controller_validate_certs | bool }}"
        status_code: 200
      register: current_survey
      delegate_to: localhost
      no_log: true

    - name: Build the replacement target question
      ansible.builtin.set_fact:
        replacement_target_question:
          question_name: "{{ target_survey_question }}"
          question_description: "{{ target_survey_description }}"
          required: true
          type: "{{ target_survey_type }}"
          variable: "{{ target_survey_variable }}"
          min: null
          max: null
          default: ''
          choices: "{{ target_choices | join('\n') }}"
          new_question: true

    - name: Preserve all survey questions except the generated target question
      ansible.builtin.set_fact:
        retained_survey_questions: >-
          {{
            current_survey.json.spec
            | default([], true)
            | rejectattr('variable', 'equalto', target_survey_variable)
            | list
          }}

    - name: Build the updated survey specification
      ansible.builtin.set_fact:
        updated_survey:
          name: >-
            {{ current_survey.json.name | default('CDT target selection', true) }}
          description: >-
            {{
              current_survey.json.description
              | default('Generated from the current CMA CDT inventory.', true)
            }}
          spec: "{{ retained_survey_questions + [replacement_target_question] }}"

    - name: Replace the target Job Template survey specification
      ansible.builtin.uri:
        url: >-
          {{ controller_base_url }}/api/v2/job_templates/{{ target_job_template_id }}/survey_spec/
        method: POST
        headers:
          Authorization: "Bearer {{ controller_oauth_token }}"
        body_format: json
        body: "{{ updated_survey }}"
        return_content: true
        validate_certs: "{{ controller_validate_certs | bool }}"
        status_code:
          - 200
          - 201
      delegate_to: localhost
      no_log: true

    - name: Parse the existing target Job Template extra variables
      ansible.builtin.set_fact:
        existing_target_extra_vars: >-
          {{
            target_job_template.json.extra_vars
            | default('{}', true)
            | from_yaml
            | default({}, true)
          }}

    - name: Require mapping-form extra variables on the target template
      ansible.builtin.assert:
        that:
          - existing_target_extra_vars is mapping
        fail_msg: >-
          Job Template {{ target_job_template_id }} extra_vars must decode to a
          YAML/JSON mapping before CMA context can be merged safely.

    - name: Build the validated CMA context for Job Template 12
      ansible.builtin.set_fact:
        generated_target_context:
          selected_cma_name: "{{ selected_cma_name_normalized }}"
          selected_cma_ip: "{{ selected_cma_ip_normalized }}"
          target_inventory_file: "{{ cma_target_json }}"
          target_inventory_generated_at_utc: >-
            {{ target_inventory.generated_at_utc }}

    - name: Enable the survey and publish the CMA context
      ansible.builtin.uri:
        url: "{{ controller_base_url }}/api/v2/job_templates/{{ target_job_template_id }}/"
        method: PATCH
        headers:
          Authorization: "Bearer {{ controller_oauth_token }}"
        body_format: json
        body:
          survey_enabled: true
          extra_vars: >-
            {{
              existing_target_extra_vars
              | combine(generated_target_context, recursive=true)
              | to_nice_yaml(indent=2, sort_keys=false)
            }}
        return_content: true
        validate_certs: "{{ controller_validate_certs | bool }}"
        status_code: 200
      delegate_to: localhost
      no_log: true

    - name: Show the generated target menu
      ansible.builtin.debug:
        msg:
          cma_name: "{{ selected_cma_name_normalized }}"
          cma_ip: "{{ selected_cma_ip_normalized }}"
          source_csv: "{{ cma_inventory_csv }}"
          validation_inventory: "{{ cma_target_json }}"
          updated_job_template_id: "{{ target_job_template_id }}"
          survey_variable: "{{ target_survey_variable }}"
          survey_type: "{{ target_survey_type }}"
          choices: "{{ target_choices }}"
          concurrency_warning: >-
            Job Template {{ target_job_template_id }} has one shared survey and
            shared extra_vars. The latest discovery run replaces the previous
            CMA context. Do not run overlapping discovery/selection sessions.
