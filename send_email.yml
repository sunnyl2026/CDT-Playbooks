---
- name: Send CDT prerequisite log directly from MDS
  hosts: mds
  gather_facts: false

  vars:
    gateway_name: "GW101"

    smtp_server: "172.20.50.29"
    smtp_port: 25

    mail_from: "cdtadmin@hkps.cp"
    mail_to: "sunny@hkps.cp"

    log_file: "/var/log/CDT_Project/Gateway_Logs/{{ gateway_name }}_pre_requisite_check.log"

  tasks:

    - name: Check prerequisite log exists
      ansible.builtin.stat:
        path: "{{ log_file }}"
      register: log_status

    - name: Fail if log does not exist
      ansible.builtin.fail:
        msg: "Log file does not exist: {{ log_file }}"
      when: not log_status.stat.exists

    - name: Send prerequisite log directly from MDS
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        from: "{{ mail_from }}"
        to:
          - "{{ mail_to }}"
        subject: "{{ gateway_name }} - Pre-Requisite Check Result"

        body: |
          Hello,

          The CDT pre-requisite check for {{ gateway_name }} has completed.

          Please find the prerequisite check log attached.

          Target: {{ gateway_name }}
          Log file: {{ gateway_name }}_pre_requisite_check.log

          Regards,
          CDT Automation

        attach:
          - "{{ log_file }}"
